/* ============ 悬浮说明（[data-tip]，桌面 hover / 触屏点击固定） ============ */
let _tipEl=null, _tipTgt=null, _tipPin=null;
function tipNode(){
  if(!_tipEl){ _tipEl=document.createElement("div"); _tipEl.className="tip"; _tipEl.style.opacity="0"; document.body.appendChild(_tipEl); }
  return _tipEl;
}
function tipShow(txt, cx, cy){
  const t=tipNode(); t.innerHTML=txt; t.style.opacity="1";
  t.style.left="0"; t.style.top="0"; tipPos(cx,cy);
}
function tipPos(cx, cy){
  const t=_tipEl; if(!t) return;
  const w=t.offsetWidth, h=t.offsetHeight;
  let l=cx+14, tt=cy+14;
  if(l+w>window.innerWidth-8) l=cx-w-12;
  if(tt+h>window.innerHeight-8) tt=cy-h-12;
  if(l<8) l=8; if(tt<8) tt=8;
  t.style.left=l+"px"; t.style.top=tt+"px";
}
function tipHide(){ if(_tipEl) _tipEl.style.opacity="0"; _tipTgt=null; _tipPin=null; }
function tipElOf(ev){ const t=ev.target; return t && t.closest ? t.closest("[data-tip]") : null; }
document.addEventListener("mouseover", ev=>{
  const el=tipElOf(ev); if(!el) return;
  _tipTgt=el; tipShow(el.getAttribute("data-tip"), ev.clientX, ev.clientY);
});
document.addEventListener("mousemove", ev=>{
  if(_tipTgt && !_tipPin && _tipEl && _tipEl.style.opacity==="1") tipPos(ev.clientX, ev.clientY);
});
document.addEventListener("mouseout", ev=>{
  if(_tipPin) return;
  const el=tipElOf(ev); if(el && el===_tipTgt) tipHide();
});
document.addEventListener("click", ev=>{
  const el=tipElOf(ev);
  if(el){
    if(_tipPin===el){ tipHide(); }
    else { const r=el.getBoundingClientRect(); _tipPin=el; _tipTgt=el; tipShow(el.getAttribute("data-tip"), r.left+8, r.bottom+6); }
  } else if(_tipPin){ tipHide(); }
});

/* ============ 资产组合（多标的组合回测 · 综合波动率） ============ */
/* 数据：state.portfolios = [{id, name, totalCapital, members:[{gridId, weight}], createdAt}] */
function pfList(){ return (state.portfolios && Array.isArray(state.portfolios))? state.portfolios : []; }
function getPf(id){ return pfList().find(p=>p.id===id)||null; }
/* 标的是否已被任一已保存的资产组合纳入（用于总览自动去重与隐藏） */
function pfMembersOfGrid(gid){
  return pfList().some(pf => (pf.members||[]).some(m=>m.gridId===gid));
}
function genPfId(){ return "pf_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,6); }
function pfMembers(pf){ return (pf.members||[]).map(m=>Object.assign({},m,{g:getGrid(m.gridId)})).filter(m=>m.g); }
/* 组合是否「条件单全部建立」：所有启用成员均已配置条件单（configured≠false）。用于收益总览模块在建立前显示回测、建立后切换为实际利润+实时总资产 */
function pfCondAllConfigured(pf){
  const ms=pfMembers(pf);
  if(!ms.length) return false;
  return ms.every(m=>(m.on!==false) && isConfigured(m.g));
}
/* 权重归一化（未按比例配平的草稿/组合都按占比归一） */
function pfNormWeights(items){
  const s=items.reduce((a,m)=>a+Math.max(0,Number(m.weight)||0),0);
  return items.map(m=> s>0 ? Math.max(0,Number(m.weight)||0)/s : (items.length? 1/items.length : 0));
}
/* 组合计算用的行情序列：已停止网格截断到停止日（与详情页收益冻结口径一致） */
function pfSeriesOf(g){
  const raw=rawSeriesOf(g); if(!raw) return null;
  if(isStopped(g)){ const t=truncateSeries(raw, g.stop.date); return (t&&t.length>1)? t : null; }
  return raw;
}
/* 单标的日收益率序列 [{date, r}]：取自 K 线/价格路径的相邻收盘 */
function retSeriesOf(g){
  const raw=pfSeriesOf(g); if(!raw||raw.length<3) return null;
  const arr=raw.filter(x=>x&&x.date&&x.close!=null).slice().sort((a,b)=> a.date<b.date?-1:(a.date>b.date?1:0));
  const out=[];
  for(let i=1;i<arr.length;i++){ const a=arr[i-1].close, b=arr[i].close; if(a>0&&b>0) out.push({date:arr[i].date, r:b/a-1}); }
  return out.length>=2? out : null;
}
function stdOfArr(a){
  const n=a.length; if(n<2) return null;
  const m=a.reduce((x,y)=>x+y,0)/n;
  const v=a.reduce((x,y)=>x+(y-m)*(y-m),0)/n;
  return v>0? Math.sqrt(v) : null;
}
/* 两标的在共同交易日上的相关系数（样本 <10 天返回 null，视为无法估计） */
function corrPair(a,b){
  if(!a||!b||!a.size||!b.size) return null;
  const keys=[]; for(const k of a.keys()) if(b.has(k)) keys.push(k);
  if(keys.length<10) return null;
  const xs=keys.map(k=>a.get(k)), ys=keys.map(k=>b.get(k));
  const mx=xs.reduce((p,c)=>p+c,0)/xs.length, my=ys.reduce((p,c)=>p+c,0)/ys.length;
  let sxy=0,sxx=0,syy=0;
  for(let i=0;i<xs.length;i++){ const dx=xs[i]-mx, dy=ys[i]-my; sxy+=dx*dy; sxx+=dx*dx; syy+=dy*dy; }
  if(!(sxx>0)||!(syy>0)) return null;
  return sxy/Math.sqrt(sxx*syy);
}
/* 组合综合波动率：σ_p² = ΣΣ w_i·w_j·σ_i·σ_j·ρ_ij（ρ_ii=1；无法估计的 ρ 取 0 并在界面提示）
   同时给出「加权平均波动」Σw_iσ_i 与「分散化效应」1 − σ_p / Σw_iσ_i */
function pfVolatility(pf){
  const items=pfMembers(pf);
  if(!items.length) return null;
  const wRaw=pfNormWeights(items);
  const sers=items.map(m=>retSeriesOf(m.g));
  const dvol=sers.map(s=> s? stdOfArr(s.map(x=>x.r)) : null);
  const maps=sers.map(s=>{ const mp=new Map(); if(s) s.forEach(x=>mp.set(x.date,x.r)); return mp; });
  const n=items.length;
  const corr=[]; for(let i=0;i<n;i++) corr.push(new Array(n).fill(0));
  let pairCnt=0, corrSum=0;
  for(let i=0;i<n;i++){
    corr[i][i]=1;
    for(let j=i+1;j<n;j++){
      const c=corrPair(maps[i],maps[j]);
      if(c!=null){ pairCnt++; corrSum+=c; corr[i][j]=c; corr[j][i]=c; }
      else { corr[i][j]=0; corr[j][i]=0; }     // 样本不足 → 保守取 0（不低估组合波动）
    }
  }
  const ok=dvol.map(v=> v!=null && v>0);
  let ws=0; for(let i=0;i<n;i++) if(ok[i]) ws+=wRaw[i];
  const w=ok.map((o,i)=> (o && ws>0)? wRaw[i]/ws : 0);
  let varSum=0, wavg=0;
  for(let i=0;i<n;i++){ if(!ok[i]) continue; wavg += w[i]*dvol[i];
    for(let j=0;j<n;j++){ if(!ok[j]) continue; varSum += w[i]*w[j]*dvol[i]*dvol[j]*corr[i][j]; } }
  const daily = varSum>0? Math.sqrt(varSum) : wavg;
  const pairs = n*(n-1)/2;
  return {
    items, w, wRaw, n,
    dailyVol:daily, annVol:daily*Math.sqrt(252),
    dvol, annv:dvol.map(v=> v==null? null : v*Math.sqrt(252)),
    corr, avgCorr: pairCnt>0? corrSum/pairCnt : null,
    wavgDaily:wavg, wavgAnn:wavg*Math.sqrt(252),
    divBenefit: wavg>0? (1-daily/wavg) : null,
    missingVol: ok.filter(o=>!o).length, unknownCorr: pairs-pairCnt
  };
}
/* 组合回测：把总资金按权重分配给各标的，各标的用其条件单参数（每笔数量按资金比例等比缩放，
   保证网格结构与资金占用比例一致）在同一段行情上重放 simulateGrid（成交驱动 + 盘中高低 + 手续费）。
   同时汇总各标的「已录成交实绩」作为对照。 */
function pfBacktest(pf){
  const mv=pfVolatility(pf);
  if(!mv) return null;
  const T=Number(pf.totalCapital)||0;
  const rows=mv.items.map((m,i)=>{
    const g=m.g, p=g.cond.params;
    const sm=computeBacktest(g).summary;
    const src=pfSeriesOf(g);
    let sim=null, alloc=T*mv.w[i], qty=p.qtyPerTrade;
    /* 模拟门槛：已配置条件单，或「待建仓」但推荐参数齐全（组合新增标的 configured=false，
       参数齐全仍可预览"若按此方案跑"的收益；参数不全才退回按现金计入） */
    const pReady = !!(p && p.basePrice>0 && p.spacingPct>0 && (p.upGrids||0)>0 && (p.downGrids||0)>0 && (p.qtyPerTrade||0)>0);
    if(src && src.length>1 && (isConfigured(g) || pReady) && T>0 && alloc>0){
      const path=src.map(x=>x.close);
      const hi=src.map(x=> (x.high!=null && x.high!==undefined)? x.high : x.close);
      const lo=src.map(x=> (x.low!=null && x.low!==undefined)? x.low : x.close);
      const scale=(p.initCapital>0)? alloc/p.initCapital : 1;
      qty=lotRound(p.qtyPerTrade*scale);
      const prm=Object.assign({}, p, {initCapital:alloc, qtyPerTrade:qty});
      const valP=(p.currentPrice && p.currentPrice>0)? p.currentPrice : path[path.length-1];
      /* 待建仓且零成交：虚拟按现价预建底仓再跑（预测"若按此方案部署"的收益；不真实建仓） */
      const needSeed = (!isConfigured(g) && !(g.trades&&g.trades.length) && p.basePrice>0)
        ? Math.max(100, Math.floor(alloc/2/p.basePrice/100)*100) : 0;
      sim=simulateGrid(path, prm, hi, lo, valP, needSeed);
    }
    return {g, w:mv.w[i], alloc, qty, sim, actual:sm, dailyVol:mv.dvol[i], annVol:mv.annv[i]};
  });
  const simRows=rows.filter(r=>r.sim);
  const unmodeledRows=rows.filter(r=>!r.sim);
  const unmodeledAlloc=unmodeledRows.reduce((a,r)=>a+r.alloc,0);   // 未参与回放成员的预算（缺行情/未配置/未启用的网格）→ 按现金计入，不丢失计划投入
  const totalAlloc=T;                                              // 计划投入全额已部署（= Σ各成员分配），不再只统计已回放成员
  const totalAssets=simRows.reduce((a,r)=>a+r.sim.totalAssets,0) + unmodeledAlloc;  // 锚定预算：未回放部分以现金计，不凭空腰斩
  const totalProfit=simRows.reduce((a,r)=>a+r.sim.totalProfit,0);  // 仅来自实际回放成员的网格盈亏；未回放部分盈亏为 0
  const vGrid=simRows.reduce((a,r)=>a+r.sim.vGrid,0);
  const unreal=simRows.reduce((a,r)=>a+r.sim.unrealized,0);
  const ret= totalAlloc>0? totalProfit/totalAlloc : 0;
  let days=0;
  rows.forEach(r=>{ const s=pfSeriesOf(r.g);
    if(s&&s.length>1){ const d=(new Date(s[s.length-1].date)-new Date(s[0].date))/86400000; if(d>days) days=d; } });
  if(days<=0) days=1;
  const annual=Math.pow(1+Math.max(-0.99,ret), 365/days)-1;
  const actInvest=rows.reduce((a,r)=>a+(r.actual?r.actual.committedCapital:0),0);
  const actProfit=rows.reduce((a,r)=>a+(r.actual?r.actual.totalProfit:0),0);
  const actInvestSafe = actInvest>0? actInvest : 0;
  const freeCash = Math.max(0, T - actInvestSafe);   // 计划投入中尚未分配到任何标的的现金 = 用户的流动现金，应计入资产构成与实时总资产
  const actAssets=rows.reduce((a,r)=>a+(r.actual?r.actual.totalAssets:0),0) + freeCash;
  const actRet= actInvest>0? actProfit/actInvest : 0;
  const actGrid=rows.reduce((a,r)=>a+(r.actual?r.actual.Vcum:0),0);
  return {T, rows, mv, totalAlloc, totalAssets, totalProfit, vGrid, unreal, ret, days, annual,
          actInvest, actProfit, actAssets, actRet, actGrid, freeCash, simCount:simRows.length, unmodeledAlloc};
}

/* 组合成员「真实口径」汇总：已投 / 实时总资产 均来自各标的真实成交的现金模型（与详情①一致）；
   未建仓（零成交）成员投入与资产均为 0，计划资金只作预算、不计入真实资产 */
function pfRealAssets(membersLike){
  let invest=0, assets=0; const unstarted=[]; let started=0;
  (membersLike||[]).forEach(m=>{
    if(!m || m.on===false) return;
    const g=getGrid(m.gridId); if(!g) return;
    const sm=computeBacktest(g).summary;
    invest += Math.max(0, sm.committedCapital||0);
    assets += Math.max(0, sm.totalAssets||0);
    if(g.trades.length>0) started++; else unstarted.push(g.meta.name);
  });
  return {invest, assets, started, unstarted};
}

/* ============ 资产组合 · 渲染 ============ */
function pfKpi(v,l,s,cls){ return `<div class="pf-kpi"><div class="v ${cls||''}">${v}</div><div class="l">${l}</div>${s?`<div class="s">${s}</div>`:""}</div>`; }

function pfCardHTML(pf, opts){

/* 已投入资金参考口径：真实 committed>0 用之；有成交但计算得 0 时兜底初始资金；
   一笔成交都没有（尚未建仓）→ 0：计划/初始资金只是计划，不算已投入（与实时总资产口径一致） */
function investedOf(g){
  const c=computeBacktest(g).summary.committedCapital||0;
  return c>0? c : (g.trades.length>0? (g.cond.params.initCapital||0) : 0);
}
function pfMemberNeed(m){
  if(!m) return 0;
  const g=getGrid(m.gridId); if(!g) return 0;
  if(m.rec===false) return Math.max(0, Number(m.plan)||0) || (g.cond.params.initCapital||0);
  return investedOf(g);
}

/* —— 「新增标的」：拉行情 → 生成推荐条件单并建网格记录（标记 _pfNew，作为新增成员） —— */
function pfAddNewMember(){

     不再复用已有记录；若代码已存在，新网格名称追加 #序号 以区分（如「红利ETF #2」）。 */
  if(btn) btn.disabled=true; if(btn) btn.textContent="拉取行情中…"; if(msgEl) msgEl.textContent="";
  const name0=(nameEl&&nameEl.value||"").trim();
  fetchMarket(code).then(m=>{
    const price=m.price||(m.kline&&m.kline.length? m.kline[m.kline.length-1].close : 0);
    /* 自动识别中文简称：行情返回 m.name（如"红利ETF"）；用户已填则以用户为准 */
    const sameCnt = state.grids.filter(x=>x.meta.code===code).length;

    const rec=recommend(m, price);
    const plan = 60000;   // 仅作占位初始资金；实际投入在「已纳入成员」行内由用户填写
    const base = rec.basePrice>0? rec.basePrice : price;
    /* 每笔数量不硬编码 800：按"半仓现金÷下行各层触发价之和"与"底仓÷上格数"两约束推算（与条件单模块同口径），不足一手按一手 */
    let qty=800;
    const qSug=calcQtySug({initCapital:plan, basePrice:base, spacingPct:rec.spacingPct,
      upGrids:rec.upGrids, downGrids:rec.downGrids, targetBaseCost: Math.ceil((plan/2/base)/100)*100});
    if(qSug.valid && qSug.qty>0) qty=qSug.qty;
    const params=Object.assign({}, rec, {initCapital:plan, qtyPerTrade:qty,
      targetBaseCost: Math.ceil((plan/2/base)/100)*100,
      currentPrice: round(price,3), startDate: todayISO()});
    const g=makeGrid({meta:{code, name}, cond:params, trades:[],
      pricePath:(m.kline||[]).map(x=>({date:x.date, close:x.close})), market:m, _sample:false});
    g._pfNew=true;
    g._include=false;   /* 新增的组合标的 → 自动从总览网格勾选移除 */
    g.cond.configured=false;   /* 待建仓：推荐只给出网格"方案"，条件单保持未建立——由用户在详情页自行决定是否锁定 */
    g.cond.history[0].note="新增组合标的（行情推荐 · 待建仓）";
    state.grids.push(g);
    d.members.push({gridId:g.id, on:true, weight:0, rec:false, plan});
    pfSyncW(d, null);   // 新增后让"自动"权重成员按剩余 100%−手动 配平
    if(nameEl) nameEl.value="";
    if(codeEl) codeEl.value="";
    if(btn){ btn.disabled=false; btn.textContent="拉行情并纳入"; }
    save(); render();
    const spn = pfSpacingNote(g, g.cond.params.spacingPct||0);
    toast("已纳入新增标的："+name+"（待建仓，条件单未建立，下方给的是建议网格方案） · 建议 间距 "+pct(g.cond.params.spacingPct,1)+" / 每笔 "+fmt(g.cond.params.qtyPerTrade,0)+" 股"+(spn? "（"+spn.replace("注：","")+"）":"")+"；请在下方成员行填写计划资金");
  }).catch(err=>{
    if(btn){ btn.disabled=false; btn.textContent="拉行情并纳入"; }
    if(msgEl) msgEl.innerHTML="行情获取失败（"+(err&&err.message||err)+"）。该标的需行情才能参与波动率/模拟；可稍后重试，或先在首页「新增网格交易」录入后走「已记录」加入。";

/* —— 持仓调整建议：总资金 T < 各成员计划资金合计 S 时，给出多种压缩/追加方案 ——
   单一标的最低可运行资金（¥PF_FLOOR）：低于该档视为"无法独立运行"，不会被硬塞 ¥0/几百元这类不现实的零头 */
const PF_FLOOR=5000;
/* 通用预算分配器（比例式）：budget ∈ [Σlo, Σhi] 时返回对齐 items 的分配数组，否则 null。
   先垫各成员下限，再把余量按"成员剩余空间(hi-a)"比例摊满；最后取整并保证合计恰等于 budget。 */
function pfDistribute(items, budget, loArr, hiArr){
  const n=items.length; if(!n || !(budget>0)) return null;
  const loS=loArr.reduce((a,b)=>a+b,0), hiS=hiArr.reduce((a,b)=>a+b,0);
  if(budget<loS-1e-9 || budget>hiS+1e-9) return null;
  const a=loArr.slice(); let rem=budget-loS;
  const open=hiArr.map((h,i)=> h-loArr[i]>1e-9);
  for(let g=0; g<n+2 && rem>1e-9; g++){
    const idxs=[]; open.forEach((o,i)=>{ if(o) idxs.push(i); });
    if(!idxs.length) break;
    let head=0; idxs.forEach(i=> head+=Math.max(0,hiArr[i]-a[i]));
    if(!(head>1e-9)) break;
    const it=rem; let used=0;
    idxs.forEach(i=>{ const h=Math.max(0,hiArr[i]-a[i]); const dd=Math.min(h, it*h/head); if(dd>1e-9){ a[i]+=dd; used+=dd; if(a[i]>=hiArr[i]-1e-9) open[i]=false; } });
    rem-=used;
    if(used<=1e-9) break;
  }
  const out=a.map(Math.round);
  let s=out.reduce((x,y)=>x+y,0), want=Math.round(budget);
  if(s!==want){
    const idx=out.reduce((bi,x,i)=> x>out[bi]? i : bi, 0);
    out[idx]+=want-s;
    if(out[idx]<loArr[idx]-1e-9 || out[idx]>hiArr[idx]+1e-9) return null;
  }
  return out;
}
/* 等额填充分配器：先垫下限，再把余量尽可能均分给各成员（受 hi 限制），合计=budget */
function pfEqualFill(items, budget, loArr, hiArr){
  const n=items.length; if(!n || !(budget>0)) return null;
  const loS=loArr.reduce((a,b)=>a+b,0), hiS=hiArr.reduce((a,b)=>a+b,0);
  if(budget<loS-1e-9 || budget>hiS+1e-9) return null;
  const a=loArr.slice(); let rem=budget-loS;
  const open=hiArr.map((h,i)=> h-loArr[i]>1e-9);
  for(let g=0; g<n+3 && rem>1e-9; g++){
    const idxs=[]; open.forEach((o,i)=>{ if(o) idxs.push(i); });
    if(!idxs.length) break;
    let moved=false;
    const share=rem/idxs.length;
    idxs.forEach(i=>{
      const room=Math.max(0,hiArr[i]-a[i]);
      const dd=Math.min(room, share, rem);
      if(dd>1e-9){ a[i]+=dd; rem-=dd; moved=true; if(a[i]>=hiArr[i]-1e-9) open[i]=false; }
    });
    if(!moved) break;
  }
  const out=a.map(Math.round);
  let s=out.reduce((x,y)=>x+y,0), want=Math.round(budget);
  if(s!==want){
    const idx=out.reduce((bi,x,i)=> x>out[bi]? i : bi, 0);
    out[idx]+=want-s;
    if(out[idx]<loArr[idx]-1e-9 || out[idx]>hiArr[idx]+1e-9) return null;
  }
  return out;
}
/* 加权分配器（风险平价/低波动多配用）：先垫下限，余量按 weight 比例摊给有空间的成员；合计=budget，不可行返回 null */
function pfWeightFill(items, budget, weights, loArr, hiArr){
  const n=items.length; if(!n || !(budget>0)) return null;
  const loS=loArr.reduce((a,b)=>a+b,0), hiS=hiArr.reduce((a,b)=>a+b,0);
  if(budget<loS-1e-9 || budget>hiS+1e-9) return null;
  const a=loArr.slice(); let rem=budget-loS;
  const open=hiArr.map((h,i)=> h-loArr[i]>1e-9);
  for(let g=0; g<n+4 && rem>1e-9; g++){
    const idxs=[]; open.forEach((o,i)=>{ if(o) idxs.push(i); });
    if(!idxs.length) break;
    let wSum=0; idxs.forEach(i=> wSum+=Math.max(0,weights[i]||0));
    if(!(wSum>1e-9)) break;
    let moved=false;
    idxs.forEach(i=>{
      const room=Math.max(0,hiArr[i]-a[i]);
      const want=(rem*Math.max(0,weights[i]||0))/wSum;
      const dd=Math.min(room, want);
      if(dd>1e-9){ a[i]+=dd; rem-=dd; moved=true; if(a[i]>=hiArr[i]-1e-9) open[i]=false; }
    });
    if(!moved) break;
  }
  const out=a.map(Math.round);
  let s=out.reduce((x,y)=>x+y,0), want=Math.round(budget);
  if(s!==want){
    const idx=out.reduce((bi,x,i)=> x>out[bi]? i : bi, 0);
    out[idx]+=want-s;
    if(out[idx]<loArr[idx]-1e-9 || out[idx]>hiArr[idx]+1e-9) return null;
  }
  return out;
}
/* 资金配置建议引擎（思路差异化 · 收敛档位）：
   不做"每个标的 × 1.5×/2× 穷举"，把方案归到少数"思路轴"，每轴只给代表性档，避免七八张看起来差不多的卡片：
   —— 资金口径：预算不足(S>T) → 保已录·压新增 / 保新增·压已录 / 等比例压缩 / 追加资金至全额；
                 预算充足(S≤T) → 维持现计划（总资金可下调至 ¥S，结余留现金）。
   —— 重配档（两情形皆可）：均衡等额（全预算均分，已录可增减）/ 低波多配（全预算 ∝1/σ）；
                结余明显时另给 结余均分加码 / 结余低波加码（只加已录、不劝卖）。
   —— 已录「主角」档：以某只已录为主角（如 510300）给"加仓至 2×/1.5×（其余让出）"或"减仓至下限（其余吃满）"，
        每只已录至多 1 加 1 减，主角候选限 need 最大的 2 只——回应"预算不足也想保住/做大某只已录"的取舍。
   每个方案都按不同资金重算波动率/网格/风险/推荐度（pfAllocAdvHTML 统一评估与排序），
   持仓比例几乎相同的档位由 pfMergeSimilar 合二为一。
   说明：need=已录投入(committed)/新增计划资金。 */
function pfAllocPlans(d){
  const on=(d.members||[]).filter(m=>m.on);
  const items=on.map(m=>({m, g:getGrid(m.gridId), need:Math.max(0,pfMemberNeed(m))})).filter(x=>x.g && x.need>0);
  if(!items.length) return [];
  const T=Math.max(0,Number(d.totalCapital)||0);
  if(!(T>0)) return [];
  const n=items.length, S=items.reduce((a,x)=>a+x.need,0), FLOOR=PF_FLOOR;
  const isNew=x=>x.m.rec===false;
  const lo=i=>Math.min(FLOOR, items[i].need);
  const loArr=items.map((x,i)=>lo(i));
  const line=(x,a)=>({gridId:x.m.gridId,name:x.g.meta.name,isNew:isNew(x),need:x.need,a:Math.max(0,a),cut:Math.max(0,x.need-a)});
  const recs=items.filter(x=>!isNew(x)), nws=items.filter(x=>isNew(x));
  const plans=[];
  const push=o=>{ if(o && o.allocs && o.allocs.length) plans.push(o); };
  const A=v=>fmt(Math.round(v),0);
  const surplus=T-S;                        // 结余 >0：计划放得下（对应"能减"）；<0 即缺口（对应"能加"）
  const roomy=surplus>=Math.max(2000,0.02*Math.max(S,1));  // 结余足够大才值得单开"均分/低波动加码"档

  /* —— 预算不足 (S>T) —— */
  if(S>T){
    if(recs.length && nws.length){
      const recSum=recs.reduce((a,x)=>a+x.need,0), left=T-recSum;
      if(left>=nws.reduce((a,x)=>a+lo(items.indexOf(x)),0) && left<=nws.reduce((a,x)=>a+x.need,0)+1e-9){
        const tmp=pfDistribute(nws,left,nws.map(x=>lo(items.indexOf(x))),nws.map(x=>x.need));
        if(tmp) push({key:"keepRec",title:"保已录 · 压缩新增",rec:2,
          note:`已录标的全额维持（¥${A(recSum)}），剩余 ¥${A(left)} 分给新增；单个新增至少保留 ¥${A(FLOOR)}（避免压成 0）。`,
          allocs:recs.map(x=>line(x,x.need)).concat(nws.map((x,i)=>line(x,tmp[i]))), usedTotal:T});
      }
      const nwSum=nws.reduce((a,x)=>a+x.need,0), leftB=T-nwSum;
      if(leftB>=recs.reduce((a,x)=>a+lo(items.indexOf(x)),0) && leftB<=recs.reduce((a,x)=>a+x.need,0)+1e-9){
        const tmp=pfDistribute(recs,leftB,recs.map(x=>lo(items.indexOf(x))),recs.map(x=>x.need));
        if(tmp) push({key:"keepNew",title:"保新增 · 压缩已录",rec:0,
          note:`新增按计划足额，缺口由已录标的减仓承担（需卖出现有持仓）；已录至少保留 ¥${A(FLOOR)}。`,
          allocs:nws.map(x=>line(x,x.need)).concat(recs.map((x,i)=>line(x,tmp[i]))), usedTotal:T});
      }
    }
    const tmpR=pfDistribute(items,T,loArr,items.map(x=>x.need));
    if(tmpR) push({key:"ratio",title:"等比例压缩",rec:1,
      note:`各标的按其计划资金同比例压缩（合计用满 ¥${A(T)}）；每标的最低保留 ¥${A(FLOOR)}。`,
      allocs:items.map((x,i)=>line(x,tmpR[i])), usedTotal:T});
    push({key:"topup",title:"追加计划投入至全额",rec:1,
      note:`不压缩任何标的：计划投入由 ¥${A(T)} 上调至 ¥${A(S)}（需额外追加 ¥${A(S-T)}）。`,
      allocs:items.map(x=>line(x,x.need)), usedTotal:S});
    /* 预算不足时同样给出"全预算重配"两档：均衡等额 / 低波多配——把 ¥T 在成员间重切（已录可增可减、新增不超其计划） */
    if(n>1){
      const loF=items.map((x,i)=>lo(i));
      const hiF=items.map((x,i)=> isNew(x)? x.need : T);
      const eqF=pfEqualFill(items,T,loF,hiF);
      if(eqF && items.every((x,i)=> isNew(x)? eqF[i]<=x.need+1e-9 : true))
        push({key:"equal",title:"均衡 · 等资金配置",rec:2,
          note:`预算 ¥${A(T)} 在成员间尽量均分（每标约 ¥${A(T/n)}）：投入大的已录减下来、小的补上去，集中度最低、结构最平均。新增不超其计划资金。`,
          allocs:items.map((x,i)=>line(x,eqF[i])), usedTotal:T});
      const vols=items.map(x=>memberDailyVol(x.g));
      const known=vols.filter(v=>v>0).length;
      if(known>0){
        const wRaw=items.map((x,i)=>{const v=vols[i]; return (v&&v>0)? 1/v : 1;});
        const wSum=wRaw.reduce((a,b)=>a+b,0);
        const rpF=pfWeightFill(items,T,wRaw.map(v=>v/wSum),loF,hiF);
        if(rpF && items.every((x,i)=> isNew(x)? rpF[i]<=x.need+1e-9 : true))
          push({key:"riskpar",title:"低风险加权 · 低波动多配",rec:2,
            note:`预算 ¥${A(T)} 按"波动越低给越多"（权重 ∝ 1/σ）分配${known<n? "（"+String(n-known)+" 个缺行情按等权）":""}：风险最稳的一档，低波已录标的最多可分到较大预算。`,
            allocs:items.map((x,i)=>line(x,rpF[i])), usedTotal:T});
      }
    }
  }

  else {
    /* —— 预算充足 (S≤T)：总资金能加也就能减 —— 只保留思路明显不同的少数档，避免一屏相似卡：
       ① 少投档：维持现计划、总资金下调为 ¥S（结余不进场）；② 结余均分加码（均衡）；
       ③ 结余按 1/σ 加码（低波动求稳）。结余太小时只有 ①。 */
    if(!roomy){
      push({key:"hold",title: surplus>0? "维持现计划 · 资金几乎用足" : "维持现计划 · 资金正好用足",rec:2,
        note:`计划合计 ¥${A(S)} 与计划投入 ¥${A(T)} 基本持平（结余 ¥${A(Math.max(0,surplus))}）：各标的按已录/计划资金足额配置即可，无需压缩也不用加码。`,
        allocs:items.map(x=>line(x,x.need)), usedTotal:S});
    }else{
      push({key:"hold",title:`维持现计划 · 计划投入下调至 ¥${A(S)}`,rec:2,
        note:`已录/计划资金本就放得下：把「计划投入」由 ¥${A(T)} <b>下调</b>为 ¥${A(S)}，结余 ¥${A(surplus)} 留在组合外作现金——不加仓也不减仓，最省事的一档（追加计划投入的镜像：能加也就能减）。`,
        allocs:items.map(x=>line(x,x.need)), usedTotal:S});
      if(recs.length){
        const roomRec=recs.map(x=>T-x.need);
        const eq=pfEqualFill(recs,surplus,recs.map(()=>0),roomRec);
        if(eq) push({key:"equal",title:"均衡加码 · 结余均分已录",rec:1,
          note:`先按已录/计划资金足额配（¥${A(S)}），再把结余 ¥${A(surplus)} 均分给 ${recs.length} 个已录标的（每标约 +¥${A(surplus/recs.length)}）——合计用足 ¥${A(T)}，分散度好；新增按其计划封顶、不加码。`,
          allocs:items.map(x=>{const k=recs.indexOf(x); return k>=0? line(x,x.need+eq[k]) : line(x,x.need);}), usedTotal:T});
        const vols=recs.map(x=>memberDailyVol(x.g));
        const known=vols.filter(v=>v>0).length;
        if(known>0){
          const wRaw=recs.map((x,i)=>{const v=vols[i]; return (v&&v>0)? 1/v : 1;});
          const wSum=wRaw.reduce((a,b)=>a+b,0);
          const volNote=known<recs.length? "（"+String(recs.length-known)+" 个缺行情按等权）" : "";
          const rp=pfWeightFill(recs,surplus,wRaw.map(v=>v/wSum),recs.map(()=>0),roomRec);
          if(rp) push({key:"riskpar",title:"低波动加码 · 求稳多配",rec:1,
            note:`先足额配置，再把结余 ¥${A(surplus)} 按"波动越低给得越多"（权重 ∝ 1/σ）加给已录标的${volNote}，用于压低组合整体波动；新增按其计划封顶、不加码。`,
            allocs:items.map(x=>{const k=recs.indexOf(x); return k>=0? line(x,x.need+rp[k]) : line(x,x.need);}), usedTotal:T});
        }
      }
    }
  }

  /* —— 已录「主角」档：以某只已录为主角（如你已持仓的 510300），给出"加仓做大 / 减仓让出"取舍 ——
       预算不足/刚好时尤其被需要（如 保 510300 而压缩 588080）。为避免回到 7~8 张同质卡：
       每只已录至多 1 张加仓 + 1 张减仓（只取能落地的代表档），主角候选限 need 最大的 2 只；近似卡最后由 pfMergeSimilar 合二为一。 */
  if(recs.length){
    recs.slice().sort((a,b)=>b.need-a.need).slice(0,2).forEach(pivot=>{
      if(!(pivot.need>0)) return;
      const pi=items.indexOf(pivot);
      const othersLoSum=items.reduce((s,x,i)=> s+(i===pi?0:lo(i)),0);
      const othersHiSum=items.reduce((s,x,i)=> s+(i===pi?0:x.need),0);
      const build=(L)=>{
        const loA=items.map((x,i)=> i===pi? L : lo(i));
        const hiA=items.map((x,i)=> i===pi? L : x.need);   // 其余在其计划/已录投入内让出
        return pfDistribute(items,T,loA,hiA);
      };
      /* 加仓档：目标取 2×（放不下则 1.5×）现投入，其余成员压缩/让出 —— 与减仓档并列，各自独立判断 */
      let Ladd=null, arrAdd=null;
      [2,1.5].some(m=>{
        const cand=Math.round(pivot.need*m);
        if(cand<=pivot.need+1e-9) return false;
        if(T-cand<othersLoSum-1e-9) return false;    // 其余压到下限也装不下
        if(T-cand>othersHiSum+1e-9) return false;    // 其余全让到顶也吃不下（pivot 加不上去）
        const t=build(cand);
        if(!t || t[pi]<=pivot.need+1e-6) return false;
        Ladd=cand; arrAdd=t; return true;
      });
      if(arrAdd){
        push({key:"padd_"+pivot.g.id, title:`「${pivot.g.meta.name}」加仓至 ¥${A(Ladd)}`, rec:1,
          note:`以「${pivot.g.meta.name}」为主角加码到 ¥${A(Ladd)}（约 ${(Ladd/pivot.need).toFixed(1)}× 现投入），其余成员在其计划/已录投入内让出${S>T? "（含压缩）":""}——适合你更想重点做它（如 510300）时。`,
          allocs:items.map((x,i)=>line(x,arrAdd[i])), usedTotal:T});
      }
      /* 减仓档：把该已录压到最低可运行，其余成员吃满 —— 与加仓档并列可选的另一极 */
      const Llo=lo(pi);
      if(Llo<pivot.need-1 && T-Llo>=othersLoSum-1e-9 && T-Llo<=othersHiSum+1e-9){
        const t=build(Llo);
        if(t && t[pi]<pivot.need-1){
          push({key:"pcut_"+pivot.g.id, title:`「${pivot.g.meta.name}」减仓至 ¥${A(Llo)} · 其余吃满`, rec:0,
            note:`把「${pivot.g.meta.name}」压到最低可运行 ¥${A(Llo)}，腾出的资金给其余成员（新增不超其计划）。不打算重点做它时可选。`,
            allocs:items.map((x,i)=>line(x,t[i])), usedTotal:T});
        }
      }
    });
  }

  return pfMergeSimilar(plans);
}
/* 相似方案合并：若两个方案"持仓比例几乎一致 且 总投入一致"，保留更推荐的那个并注明已合并，
   避免出现两份只是 1~2% 差别的选项 */
function pfMergeSimilar(plans){
  const wmap=p=>{ const m={}; const sum=p.usedTotal>0? p.usedTotal : 1;
    p.allocs.forEach(a=> m[a.gridId]=(a.a||0)/sum); return m; };
  const dist=(p,q)=>{ const wp=wmap(p), wq=wmap(q);
    const keys=Object.keys(wp).concat(Object.keys(wq)).filter((k,i,arr)=>arr.indexOf(k)===i);
    let d=0; keys.forEach(k=>{ const x=wp[k]||0, y=wq[k]||0; if(Math.abs(x-y)>d) d=Math.abs(x-y); });
    return d; };
  const sameBudget=(p,q)=> Math.abs(p.usedTotal-q.usedTotal)<=Math.max(1000, 0.01*Math.max(p.usedTotal,q.usedTotal));
  const out=[];
  for(const p of plans){
    let merged=false;
    for(const r of out){
      if(dist(r,p)<=0.02 && sameBudget(r,p)){
        if(p.rec>r.rec){ r.title=p.title; r.rec=p.rec; r.allocs=p.allocs; }
        r.note+="；与「"+p.title+"」持仓比例几乎一致，已合二为一";
        merged=true; break;
      }
    }
    if(!merged) out.push(p);
  }
  return out;
}
/* 后续交易方案数据：方案涉及调整「已录标的」持仓（减仓/加仓）时返回结构化的步骤数据 */
function pfTradePlanData(g, a){
  const p=g.cond.params;
  const px=p.currentPrice;
  if(!isConfigured(g) || !(px>0) || Math.abs(a.a-a.need)<1) return null;
  const delta=a.a-a.need;
  const shares=lotRound(Math.abs(delta)/px);
  if(!(shares>0)) return null;
  const anchor=latestBasePrice(g)||p.basePrice;
  const sp=p.spacingPct, dn=p.downGrids||0, up=p.upGrids||0;
  const down=[], upA=[];
  for(let i=1;i<=Math.min(3,dn);i++) down.push(anchor*Math.pow(1-sp,i));
  for(let i=1;i<=Math.min(3,up);i++) upA.push(anchor*Math.pow(1+sp,i));
  const q=Math.max(100, lotRound(p.qtyPerTrade||100));
  return { mode: delta<0? "cut":"add", shares, px, q, batch: Math.max(1, Math.min(5, Math.round(shares/(q*2))||1)), up:upA, down };
}
/* 交易方案排版：两行结构化（①顺势 / ②直接），替代一段长句 */
function pfTradePlanHTML(g, a){
  const t=pfTradePlanData(g,a); if(!t) return "";
  const f=v=> v? "¥"+fmt(v,3) : "—";
  const dir = t.mode==="cut"? "减仓":"加仓";
  const tags = t.mode==="cut"? ["顺势减","直接减"] : ["顺势加","直接加"];
  const t1 = t.mode==="cut"
    ? `暂停网格<b>买入</b>；价格上行触发卖线时逐格卖出`
    : `价格跌破下行网格线逐格补买`;
  const t2 = t.mode==="cut"
    ? `现价 ¥${fmt(t.px,3)} 起分 ≤${t.batch} 批卖出（整手、可隔日）`
    : `现价 ¥${fmt(t.px,3)} 起分 ≤${t.batch} 批买入（整手），或挂下行档回踩成交`;
  return `<div class="pf-tp">
    <div class="pf-tp-t">交易方案 · ${dir} ${fmt(t.shares,0)} 股（整手）</div>
    <div class="pf-tp-r"><span class="n">${tags[0]}</span><span class="d">${t1}（近档 ${f(t.mode==="cut"? t.up[0]:t.down[0])} / ${f(t.mode==="cut"? t.up[1]:t.down[1])}，每格 ${fmt(t.q,0)} 股），累计 ${fmt(t.shares,0)} 股即止</span></div>
    <div class="pf-tp-r"><span class="n">${tags[1]}</span><span class="d">${t2}，优先贴近条件单档位执行</span></div>
  </div>`;
}
/* 成员网格方案：间距/格数固定，每笔数量按 资金 a ÷ 计划资金 need 等比缩放 */
/* 股数按 100 股/手取整（A股委托最小单位）；>0 且不足一手时至少 1 手 */
function lotRound(n){
  if(!(n>0)) return 0;
  return Math.max(100, Math.round(n/100)*100);
}
/* 新增/补充条件单不预填资金与数量：清掉 recommend() 的预设值，强制用户手动填写（避免忘记改） */
function blankCondMoney(d){ if(d){ d.initCapital=undefined; d.qtyPerTrade=undefined; } }
function pfSchemeText(g, need, a){
  const p=g.cond.params;
  if(!isConfigured(g) || !(p.spacingPct>0)) return "待补充条件单";
  const scale=(need>0)? a/need : 1;
  const q=lotRound(p.qtyPerTrade*scale);
  return `间距 ${pct(p.spacingPct,1)} · 上${p.upGrids}/下${p.downGrids} 格 · 每笔 ${fmt(q,0)} 股（100 股/手）`;
}
/* 成员自身日波动率（与行情诊断同口径：历史收盘+最新现价；停止网格截断） */
function memberDailyVol(g){
  const cls=closesForDiag(g);
  if(!cls || cls.length<15) return null;
  const v=volFromCloses(cls).dailyVol;
  return (v && v>0)? v : null;
}
/* 间距合理性检查：间距相对该标的自身日波动的倍数 → 层间预计触发天数（随机游走：约 (间距/σ)² 交易日/层） */
function pfSpacingNote(g, spPct){
  const dv=memberDailyVol(g);
  if(!(dv>0) || !(spPct>0)) return "";
  const ratio=spPct/dv;
  if(ratio>=3) return `注：间距≈${ratio.toFixed(1)}×日波动，单层约 ${Math.max(1,Math.round(ratio*ratio))} 个交易日才触发一次——触发偏稀，请确认是否过宽`;
  if(ratio<0.7) return `注：间距仅 ${ratio.toFixed(1)}×日波动，盘中噪声易反复触发——偏密，注意手续费侵蚀`;
  return "";
}
/* 风险量化：按 σ_p 年化映射 0~10 分（约 6%/分），调仓卖出 +1，封顶 10；另给分散/波动数字 */
function pfRiskScore(annVol, forcedCut, divB){
  const v=annVol==null? null : (annVol>1? annVol/100 : annVol);   // 兼容小数/百分比
  let score = v==null? null : Math.max(1, Math.min(10, Math.round((v*100)/6)));
  if(score!=null && forcedCut) score=Math.min(10, score+1);
  let label = score==null? "?" : (score<=3? "低" : (score<=6? "中" : "高"));
  let tag = score==null? "info" : (score<=3? "ok" : (score<=6? "warn" : "bad"));
  return {score, label, tag, annPct: v==null? null : v*100, divB};
}
const PF_COLORS=["#9A6B1F","#4A6FA5","#3E8E6E","#B0563C","#6B5B95","#B08330","#4C9A8F","#8A6FB0","#7A7F8C","#5A8A5A"];
/* 持仓构成环形图（内联 SVG，零外链） */
function pfDonutHTML(allocs, total){
  const col=PF_COLORS, C=2*Math.PI*28; let acc=0, segs="";
  allocs.forEach((a,i)=>{
    if(!(a.a>0) || !(total>0)) return;
    const len=C*(a.a/total);
    const dash=Math.max(0.5, len-1.6);
    segs+=`<circle cx="40" cy="40" r="28" fill="none" stroke="${col[i%col.length]}" stroke-width="11"
      stroke-dasharray="${dash} ${C-dash}" stroke-dashoffset="${-acc}" transform="rotate(-90 40 40)"></circle>`;
    acc+=len;
  });
  return `<span class="pf-donut"><svg viewBox="0 0 80 80" width="92" height="92">${segs}
    <text x="40" y="37" text-anchor="middle" style="font-size:8.5px;fill:#79766E">投入</text>
    <text x="40" y="49" text-anchor="middle" style="font-size:10.5px;font-weight:600;fill:#1B1A17">¥${fmt(total,0)}</text></svg></span>`;
}
/* 触屏端：点卡片空白处展开/收起细节（按钮点击不触发） */
function pfTglCard(ev){
  const el=ev.currentTarget; if(!el) return;

/* ============ 资产组合 · 推荐方案（低/中/高 三档风险） ============
   候选策略（均衡分散 / 按权重·现状占比 / 集中高波动）先各自生成，
   再按实测组合年化波动 σ_p 由小到大排序 → 最小=低风险档、居中=中风险档、最大=高风险档。
   保证「档名顺序」与「风险评分」永远一致（不会出现中风险 6/10 反而低于低风险 7/10）。
   三档均按「计划投入 T」全额部署（预算不足时同比例压缩，守住下限 ¥PF_FLOOR）。 */
function pfRiskTrio(d){
  const on=(d.members||[]).filter(m=>m.on);
  const items=on.map(m=>({m,g:getGrid(m.gridId),need:Math.max(0,pfMemberNeed(m)),w:Math.max(0,Number(m.weight)||0)})).filter(x=>x.g&&x.need>0);
  if(items.length<1) return [];
  const T=Math.max(0,Number(d.totalCapital)||0);
  if(!(T>0)) return [];
  const n=items.length, FLOOR=PF_FLOOR;
  const isNew=x=>x.m.rec===false;
  const lo=i=>Math.min(FLOOR, items[i].need);
  const loArr=items.map((x,i)=>lo(i));
  const line=(x,a)=>({gridId:x.m.gridId,name:x.g.meta.name,isNew:isNew(x),need:x.need,a:Math.max(0,a),cut:Math.max(0,x.need-a)});
  const A=v=>fmt(Math.round(v),0);
  const vols=items.map(x=>memberDailyVol(x.g)||null);
  let hiIdx=-1,hiV=-1;
  vols.forEach((v,i)=>{ if(v!=null && v>hiV){hiV=v;hiIdx=i;} });
  const wsum=items.reduce((s,x)=>s+x.w,0);
  const userW = wsum>0? items.map(x=>x.w/wsum) : null;
  const sumNeed=items.reduce((s,x)=>s+x.need,0);
  const needW = sumNeed>0? items.map(x=>x.need/sumNeed) : items.map(()=>1/n);
  const weightStyle = userW? "按你设的权重分配" : "按已录/计划投入的现状占比分配";
  /* —— 三档候选策略（先不固定档名；σ 排完序再贴 低/中/高） —— */
  const cands=[];
  const addCand=c=>{ if(c&&c.allocs&&c.allocs.length&&c.allocs.reduce((s,a)=>s+a.a,0)>0) cands.push(c); };
  const eq=pfEqualFill(items,T,loArr,items.map(()=>T));
  if(eq) addCand({style:"均衡分散", allocs:items.map((x,i)=>line(x,eq[i])), usedTotal:T});
  const med=pfWeightFill(items,T,userW||needW,loArr,items.map(()=>T));
  if(med) addCand({style:weightStyle, allocs:items.map((x,i)=>line(x,med[i])), usedTotal:T});
  if(hiIdx>=0){
    const othersLo=items.reduce((s,x,i)=> i===hiIdx? s : s+lo(i),0);
    const hiMax=T-othersLo;
    if(hiMax>lo(hiIdx)+1){
      const arr=items.map((x,i)=> i===hiIdx? Math.min(hiMax,T) : lo(i));
      const overNew=isNew(items[hiIdx]) && arr[hiIdx]>items[hiIdx].need+1;
      addCand({style:"集中到波动最高的「"+items[hiIdx].g.meta.name+"」", concIdx:hiIdx, concAmt:arr[hiIdx], overNew,
        allocs:items.map((x,i)=>line(x,arr[i])), usedTotal:T});
    }
  }
  /* σ 实测排序：升序 → [低,中,高] */
  cands.forEach(c=>{
    const tp={members:c.allocs.map(a=>({gridId:a.gridId, weight:a.a}))};
    const mv=pfVolatility(tp);
    c._sig = (mv && mv.annVol!=null && mv.annVol>0)? mv.annVol : null;
  });
  cands.sort((a,b)=> (a._sig==null?1e18:a._sig) - (b._sig==null?1e18:b._sig));
  const tierTxt=["低风险","中风险","高风险"], tierKeys=["risk_low","risk_med","risk_high"];
  const tierCls=["low","med","high"], recBy=[2,1,0];
  const rankTxt=["组合波动为三档中最小","组合波动为三档中居中","组合波动为三档中最大"];
  const plans=cands.slice(0,3).map((c,i)=>{
    let note;
    if(c.style==="均衡分散"){
      note=`均分到各标的（每标约 ¥${A(c.usedTotal/n)}）：集中度最低、分散化最好；实测 σ ${c._sig!=null?pct(c._sig,1):"—"}，${rankTxt[i]}。`;
    } else if(c.style.indexOf("集中到波动最高的")===0){
      note=`压向「${items[hiIdx].g.meta.name}」（其余至下限 ¥${A(lo(hiIdx))}）：弹性最大；实测 σ ${c._sig!=null?pct(c._sig,1):"—"}，${rankTxt[i]}。${c.overNew?"（对新标的投入超其计划，属重仓新标的）":""}`;
    } else {
      note=`${c.style}（用满 ¥${A(c.usedTotal)}）：代表你的倾向；实测 σ ${c._sig!=null?pct(c._sig,1):"—"}，${rankTxt[i]}。`;
    }
    return {key:tierKeys[i], title:tierTxt[i]+" · "+c.style, tier:tierCls[i], rec:recBy[i],
      allocs:c.allocs, usedTotal:c.usedTotal, note};
  });
  return plans;
}
/* 各成员「条件单诊断」：判断初步条件单参数会不会过频触发穿轨（复用 diagCond） */
function pfDiagMembers(d){
  const on=(d.members||[]).filter(m=>m.on);
  return on.map(m=>{
    const g=getGrid(m.gridId); if(!g) return null;
    const closes=closesForDiag(g);
    const prm=g.cond.params;
    const diag=(closes&&prm)? diagCond(closes,prm) : {ok:false,reason:"暂无可诊断行情/参数"};
    return {m,g,diag};
  }).filter(Boolean);
}
function pfDiagBannerHTML(d){
  const ds=pfDiagMembers(d);
  if(!ds.length) return "";
  const items=ds.map(x=>{
    const g=x.g, diag=x.diag;
    if(!diag||!diag.ok) return `<span class="pf-diag info">「${g.meta.name}」条件单暂无法诊断（${diag&&diag.reason?diag.reason:"参数不足"}）</span>`;
    const fp=(diag.fPred>=10?Math.round(diag.fPred):diag.fPred.toFixed(1));
    if(diag.breakoutHigh) return `<span class="pf-diag warn">「${g.meta.name}」穿轨过频：预测 ≈${fp} 次/年（区间外 ${pct(diag.fT,0)}）→ 建议放宽间距 / 加宽轨道</span>`;
    if(diag.idleLow) return `<span class="pf-diag info">「${g.meta.name}」外层格闲置（区间偏宽）→ 建议按近20日振幅收窄</span>`;
    return `<span class="pf-diag ok">「${g.meta.name}」条件单运行适中（预测 ≈${fp} 次/年）</span>`;
  }).join("");
  return `<div class="pf-diagbox"><div class="pf-diagbox-t">条件单诊断（推荐前先判过频穿轨）</div>${items}</div>`;
}
/* 采纳方案后的「优化建议」：结合各成员条件单参数（间距/格数/满仓所需）给出调整与持仓微调建议 */
function pfOptimizeHTML(d){
  const plans=pfRiskTrio(d);
  const pl=plans.find(p=>p.key===d._adoptedKey) || (d._adoptedKey? null : plans.find(p=>p.title===d._adopted));
  if(!pl) return "";
  const rows=pl.allocs.map(a=>{
    const g=getGrid(a.gridId); if(!g) return "";
    const p=g.cond.params;
    const closes=closesForDiag(g);
    const diag=(closes&&p)? diagCond(closes,p) : null;
    const nc=(p&&p.spacingPct>0)? needCapital(p) : null;
    const tips=[];
    /* —— 条件单参数（穿轨）诊断建议 —— */
    if(diag&&diag.ok){
      if(diag.breakoutHigh){
        const adjPrm=Object.assign({},p,{spacingPct:diag.spSug,upGrids:diag.gUp,downGrids:diag.gDown});
        const d2=diagCond(closes,adjPrm);
        const fp2=(d2&&d2.ok)? (d2.fPred>=10?Math.round(d2.fPred):d2.fPred.toFixed(1)) : diag.fPred.toFixed(1);
        tips.push(`<b style="color:#B0563C">穿轨过频</b>：现间距 ${pct(p.spacingPct,1)}、上${p.upGrids}/下${p.downGrids} 格 → 预测穿轨 ≈${(diag.fPred>=10?Math.round(diag.fPred):diag.fPred.toFixed(1))} 次/年、区间外 ${pct(diag.fT,0)} 交易日。建议：间距放宽至 <b>${pct(diag.spSug,1)}</b>、上/下格调为 <b>${diag.gUp}/${diag.gDown}</b>，调整后预测穿轨 ≈${fp2} 次/年。`);
      } else if(diag.idleLow){
        tips.push(`<b style="color:#4A6FA5">外层格闲置</b>：区间偏宽（覆盖率 ${(diag.c!=null?pct(diag.c,0):"—")}），长期未触上/下轨。建议：按近20日振幅收窄，上/下格调为 <b>${diag.gUp}/${diag.gDown}</b>、间距 ${pct(diag.spSug,1)}。`);
      } else {
        tips.push(`<b style="color:#3E8E6E">条件单运行适中</b>：现间距 ${pct(p.spacingPct,1)}、上${p.upGrids}/下${p.downGrids} 格 → 预测穿轨 ≈${(diag.fPred>=10?Math.round(diag.fPred):diag.fPred.toFixed(1))} 次/年，无需调间距。`);
      }
    } else if(diag&&!diag.ok){
      tips.push(`<span style="color:#79766E">条件单暂无法诊断（${diag.reason}）——补全基准价/间距/格数后可再评。</span>`);
    }
    /* —— 持仓微调建议（结合满仓运行所需 needCapital：底仓 + 下行加仓） —— */
    if(nc && nc.need>0){
      const ratio=a.a/nc.need;
      if(ratio<0.95) tips.push(`<b>持仓微调</b>：本方案给「${g.meta.name}」¥${fmt(a.a,0)}，低于其<b>满仓运行所需 ¥${fmt(nc.need,0)}</b>（底仓 + 下行加仓合计）。建议上调至 <b>¥${fmt(Math.round(nc.need),0)}</b>，否则下轨外层格会因缺资金无法触发。`);
      else if(ratio>1.5) tips.push(`<b>持仓微调</b>：¥${fmt(a.a,0)} 高于满仓所需 ¥${fmt(nc.need,0)} 约 ${ratio.toFixed(1)}×，冗余偏大；可微调至 <b>¥${fmt(Math.round(nc.need*1.2),0)}</b> 留 20% 余量，释放资金给别的标的。`);
      else tips.push(`<b>持仓微调</b>：¥${fmt(a.a,0)} 与满仓所需 ¥${fmt(nc.need,0)} 匹配（±50% 内），无需大调。`);
    }
    return `<div class="pf-opt-row"><div class="pf-opt-h"><b>${g.meta.name}</b> · 分配 ¥${fmt(a.a,0)} · 网格 ${pct(p.spacingPct,1)}/${p.upGrids}↑${p.downGrids}↓</div><div class="pf-opt-d">${tips.join("<br>")}</div></div>`;
  }).join("");
  const overFreq=pfDiagMembers(d).some(x=>x.diag&&x.diag.ok&&x.diag.breakoutHigh);
  return `<div class="pf-opt">
    <div class="pf-opt-t">采纳「${pl.title}」后的优化建议${overFreq?"（含条件单穿轨调整）":""}：</div>
    ${rows}
    <div class="note">结合真实行情取舍；调参后点「重新生成方案」可重算。</div>
  </div>`;
}
/* 去重：剔除持仓比例几乎一致（最大差 ≤1%）的方案卡，保证三档明显不同 */
function dedupePlans(plans){
  const wmap=p=>{ const m={}, sum=p.usedTotal>0?p.usedTotal:1; p.allocs.forEach(a=> m[a.gridId]=(a.a||0)/sum); return m; };
  const dist=(p,q)=>{ const wp=wmap(p),wq=wmap(q); const keys=Object.keys(wp).concat(Object.keys(wq)).filter((k,i,a)=>a.indexOf(k)===i); let d=0; keys.forEach(k=>{ const x=wp[k]||0,y=wq[k]||0; if(Math.abs(x-y)>d) d=Math.abs(x-y); }); return d; };
  const out=[];
  for(const p of plans){ if(!out.some(r=>dist(r,p)<=0.01)) out.push(p); }
  return out;
}

/* 权重自动配平：未被手动锁定(_wSet)的已纳入成员视为「自动」权重。
   每当有成员被手动改权重（或增删成员 / 一键分配）后：
   · 无手动项 → 自动项均分 100%（默认状态）；
   · 有手动项且 Σ手动≤100% → 剩余 (100%−Σ手动) 按自动项当前权重比例摊回（自动项全 0 则均分）；
   · Σ手动>100% → 自动项记 0。
   这样「第一个标的填了权重，剩下的自动用 100%−已填 去算」在 1 个或多个剩余时都成立。
   只回写非当前焦点的输入框，避免打断用户输入。 */
function pfSyncW(d, activeId){
  if(!d) return;
  const on=(d.members||[]).filter(m=>m.on);
  const manual=on.filter(m=>m._wSet);
  const auto=on.filter(m=>!m._wSet);
  if(!auto.length) return;
  const sumM=manual.reduce((a,m)=>a+Math.max(0,Number(m.weight)||0),0);
  const rem=1-sumM;
  const aSum=auto.reduce((a,m)=>a+Math.max(0,Number(m.weight)||0),0);
  auto.forEach(m=>{
    let w;
    if(manual.length===0) w=1/auto.length;
    else if(rem<=1e-9) w=0;
    else if(aSum>1e-9) w=(Math.max(0,Number(m.weight)||0)/aSum)*rem;
    else w=rem/auto.length;
    m.weight=Math.max(0, Math.min(1, w));
  });
  auto.forEach(m=>{
    if(m.gridId===activeId) return;
    const inp=document.querySelector('input[data-k="w"][data-id="'+m.gridId+'"]');
    if(inp && document.activeElement!==inp) inp.value=round(m.weight*100,1);
  });
}

function pfEqualWeights(){

  const on=(d.members||[]).filter(m=>m.on);
  if(!on.length){ toast("请先纳入至少一个标的"); return; }
  on.forEach(m=>{ m.weight=1/on.length; delete m._wSet; });   // 平均分配 → 自动权重；之后手改任一个，其余自动平分剩余
  pfSyncW(d, null);

}
/* 按「计划资金」分配：权重 = 各成员维持资金占比（不改总资金，便于对照） */
function pfFillRecorded(){
  const d=state.pfDraft; if(!d) return;
  d._adopted=null;
  const on=(d.members||[]).filter(m=>m.on);
  if(!on.length){ toast("请先纳入至少一个标的"); return; }
  const amts=on.map(m=>Math.max(0,pfMemberNeed(m)));
  const sum=amts.reduce((a,b)=>a+b,0);
  if(!(sum>0)){ toast("所选标的暂无计划/已录投入"); return; }
  on.forEach((m,i)=>{ m.weight=amts[i]/sum; delete m._wSet; });   // 按计划资金 → 自动权重（保留相对比例）
  pfSyncW(d, null);
  render(); toast("已按计划资金分配权重");
}

function editPortfolio(id){
  const pf=getPf(id); if(!pf) return;
  const pmBy={}; (pf.members||[]).forEach(m=> pmBy[m.gridId]=m);
  state.pfDraft={ id:pf.id, name:pf.name||"", totalCapital:Number(pf.totalCapital)||0, _ui:null,
    members: state.grids.map(g=>{

      return {gridId:g.id, on:pm!=null, weight: pm? pm.weight : 0, rec, plan: pm? pm.plan : undefined};
    }),
    createdAt:pf.createdAt||"" };
  /* 兼容历史"金额型"权重：若旧数据把权重存成了资金数(>1.5)，按合计归一化为占比(0~1) */
  const raw=(state.pfDraft.members||[]).map(m=>m.weight);

    state.pfDraft.members.forEach(m=>{ if(m.weight>1.5) m.weight=Math.max(1e-6, m.weight/sum); });

/* 按「目标占比」并入：新成员占 t，原成员按各自原占比等比压缩到 (1−t) */
function applyPfPick(){
  const pk=state.pfPick; if(!pk) return;
  const g=getGrid(pk.gridId); if(!g) return;
  const selEl=document.getElementById("pfPickSel"), wEl=document.getElementById("pfPickW");
  const pfId=selEl? selEl.value : pk.pfId;
  let t=(wEl? parseFloat(wEl.value) : pk.share);
  if(!(t>0)) t=pk.share||50;
  t=Math.max(0.1, Math.min(99.9, t))/100;
  if(pfId==="__new" || !getPf(pfId)){
    const pf={ id:genPfId(), name:"组合 "+(pfList().length+1), totalCapital:Math.round(investedOf(g)),
               members:[{gridId:g.id, weight:1}], createdAt:todayISO() };
    if(!Array.isArray(state.portfolios)) state.portfolios=[];
    state.portfolios.push(pf);
    g._include=false;   /* 被纳入组合 → 自动从总览网格勾选中移除（防重复计入） */
    save(); state.pfPick=null; editPortfolio(pf.id);
    toast("已新建组合并纳入「"+g.meta.name+"」，请补充计划投入与其余标的"); return;
  }
  const pf=getPf(pfId);
  /* 压缩基准为「除该标的以外的成员」：若该标的已在组合内，须先剔除再压缩，
     否则其原有占比会被重复计入，导致最终占比偏离输入的目标占比 */
  const others=pf.members.filter(m=>m.gridId!==g.id);
  const wRaw=pfNormWeights(others);
  pf.members=others.map((m,i)=>Object.assign({},m,{weight: Math.max(1e-6, wRaw[i]*(1-t))}))
                   .concat([{gridId:g.id, weight:t}]);
  g._include=false;       /* 并入已有组合 → 自动从总览网格勾选移除 */
  save(); state.pfPick=null; render();
  toast("已把「"+g.meta.name+"」纳入「"+pf.name+"」，占比 "+pct(t,1));
}

function delPortfolio(id){
  const pf=getPf(id); if(!pf) return;
  const mems=(pf.members||[]).map(m=>({g:getGrid(m.gridId)})).filter(x=>x.g);
  const inOther=gid=> pfList().some(p=>p.id!==id && (p.members||[]).some(m=>m.gridId===gid));
  const otherUsed=mems.filter(x=>inOther(x.g.id));
  const solo=mems.filter(x=>!inOther(x.g.id));          // 仅属于本组合、可随删的标的
  const names= mems.length? mems.map(x=>x.g.meta.name).join("、") : "（无成员）";
  const m=$("modal");
  $("mTitle").textContent = `删除资产组合「${pf.name}」？`;
  const keepHtml = otherUsed.length
    ? `其中 <b>${otherUsed.length}</b> 个（${otherUsed.map(x=>x.g.meta.name).join("、")}）同时属于其他组合，删除本组合不会影响它们。`
    : "";
  $("mBody").innerHTML = `
    <div>
      <div>该组合含 <b>${mems.length}</b> 个标的：${names}。删除组合本身不会改动标的，是否连同删除标的记录由你决定：</div>
      <label style="display:flex;gap:10px;align-items:flex-start;margin:14px 0 2px;cursor:pointer;user-select:none;font-size:13.5px;color:var(--ink);line-height:1.6">
        <input type="checkbox" id="pfDelKeep" checked style="width:17px;height:17px;min-height:0;accent-color:#9A6B1F;margin-top:2px;flex:0 0 auto">
        <span><b>保留这些标的的记录</b><span style="display:block;font-size:12px;color:var(--muted);font-weight:400">（默认勾选）——仅删除组合本身，标的仍在「网格清单」中保留，可随时重新纳入组合。</span></span>
      </label>
      <div id="pfDelWarn" style="display:none;margin-top:10px;padding:8px 10px;background:var(--band);border:1px solid var(--bandline);border-radius:3px;font-size:12.5px;color:#8A2A2A;line-height:1.7"></div>
      ${keepHtml? `<div style="margin-top:10px;font-size:12px;color:var(--muted);line-height:1.7">${keepHtml}</div>`:""}
    </div>`;
  const keep=$("pfDelKeep"), warn=$("pfDelWarn");
  const warnTxt = `<b>同时删除以下 ${solo.length} 个标的的全部记录</b>（网格、交易明细、行情，不可恢复）：${solo.map(x=>x.g.meta.name).join("、")}${otherUsed.length? `；另有 ${otherUsed.length} 个属于其他组合，将自动保留。`:""}`;
  const upd=()=>{
    if(keep.checked){ warn.style.display="none"; warn.innerHTML=""; }
    else{ warn.innerHTML=warnTxt; warn.style.display="block"; }
  };
  keep.addEventListener("change", upd); upd();
  m.classList.add("show");
  const cleanup=()=>{ m.classList.remove("show"); $("mOk").classList.remove("danger"); $("mOk").textContent="确认"; };
  $("mOk").classList.add("danger"); $("mOk").textContent="确认删除组合";
  $("mOk").onclick=()=>{
    const delSolo = !keep.checked;
    cleanup();
    state.portfolios=pfList().filter(p=>p.id!==id);
    const removed=[];
    if(delSolo && solo.length){
      solo.forEach(x=>{ removed.push(x.g.meta.name); state.grids=state.grids.filter(g2=>g2.id!==x.g.id); });
    }
    if(state.activePfId===id) state.activePfId=null;
    if(state.activeId && !state.grids.some(g2=>g2.id===state.activeId)) state.activeId=null;
    if(state.pfDraft && state.pfDraft.id===id) state.pfDraft=null;
    save(); render();
    toast(removed.length? `已删除组合，并移除 ${removed.length} 个标的记录（${removed.join("、")}）` : "已删除资产组合（标的记录保留）");
  };
  $("mCancel").onclick=cleanup;
}

    tools = `<button class="btn" onclick="state.creating?cancelNewConfirm():back()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg><span class="txt">返回总览</span></button>`;
  } else {
    tools = `<button class="btn primary" onclick="startNew()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg><span class="txt">新增网格交易</span></button>
      <button class="btn" id="allMktBtn" onclick="refreshAllPrices()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7M21 3v6h-6"/></svg><span class="txt">刷新行情</span></button>`;
  }
  h.innerHTML = `<div><div class="brand">Grid Trading · Multi-Desk</div><h1>网格交易回测工作台</h1>
    <div class="sub">${state.grids.length} 个网格 · ${pfList().length} 个组合 · 手机电脑通用 · ${cloudCfg()?"已启用云端同步":"数据本地保存"}</div></div>
    <div class="tools">${tools}</div>`;
}

/* ============ 总览 ============ */
function renderOverview(){
  const all = state.grids.map(g=>({g, sm:computeBacktest(g).summary, bt:computeBacktest(g)}));
  /* 已被任一资产组合纳入的网格：从「收益总览」自动去除（防重复计入），在「网格清单」中默认隐藏 */
  const inPfGid = new Set(all.filter(x=>pfMembersOfGrid(x.g.id)).map(x=>x.g.id));
  const allNormal = all.filter(x=>!inPfGid.has(x.g.id));
  const allHidden = all.filter(x=> inPfGid.has(x.g.id));
  const gSel = allNormal.filter(x=>x.g._include!==false);   // 仅未纳入组合 + 勾选的网格参与「收益总览」
  const pfArr = pfList().map(pf=>{ const bt=pfBacktest(pf); return {pf, bt}; });
  const pfSel = pfArr.filter(x=>x.pf._include!==false); // 勾选的组合参与「收益总览」
  const pfReady = x => pfCondAllConfigured(x.pf);
  const pfProf = x => pfReady(x)? (x.bt? x.bt.actProfit : 0) : (x.bt? x.bt.totalProfit : 0);
  const pfAsst = x => pfReady(x)? (x.bt? x.bt.actAssets : 0) : (x.bt? x.bt.totalAssets : 0);
  const pfInit = x => x.pf.totalCapital>0? x.pf.totalCapital : (x.bt? x.bt.actInvest : 0);
  const pfVG   = x => (x.bt && x.bt.simCount>0)? x.bt.vGrid : 0;
  const totalProfit = gSel.reduce((a,x)=>a+x.sm.totalProfit,0) + pfSel.reduce((a,x)=>a+pfProf(x),0);
  const totalGrid   = gSel.reduce((a,x)=>a+x.sm.Vcum,0) + pfSel.reduce((a,x)=>a+pfVG(x),0);
  const totalInit   = gSel.reduce((a,x)=>a+x.sm.committedCapital,0) + pfSel.reduce((a,x)=>a+pfInit(x),0);
  const totalAssets = gSel.reduce((a,x)=>a+x.sm.totalAssets,0) + pfSel.reduce((a,x)=>a+pfAsst(x),0);
  const selCount = gSel.length+pfSel.length, totalCount = all.length+pfArr.length;
  const hiddenCount = allHidden.length;
  const band = renderBandGlobal(all);   // 「今天要处理」保留全部网格（操作提醒性质）
  const gRow = ({g,sm,bt,inPf})=>{
    const c=g.cond.params;
    const gl=gridLevels(c);
    const base = latestBasePrice(g);
    const last = bt.rows[bt.rows.length-1];
    const holding = last? last.I : 0;
    const marketVal = holding * sm.cur;
    const cfg=isConfigured(g);
    const todays = g.trades.filter(t=>t.date===todayISO()).length;   // 今日发生交易（含建仓）
    /* 已被纳入组合的网格：勾选固定为未勾选且禁用（收益由组合行计入口径控制，避免重复） */
    const selCell = inPf
      ? `<input type="checkbox" disabled title="已纳入资产组合，收益由组合行计入口径控制">`
      : `<input type="checkbox" ${g._include!==false?'checked':''} onchange="toggleInclude('${g.id}')" title="勾选后计入收益总览">`;
    return `<div class="ovrow${inPf?' hidden':''}">
      <div class="sel">${selCell}</div>
      <div class="sym">${symNameHTML(g.meta.name,15)}${inPf?` <span class="tag lock" title="已被资产组合纳入，收益由组合行计入口径控制">已纳入组合</span>`:""}${isStopped(g)?` <span class="tag stopped">已停止</span>`:""}${isPaused(g)?` <span class="tag warn">已暂停</span>`:""}${!cfg?` <span class="tag info">建仓阶段</span>`:""}<small>${g.meta.code} · 共 ${g.trades.length} 笔 · 今日发生交易 <b>${todays}</b> 笔${isStopped(g)?` · 冻结于 ${g.stop.date}`:""}${isPaused(g)?` · 暂停中（调底仓）`:""}</small>${currentCellChip(g,sm)}</div>
      <div class="cond">${cfg
        ? `最新基准 <b>¥${fmt(base,3)}</b> · 间距 <b>${pct(c.spacingPct,2)}</b> · 上<b>${c.upGrids}</b>/下<b>${c.downGrids}</b> 格<br>
        每笔 <b>${fmt(c.qtyPerTrade,0)}</b> · 资金 <b>¥${fmt(c.initCapital,0)}</b> · 区间 ¥${fmt(gl.lower,3)}~${fmt(gl.upper,3)}<br>
        现价 <b class="${signClass(sm.cur-c.startPrice)}">¥${fmt(sm.cur,3)}</b>`
        : `<b>建仓阶段（待补充条件单）</b><br>
        已投入 <b>¥${fmt(sm.cumBuyAmt - sm.cumSellAmt,0)}</b> · 现价 <b class="${signClass(sm.cur-c.startPrice)}">¥${fmt(sm.cur,3)}</b><br>
        建仓 ${g.trades.filter(t=>t.type==="建仓").length} 笔 · 待设网格`}</div>
      <div class="profit ${signClass(sm.totalProfit)}">${fmt(sm.totalProfit,2)}<div style="font-size:11px;color:var(--muted);font-weight:400">真实利润</div>
        <div style="font-size:11px;color:var(--muted);font-weight:400">持仓 ${fmt(holding,0)} 股</div></div>
      <div class="assets ${signClass(sm.totalProfit)}">${fmt(totalAssetsOf(sm),2)}<div style="font-size:11px;color:var(--muted);font-weight:400">总资产</div>
        <div style="font-size:11px;color:var(--muted);font-weight:400">市值 ¥${fmt(marketVal,0)}</div></div>
      <div class="acts">
        <button class="btn sm" onclick="openGrid('${g.id}')">打开</button>
        <button class="btn sm ghost" onclick="renameGrid('${g.id}')">重命名</button>
        ${inPf? `<button class="btn sm ghost" onclick="openPfGrid('${g.id}')">查看所属组合</button>` : ""}
        ${cfg
          ? `<button class="btn sm lock" onclick="openGridEdit('${g.id}')">修改条件单</button>`
          : `<button class="btn sm lock" onclick="editCond('${g.id}')">补充条件单参数</button>`}
        <button class="btn sm danger" onclick="delGrid('${g.id}')">删除网格</button>
      </div>
    </div>`;
  };
  function totalAssetsOf(sm){ return sm.totalAssets; }
  const rows = allNormal.map(x=>gRow(x)).join("");
  const showPf = !!state._showPfGrids;
  const hiddenRows = (showPf && allHidden.length)? allHidden.map(x=>gRow(Object.assign({},x,{inPf:true}))).join("") : "";
  const empty = state.grids.length===0 ? `<div class="empty">还没有网格。点击右上角「新增网格交易」开始建立第一个标的的回测。</div>` :
                (allNormal.length===0 && !showPf) ? `<div class="empty">全部 ${all.length} 个网格都已纳入资产组合，<a href="javascript:state._showPfGrids=true;render()">点击显示这些标的（仍不计入收益总览）</a>。</div>` : "";
  /* —— 组合行（与网格清单同构：勾选 → 计入收益总览；详情 → 组合详情页） —— */
  const pfRows = pfArr.map(x=>{
    const pf=x.pf, bt=x.bt;
    const n=(pf.members||[]).length;
    const T=Number(pf.totalCapital)||0;
    const mv=bt? bt.mv : null;
    const simOk=!!(bt && bt.simCount>0);
    const ready=pfCondAllConfigured(pf);
    const prof= pfProf(x), asst= pfAsst(x), ret= ready? (bt&&bt.actInvest>0? bt.actRet:0) : (simOk? bt.ret : (bt&&bt.actInvest>0? bt.actRet:0));
    const members=pfMembers(pf);
    const pfTodays = members.reduce((a,m)=> a + (m.g.trades||[]).filter(t=>t.date===todayISO()).length, 0);   // 组合今日发生交易（各成员合计，含建仓）
    const memTxt=members.slice(0,3).map(m=>`${m.g.meta.name} ${pct(pfNormWeights(members)[members.indexOf(m)],1)}`).join("、");
    const sub = (a,b)=>`<div style="font-size:11px;color:var(--muted);font-weight:400">${a}</div><div style="font-size:11px;color:var(--muted);font-weight:400">${b}</div>`;
    const profLbl= ready? "实际利润" : "组合利润 · 回测";
    const asstLbl= ready? "实时总资产" : "期末资产(回测)";
    const modeTag= ready? `<span class="mlabel ok">已建仓·实际</span>` : `<span class="mlabel info">条件单未全建·回测</span>`;
    return `<div class="ovrow">
      <div class="sel"><input type="checkbox" ${pf._include!==false?'checked':''} onchange="togglePfInclude('${pf.id}')" title="勾选后计入收益总览"></div>
      <div class="sym">${pf.name} <span class="mlabel lk">组合 · ${n} 标的</span> ${modeTag}<small>${pf.createdAt||""} · 计划投入 ¥${fmt(T,0)} · 今日发生交易 <b>${pfTodays}</b> 笔</small></div>
      <div class="cond">${members.length? `${memTxt}${members.length>3?` 等 ${members.length} 个`:""} · `:""}计划投入 <b>¥${fmt(T,0)}</b></div>
      <div class="profit ${signClass(prof)}">${fmt(prof,2)}${sub(profLbl,"收益率 "+pct(ret,2))}</div>
      <div class="assets ${signClass(asst-T)}" title="${ready? '实时总资产（真实口径：各成员已建仓成交的市值+现金，详见组合详情「资产构成」）¥'+fmt(asst,0) : '回测期末资产(模拟)=按计划投入分摊、样本内重跑网格的期末估值；真实资产见组合详情「实时总资产 · 真实」¥'+(bt?fmt(bt.actAssets,0):'—')}">${fmt(asst,2)}${sub(asstLbl,"计划投入 ¥"+fmt(T,0))}</div>
      <div class="acts">
        <button class="btn sm" onclick="openPf('${pf.id}')">详情</button>
        <button class="btn sm ghost" onclick="editPortfolio('${pf.id}')">编辑</button>
        <button class="btn sm danger" onclick="delPortfolio('${pf.id}')">删除</button>
      </div>
    </div>`;
  }).join("");
  const pfEmpty = pfArr.length===0 ? `<div class="empty">还没有资产组合。点上方「新增资产组合」，把已录网格按资金比例组合回测（收益是否计入总览由勾选控制）。</div>` : "";
  return `
  ${band}
  <section class="section">
    <div class="lab"><span class="t">收益总览</span><span>已勾选 网格+组合 合计 · 组合按其回测利润计入</span></div>
    <div class="kpis">
      <div class="kpi"><div class="v ${signClass(totalProfit)}">${fmt(totalProfit,2)}</div><div class="l">总体利润合计</div><div class="s">网格真实 + 组合回测</div></div>
      <div class="kpi"><div class="v">${selCount}</div><div class="l">参与项数</div><div class="s">已选 ${selCount} / 共 ${totalCount}${hiddenCount?` · ${hiddenCount} 个已纳入组合不计入`:""}</div></div>
      <div class="kpi"><div class="v ${signClass(totalGrid)}">${fmt(totalGrid,2)}</div><div class="l">落袋收益合计</div><div class="s">网格 Vcum + 组合落袋</div></div>
      <div class="kpi"><div class="v">${fmt(totalInit,0)}</div><div class="l">投入资金合计</div></div>
      <div class="kpi"><div class="v ${signClass(totalAssets-totalInit)}">${fmt(totalAssets,2)}</div><div class="l">总资产合计</div><div class="s">${signClass(totalAssets-totalInit)==="up"?"高于投入(红)":(signClass(totalAssets-totalInit)==="down"?"低于投入(绿)":"持平")}</div></div>
    </div>
  </section>
  <div class="hint" style="text-align:center;padding:6px 0">云端同步已启用 · 手机与电脑打开即自动同步</div>
  <section class="section">
    <div class="lab"><span class="t">资产组合</span><span>
      <button class="btn sm" onclick="startPortfolio()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg><span class="txt">新增资产组合</span></button></span></div>
    ${state.pfDraft? pfFormHTML(state.pfDraft) : ""}
    ${state.pfPick? pfPickHTML(state.pfPick) : ""}
    <div class="ov">${pfRows}${pfEmpty}</div>
  </section>
  <section class="section">
    <div class="lab"><span class="t">网格清单</span><span>
      ${hiddenCount? `<button class="btn sm ghost" onclick="toggleShowPfGrids()">${showPf? "隐藏" : "显示"}被纳入组合的标的（${hiddenCount}）</button>` : ""}
    </span></div>
    <div class="ov">${rows}${hiddenRows}${empty}</div>
  </section>
  <section class="section backup-mini">
    <div class="lab"><span class="t">数据备份（次要）</span><span>已启用云端自动同步，一般无需手动备份</span></div>
    <div class="backup-row">
      <button class="btn sm ghost" onclick="exportJSON()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg><span class="txt">导出 JSON</span></button>
      <button class="btn sm ghost" onclick="document.getElementById('imp').click()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21V9M7 14l5-5 5 5M5 3h14"/></svg><span class="txt">导入恢复</span></button>
      <input type="file" id="imp" class="filein" accept="application/json" onchange="importJSON(event)">
    </div>
  </section>`;
}
