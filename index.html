function toggleInclude(id){
  const g=getGrid(id); if(!g) return;
  if(pfMembersOfGrid(id)){ toast("该标的已纳入资产组合，收益由组合行计入口径控制"); return; }
  g._include = (g._include===false);   // 切换：未勾选→勾选，已勾选→取消
  save(); render();
}
function toggleShowPfGrids(){ state._showPfGrids = !state._showPfGrids; render(); }
/* 从总览行点入"查看所属组合"：跳转到第一个含该标的的组合详情页 */
function openPfGrid(gid){
  const pf=pfList().find(p=>(p.members||[]).some(m=>m.gridId===gid));
  if(pf){ openPf(pf.id); }
  else { toast("未找到所属组合"); }
}
function renderBandGlobal(sums){
  const items=[];
  const icon=`<svg viewBox="0 0 24 24" fill="none" stroke="#9A6B1F" stroke-width="2"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>`;
  let totalTrades=0; state.grids.forEach(g=>totalTrades+=g.trades.length);
  // 今日自动录入成交汇总（置顶提示"已自动录入"）：状态栏只显示「已录入X笔」，明细移入浮窗
  const autoTradesAll=[];
  state.grids.forEach(g=> g.trades.forEach(t=>{ if(t._auto && t.date===todayISO() && (t.type==='买入'||t.type==='卖出')) autoTradesAll.push({g,t}); }));
  if(autoTradesAll.length){
    const detailRows = autoTradesAll.map(({g,t})=>`<div class="auto-rec-line"><span class="nm">「${g.meta.name}」</span> <span class="tp-${t.type==='买入'?'buy':'sell'}">${t.type}</span> ${fmt(t.qty,0)}股 @¥${fmt(t.trigger,3)}</div>`).join('');
    items.unshift(`<span class="tag ok">已自动录入</span> <span class="auto-rec-pop" tabindex="0" onclick="this.classList.toggle('open')">今日已自动录入 <b>${autoTradesAll.length}</b> 笔成交（条件单触发）<span class="auto-rec-tip"><div class="auto-rec-h">今日自动录入明细（${autoTradesAll.length} 笔）</div>${detailRows}</span></span>`);
  }
  if(totalTrades>=30 && !ackGet("bak:global")) items.push(`<span class="tag info">备份提醒</span> 已累计 ${totalTrades} 笔交易，建议导出 JSON 备份。${ackBtn("bak:global","已备份")}`);
  sums.forEach(({g,sm})=>{
    const c=g.cond.params, gl=gridLevels(c), cur=sm.cur;
    const gItems=[];
    const push=(t)=>gItems.push(t);
    if(isStopped(g)){ push(`<span class="tag stopped">${g.meta.code} 已停止</span> 网格已于 ${g.stop.date} 停止，收益与天数已冻结。`); }
    else if(!isConfigured(g)){ push(`<span class="tag info">${g.meta.code} 建仓阶段</span> 尚未设置网格条件单，暂无需处理；请先录入建仓交易，再点「补充条件单参数」。`); }
    else {
      const trig=gridTriggerStatus(g,cur);
      const todaysGrid = g.trades.filter(t=>t.date===todayISO() && (t.type==='买入'||t.type==='卖出'));
      const dirsTxt = trig.sides.length? trig.sides.map(s=> s==='buy'?'买入':'卖出').join(' + ') : '';
      if(todaysGrid.length>0){
        const dirTxt = dirsTxt? `（今日触发网格·${dirsTxt}）` : '';
        const ackDone="done:"+g.id+":"+todayISO();
        if(!ackGet(ackDone)) push(`<span class="tag ok">${g.meta.code} 今日已处理</span> 今日已录入 ${todaysGrid.length} 笔成交${dirTxt}，无需重复录入。${ackBtn(ackDone,"确定")}`);
      } else if(trig.triggered){
        const ptxt = trig.sides.includes('buy') ? `下个买点 ¥${fmt(trig.buyNext,3)}` : `下个卖点 ¥${fmt(trig.sellNext,3)}`;
        push(`<span class="tag urgent">${g.meta.code} 已触发网格·${dirsTxt}</span> 当前价 ¥${fmt(cur,3)} 已触及${ptxt}，请及时录入今日${trig.sides[0]==='buy'?'买入':'卖出'}成交。`);
      }
      if(cur<gl.lower) push(`<span class="tag urgent">${g.meta.code} 跌破下限</span> 当前价 ¥${fmt(cur,3)} 低于网格下限 ¥${fmt(gl.lower,3)}，建议修改条件单。`);
      if(cur>gl.upper) push(`<span class="tag urgent">${g.meta.code} 突破上限</span> 当前价 ¥${fmt(cur,3)} 高于上限 ¥${fmt(gl.upper,3)}，建议上移基准或加格。`);
    }
    const chip=currentCellChip(g,sm);
    if(gItems.length && chip) gItems[0]=gItems[0]+chip;
    gItems.forEach(t=>items.push(t));
  });
  if(items.length===0) items.push(`<span class="tag ok">运行平稳</span> 暂无网格触发越界，各标的均处于区间内有条件单运行中。`);
  return `<div class="band"><div class="ttl"><span>今天要处理</span><span class="ttl-ctrls"><span class="am-pill ${state._autoMonitor!==false?'on':'off'}">自动录入 ${state._autoMonitor!==false?'运行中':'已关闭'}</span><button class="band-toggle" onclick="runAutoMonitorNow()" title="立即扫描当日分时，触发即录入">立即巡检</button><button class="band-toggle" onclick="toggleAutoMonitor()" title="点此切换自动录入开关">${state._autoMonitor!==false?'关闭':'开启'}</button></span></div>${items.map(t=>`<div class="row">${icon}<div>${t}</div></div>`).join("")}</div>`;
}

/* ============ 详情 ============ */
function renderDetail(g){
  if(!g) return renderOverview();
  const bt=computeBacktest(g), sm=bt.summary, c=g.cond.params, gl=isConfigured(g)?gridLevels(c):null;
  const totProfit = sm.totalProfit;
  const holdShares = (bt.rows[bt.rows.length-1]||{}).I || 0;
  const holdCostPer = holdShares>0 ? sm.holdCost/holdShares : 0;   // 持仓成本(每股) = 总成本 ÷ 当前持仓股数
  const fbTrade = g.trades.find(t=>t.type==="建仓") || g.trades[0] || null;
  const startDay = fbTrade ? fbTrade.date : c.startDate;   // 网格启动日 = 第一笔建仓当天
  const startDays = isStopped(g) ? Math.max(0, daysBetween(startDay, g.stop.date)) : Math.max(0, daysBetween(startDay, todayISO()));   // 停止网格时天数冻结为 停止日 − 启动日
  const band = renderBandGrid(g, sm, (g.trades.length>0? holdShares : null));

  // 浮空标的标识条（滚动时常驻视口顶部）：标的代码+名称+当前档位；若属于资产组合则列出组合名（可点击跳转）
  const pfsOfGrid = pfList().filter(p=> (p.members||[]).some(m=>m.gridId===g.id));
  const stickyBar = `
  <div class="detail-sticky">
    <div class="ds-left">
      <span class="ds-code">${g.meta.code}</span>
      <span class="ds-name">${g.meta.name}</span>
      ${currentCellChip(g,sm)}
    </div>
    ${pfsOfGrid.length? `<div class="ds-pf"><span class="ds-pf-lbl">所属组合</span>${pfsOfGrid.map(p=>`<button class="ds-pf-tag" onclick="state._pfFrom='${g.id}';openPf('${p.id}')">${p.name}</button>`).join("")}</div>`:""}
  </div>`;

  // 持仓占比 + 穿轨风险 合并为「持仓-网格耦合」单图（价格轴共享：价格越往下格→买入越多→持仓占比越高）
  const hrMv = sm.gridPos * sm.cur;
  const hrTotal = sm.totalAssets || 0;
  const hrCash = hrTotal - hrMv;
  const hrReady = sm.gridPos>0 && sm.cur>0 && hrTotal>0;
  const hrMvPct = hrReady ? hrMv/hrTotal*100 : 0;
  const mergedBlock = renderHoldRailMerged(g, sm);   // 合并图（含网格带 + 持仓占比剖面 + 当前档位）
  const hrBlock = (hrReady && mergedBlock) ? `
  <div class="hold-ratio">
    ${mergedBlock}
  </div>` : `
  <div class="hold-ratio">
    <div class="hr-ttl">持仓占比<span class="hr-sub">持仓市值 ÷ 总资产</span></div>
    <div class="hint" style="margin-top:4px">建仓阶段 / 暂无持仓，持仓占比暂不适用。</div>
    ${renderRailRisk(g, sm)}
  </div>`;
  const tf = g._tf || (g._tf={type:'all',range:'all'});
  const ftype = tf.type||'all';
  const frange = tf.range||'all';
  const fcfrom = tf.from||'';
  const fcto = tf.to||todayISO();

  // 条件单（锁定）
  const spExtra = pfSpacingNote(g, c.spacingPct);   // 间距 vs 日波动的合理性提示
  const condLocked = isConfigured(g) ? `<div class="pline locked">${COND_FIELDS.map(f=>{
    const val = c[f.k];
    const meta = fieldMeta(f, "lock", c._builtActual===true);
    let note = meta.note? ` <span style="color:var(--muted);font-weight:400;font-size:10px">${meta.note}</span>` : "";
    if(f.k==="spacingPct" && spExtra){
      const color = spExtra.includes("偏稀")? "var(--warn)" : (spExtra.includes("偏密")? "var(--down)":"var(--muted)");
      note += ` <span style="color:${color};font-weight:500;font-size:10px">${spExtra.replace(/^注：/,"")}</span>`;
    }
    const disp = f.date? val : (f.p? pct(val,2) : fmt(val, f.d));
    return `<div class="it"><div class="k">${meta.t}${note}</div><div class="val">${disp}</div></div>`;
  }).join("")}</div>` : "";

  // 行情统计（日/年化波动率从历史收盘价自行计算，并纳入最新现价动态更新）
  const m=g.market;
  let vol={dailyVol:null, annVol:null};
  const vSeries = (m && m.kline && m.kline.length>1) ? m.kline : (g.pricePath.length>1 ? g.pricePath : null);
  let vc;
  if(isStopped(g) && vSeries){ vc = truncateSeries(vSeries, g.stop.date) && truncateSeries(vSeries, g.stop.date).length>1 ? truncateSeries(vSeries, g.stop.date) : null; }  // 停止网格：截断到停止日，不追加实时现价（冻结）
  else { vc = buildVolCloses(vSeries, g.cond.params.currentPrice); }
  if(vc) vol = volFromCloses(vc);

  // 图表：停止网格时截断到停止日，并以冻结价作为“当前价”线
  let klineForChart = m ? m.kline : null;
  let condForChart = isConfigured(g) ? g.cond.params : null;   // 建仓阶段不叠加网格线
  if(isStopped(g)){
    klineForChart = truncateSeries(klineForChart, g.stop.date);
    condForChart = Object.assign({}, g.cond.params, {currentPrice: sm.cur});
  }
  const chart = klineForChart ? renderKChart(klineForChart, condForChart, g.trades) : `<div class="empty">点击右侧「获取实时行情」拉取日K</div>`;
  const fetchedNote = m ? `行情来源：${m.source==="tencent"?"腾讯自选股实时":"内置示例"} · ${m.fetchedAt? "更新于 "+m.fetchedAt : ""}` : "";
  const lows = deriveLows(g);
  const diagBlock = m ? `<div class="diag">
      <div class="diag-main">${chart}</div>
      <div class="diag-side">
        <div class="dgroup">
          <div class="dg-ttl">价格区间</div>
          <div class="dg-row"><span>52周</span><b>高 ${fmt(m.high52,3)} / 低 ${lows.low52!=null?fmt(lows.low52,3):"—"}</b></div>
          <div class="dg-row"><span>60日</span><b>高 ${fmt(m.high60,3)} / 低 ${lows.low60!=null?fmt(lows.low60,3):"—"}</b></div>
        </div>
        <div class="dgroup">
          <div class="dg-ttl">波动率</div>
          <div class="dg-row"><span>日波动率</span><b>${vol.dailyVol!=null?pct(vol.dailyVol,2):"—"}</b></div>
          <div class="dg-row"><span>年化波动率</span><b>${vol.annVol!=null?pct(vol.annVol,1):"—"}</b></div>
        </div>
        <div class="dnote">${fetchedNote}</div>
      </div>
    </div>` : `<div class="empty">尚未获取行情，点击「获取实时行情」拉取日K</div>`;

  // 条件单编辑/历史区（含优化诊断与新回测对比，已合并）
  const editArea = renderEditCond(g);

  // 交易表（新→旧，每页10，分页）
  const asc = g.trades.slice().sort((a,b)=> a.date<b.date?-1:(a.date>b.date?1:0));
  const btRowByTrade = new Map(); asc.forEach((t,i)=> btRowByTrade.set(t, bt.rows[i]));
  const SIZES=[5,10,20,50,100000];
  const perPage = (g._tpSize && SIZES.includes(g._tpSize)) ? g._tpSize : 5;
  const sorted=tradeViewList(g);
  const totalPages=Math.max(1,Math.ceil(sorted.length/perPage));
  let tp = g._tp||0; if(tp>=totalPages) tp=totalPages-1; if(tp<0) tp=0;
  const cfg = isConfigured(g);   // 建仓阶段不可直接用现金模型，累计现金/总资产按持仓市值呈现
  const pRows=sorted.slice(tp*perPage,(tp+1)*perPage);
  const tradeRows = sorted.length===0 ? `<tr><td colspan="11" class="empty">暂无交易，先在下方「新建交易」录入</td></tr>`
    : pRows.map((t,k)=>{ const r=btRowByTrade.get(t); const ni=tp*perPage+k;
        return `<tr class="${t._auto?'hl-auto':''}">
          <td>${t.date}</td><td>${t.type}${t._auto?` <span class="mini-auto">自动</span>`:''}</td><td>${fmt(t.trigger,3)}</td><td>${fmt(t.qty,0)}</td><td>${fmt(t.close,3)}</td>
          <td>${cfg? fmt(r.J,0) : "—"}</td><td>${fmt(r.M,0)}</td><td>${cfg? fmt(r.N,0) : fmt(r.M,0)}</td><td>${fmt(r.holdInvested,3)}</td>
          <td class="${signClass(r.V)}">${fmt(r.V,2)}</td>
          <td><button class="btn ghost mini" onclick="editTrade('${g.id}',${ni})">改</button><button class="btn ghost mini" onclick="delTrade('${g.id}',${ni})">删</button></td>
        </tr>`; }).join("");
  const sizeSel = `<label class="pg-lab">每页<select class="pg-sel" onchange="setTradePageSize('${g.id}',this.value)">${SIZES.map(n=>`<option value="${n}" ${perPage===n?'selected':''}>${n>=100000?'全部':n}</option>`).join("")}</select></label>`;
  const jumpSel = totalPages>1 ? `<label class="pg-lab">跳至<select class="pg-sel" onchange="goTradePage('${g.id}',parseInt(this.value))">${Array.from({length:totalPages},(_,i)=>`<option value="${i}" ${i===tp?'selected':''}>${i+1}</option>`).join("")}</select></label>` : "";
  const pager = (totalPages<=1 && perPage===5) ? "" : `<div class="pg">
      <div class="pg-nav">
        <button class="btn sm ghost" ${tp<=0?'disabled':''} onclick="goTradePage('${g.id}',${tp-1})">上一页</button>
        <span class="pg-info">第 ${tp+1} / ${totalPages} 页 · 共 ${sorted.length} 笔</span>
        <button class="btn sm ghost" ${tp>=totalPages-1?'disabled':''} onclick="goTradePage('${g.id}',${tp+1})">下一页</button>
      </div>
      <div class="pg-nav">
        ${sizeSel}
        ${jumpSel}
      </div>
    </div>`;

  return `
  ${stickyBar}
  ${band}

  <section class="section">
    <div class="lab"><span class="t">① 收益回测</span><span>实时测算收益率</span></div>
    <div class="rb">
      <div class="rb-head">
        <div class="rbh">
          <div class="k" title="尚无任何成交时按 ¥0 计：计划/初始资金只是计划，未实际建仓不算资产；录入第一笔建仓或买入后自动恢复现金模型">实时总资产</div>
          <div class="v ${signClass(totProfit)}">¥${fmt(sm.totalAssets,2)}${g.trades.length===0?` <span class="tag info" style="vertical-align:middle">未建仓</span>`:""}</div>
          <div class="subs">
            <div><span>总体收益</span><b class="${signClass(sm.overallReturn)}">${pct(sm.overallReturn,2)}</b></div>
            <div><span>年化收益</span><b class="${signClass(sm.annual)}">${pct(sm.annual,1)}</b></div>
          </div>
        </div>
        <div class="rbh">
          <div class="k">真实利润</div>
          <div class="v ${signClass(totProfit)}">${fmt(totProfit,2)}</div>
          <div class="subs">
            <div><span>持仓浮动</span><b class="${signClass(sm.unrealized)}">${fmt(sm.unrealized,2)}</b></div>
            <div><span>持仓成本</span><b title="含手续费：累计成交(含费买入−净费卖出)÷当前持仓股数">¥${fmt(sm.holdCostInvested,3)}</b></div>
          </div>
        </div>
        <div class="rbh">
          <div class="k">网格利润（累计网格收益）</div>
          ${isConfigured(g)
            ? `<div class="v ${signClass(sm.Vcum)}">${fmt(sm.Vcum,2)}</div>
          <div class="subs">
            <div><span>网格收益率</span><b class="${signClass(sm.gridReturn)}">${pct(sm.gridReturn,1)}</b></div>
            <div><span>网格超额收益</span><b class="${signClass(sm.excess)}">${pct(sm.excess,1)}</b></div>
          </div>`
            : `<div class="v" style="color:var(--muted)">建仓阶段</div>
          <div class="subs">
            <div><span>待补充条件单</span><b>—</b></div>
            <div><span>暂无网格成交</span><b>—</b></div>
          </div>`}
        </div>
        <div class="rbh">
          <div class="k">网格启动天数</div>
          <div class="v">${startDays}<span style="font-size:14px;font-weight:400"> 天</span></div>
          <div class="subs">
            <div><span>启动日</span><b>${startDay}</b>${fbTrade?` <span style="color:var(--muted);font-weight:400;font-size:10px">· 首笔建仓</span>`:""}</div>
            <div><span>区间涨跌幅</span><b class="${signClass(sm.chg)}">${pct(sm.chg,1)}</b></div>
          </div>
        </div>
      </div>
    </div>
    ${hrBlock}
    ${isConfigured(g)? renderNextTrigger(g) : `<div class="hint" style="background:#F7F5EF">建仓阶段：尚未设置条件单，无法计算触发价。请先录入「建仓」交易，完成后点「补充条件单参数」。</div>`}
  </section>

  <section class="section">
    <div class="lab"><span class="t">② 行情诊断</span>
      <span><button class="btn sm ghost" id="mktBtn" onclick="refreshMarket('${g.id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7M21 3v6h-6"/></svg>获取实时行情</button>
      <button class="btn sm ghost" onclick="refreshPrice('${g.id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7M21 3v6h-6"/></svg>刷新现价</button></span>
    </div>
    ${diagBlock}
    <div class="hint">红涨绿跌 · 蜡烛图叠加网格买卖点。</div>
  </section>

  <section class="section">
    <div class="lab"><span class="t">③ 新建交易与交易明细</span><span>共 ${g.trades.length} 笔 · 新→旧</span></div>
    <div class="card">
      <div class="card-h">新建交易<span class="card-sub">选日期后「当日收盘」自动抓取</span></div>
      <div class="card-body">
        <form onsubmit="return addTrade(event,'${g.id}')" id="tradeForm">
          <div class="trade-mini">
            <div class="fld fld-date"><label>日期</label><input type="date" id="t_date" onchange="onTradeDateChange('${g.id}')" required></div>
            <div class="fld"><label>类型</label>
              <select id="t_type"><option value="建仓">建仓（底仓）</option><option value="买入">买入（网格）</option><option value="卖出">卖出（网格）</option></select>
            </div>
            <div class="fld"><label>触发价 ¥</label><input type="number" id="t_trig" step="0.001" required></div>
            <div class="fld"><label>成交数量</label><input type="number" id="t_qty" step="1" required></div>
            <div class="fld"><label>当日收盘 ¥</label><input type="number" id="t_close" step="0.001" placeholder="自动抓取" readonly></div>
            <div class="fld fld-submit"><label>&nbsp;</label><button class="btn" type="submit" style="height:44px;width:100%">新建交易</button></div>
          </div>
        </form>
      </div>
    </div>
    <div class="card">
      <div class="card-h"><span class="card-title">交易明细<span class="card-sub">筛选后 ${sorted.length} / 共 ${g.trades.length} 笔</span></span>
        <div class="tf-inline">
          <div class="tf-item"><label>类型</label><select class="tf-sel" onchange="setTradeTypeFilter('${g.id}',this.value)">
            <option value="all" ${ftype==='all'?'selected':''}>全部</option>
            <option value="建仓" ${ftype==='建仓'?'selected':''}>建仓</option>
            <option value="买入" ${ftype==='买入'?'selected':''}>买入</option>
            <option value="卖出" ${ftype==='卖出'?'selected':''}>卖出</option>
          </select></div>
          <div class="tf-item"><label>日期</label><select class="tf-sel" onchange="setTradeRangeFilter('${g.id}',this.value)">
            <option value="all" ${frange==='all'?'selected':''}>全部</option>
            <option value="1m" ${frange==='1m'?'selected':''}>近1月</option>
            <option value="3m" ${frange==='3m'?'selected':''}>近3月</option>
            <option value="6m" ${frange==='6m'?'selected':''}>近6月</option>
            <option value="custom" ${frange==='custom'?'selected':''}>自定义</option>
          </select></div>
          <div class="tf-item tf-custom" ${frange==='custom'?'':'style="display:none"'}><label>起</label><input type="date" class="tf-date" id="tfFrom" value="${fcfrom}" onchange="setTradeCustomRange('${g.id}')"><label>止</label><input type="date" class="tf-date" id="tfTo" value="${fcto}" onchange="setTradeCustomRange('${g.id}')"></div>
          <button class="btn sm ghost" onclick="clearTradeFilter('${g.id}')">重置</button>
        </div>
      </div>
      <div class="card-body">
        <div class="scroll" style="margin-top:0"><table><thead><tr>
          <th>日期</th><th>类型</th><th>触发价</th><th>数量</th><th>当日收盘</th>
          <th>累计现金</th><th>持仓市值</th><th>总资产</th><th>持仓成本</th><th>累计网格收益</th><th></th>
        </tr></thead><tbody id="tradeBody">${tradeRows}</tbody></table></div>
        ${pager}
      </div>
    </div>
  </section>

  <section class="section">
    <div class="lab"><span class="t">④ ${g.meta.name} · ${isConfigured(g)?`条件单（锁定）${isStopped(g)?` <span class="tag stopped">已停止 · ${g.stop.date}</span>`:""}${isPaused(g)?` <span class="tag warn">已暂停 · 调底仓中</span>`:""}`:`建仓阶段（待补充条件单）`}</span>
      <span><button class="btn sm ghost" onclick="renameGrid('${g.id}')">重命名</button>
      ${isConfigured(g)
        ? `<button class="btn sm lock" onclick="editCond('${g.id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="9" rx="1"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>修改条件单</button>`
        : `<button class="btn sm lock" onclick="editCond('${g.id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="9" rx="1"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>补充条件单参数</button>`}
      ${isConfigured(g) && !isStopped(g) ? (isPaused(g)
        ? `<button class="btn sm resume" onclick="resumePause('${g.id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 4l12 8-12 8z"/></svg>恢复委托</button>`
        : `<button class="btn sm ghost" onclick="pauseGrid('${g.id}')" data-tip="调整底仓期间临时暂停提交买卖委托（不冻结收益/市值，可随时恢复）。">暂停网格 · 调底仓</button>`) : ""}
      ${isConfigured(g) ? (isStopped(g)
        ? `<button class="btn sm resume" onclick="resumeGrid('${g.id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9 9 0 0 0-6.7 3M3 3v6h6"/></svg>恢复网格</button>`
        : `<button class="btn sm stop" onclick="openStopModal('${g.id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="6" width="12" height="12" rx="1"/></svg>停止网格</button>`) : ""}
      <button class="btn sm danger" onclick="delGrid('${g.id}')">删除网格</button></span>
    </div>
    ${condLocked}
    ${isConfigured(g)? posCapHTML(c, (g.trades.length>0? holdShares : null)) : ""}
    ${isConfigured(g) && !g._editing? `<div class="cd-wrap">${condDiagHTML(c, closesForDiag(g), null, rawSeriesOf(g))}</div>` : ""}
    ${editArea}
    <div class="hint">${isConfigured(g)
      ? (isStopped(g)
          ? `网格已于 <b>${g.stop.date}</b> 停止：收益、市值（按收盘价 ¥${fmt(sm.cur,3)}）与天数已冻结，可随时恢复。`
          : isPaused(g)
            ? `网格已暂停（<b>${g.paused.date||"—"}</b>）：<b>不提交买卖委托</b>，用于调整底仓——先改好底仓（建议在条件单表单同步「已完成建仓」实际持仓），确认后点「恢复委托」。暂停不影响收益统计，但期间行情波动不会触发成交。`
            : `网格上限 ¥${fmt(gl.upper,3)} · 下限 ¥${fmt(gl.lower,3)} · 每格价差 ¥${fmt(c.basePrice*c.spacingPct,3)} · 上${c.upGrids}/下${c.downGrids} 格（非对称）。当前价 ¥${fmt(sm.cur,3)}。`)
      : `<b>建仓阶段</b>：尚未设置条件单，无法叠加网格线。请先录入「建仓」交易，完成后点「补充条件单参数」。`}</div>
  </section>

  <section class="section">
    <div class="lab"><span class="t">⑤ 历史条件单参数</span></div>
    ${renderHistory(g)}
  </section>

  <section class="section">
    <div class="lab" style="font-size:12px;color:var(--muted)"><span class="t">数据管理（次要）</span></div>
    <div class="backup-row">
      <button class="btn sm ghost" onclick="exportCSV('${g.id}')">导出交易 CSV</button>
      <button class="btn sm ghost" onclick="clearSample()">清空示例数据</button>
      <button class="btn sm danger" onclick="clearAll()">清空全部数据</button>
    </div>
  </section>`;
}

function renderEditCond(g){
  if(!g._editing) return "";
  const d = g._draft;
  recalcDerived(d, (g.market? g.market.kline : g.pricePath));
  const fields = COND_FIELDS.map(f=>{
    const v = d[f.k];
    const input = fieldInputHTML(f, v, `onDraftInput('${g.id}',event)`);
    const meta = fieldMeta(f, g._setupMode? "setup" : "edit", g._draft._builtActual===true);
    const note = meta.note? ` <span style="color:var(--muted);font-size:10px;font-weight:400">${meta.note}</span>` : "";
    return `<div class="it"><div class="k">${meta.t}${note}</div>${input}</div>`;
  }).join("");
  const gl = gridLevels(d);
  const diagBlock = `<div id="cdEdit" class="cd-wrap">${condDiagHTML(g._draft, closesForDiag(g), g.id, rawSeriesOf(g))}</div>`;
  return `<div class="optbox" style="margin-top:14px">
    <h3>${g._setupMode? "补充条件单参数（初次设置 · 即时重测）" : "修改条件单（保留历史 · 即时重测）"}</h3>
    <div class="pline">${fields}</div>
    ${baseBuiltChkHTML(g)}
    ${capFieldsHTML(d, `onDraftInput('${g.id}',event)`)}
    <div class="hint">上限 ¥${fmt(gl.upper,3)} · 下限 ¥${fmt(gl.lower,3)}。红/绿虚线为买卖触发线。期初价格与建议底仓随启动日自动算，可手动覆盖；修改后作为新版本保留历史。</div>
    ${diagBlock}
    <div class="compare" id="editCompare"></div>
    <div class="acts-row" style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn primary" onclick="applyCond('${g.id}')">应用修改（保留历史）</button>
      <button class="btn ghost" onclick="cancelEdit('${g.id}')">取消</button>
    </div>
  </div>`;
}

function renderHistory(g){
  const rev = g.cond.history.slice().reverse(); // 显示顺序：最新在前
  const items = rev.map((h,revIdx)=>{
    const origIdx = g.cond.history.length-1-revIdx;
    const c=h.params, cur = (origIdx===g.cond.history.length-1);
    if(g._histEdit===origIdx){
      const d=g._hdraft;
      recalcDerived(d, (g.market? g.market.kline : g.pricePath));
      const fields = COND_FIELDS.map(f=>{
        const v=d[f.k];
        const input=fieldInputHTML(f, v, `onHistInput('${g.id}',event)`);
        const meta = fieldMeta(f, "hist", (h.params&&h.params._builtActual)===true);
        const note = meta.note? ` <span style="color:var(--muted);font-size:10px;font-weight:400">${meta.note}</span>` : "";
        return `<div class="it"><div class="k">${meta.t}${note}</div>${input}</div>`;
      }).join("");
      return `<li class="edit"><div style="width:100%">
        <div class="meta">编辑历史版本 · 设置于 ${h.setAt} · ${h.note}${cur?' · 当前生效（保存将同步更新）':''}</div>
        <div class="pline" style="margin-top:10px">${fields}</div>
        <div style="margin-top:12px;display:flex;gap:10px;flex-wrap:wrap">
          <button class="btn primary sm" onclick="saveHistory('${g.id}',${origIdx})">保存修正</button>
          <button class="btn ghost sm" onclick="cancelHistoryEdit('${g.id}')">取消</button>
        </div></div></li>`;
    }
    return `<li class="${cur?'cur':''}">
      <div><div class="params">基准 <b>¥${fmt(c.basePrice,3)}</b> · 间距 <b>${pct(c.spacingPct,2)}</b> · 上<b>${c.upGrids}</b>/下<b>${c.downGrids}</b> 格 · 每笔 <b>${fmt(c.qtyPerTrade,0)}</b></div>
      <div class="meta">${h.setAt} · ${h.note}${cur?' · 当前生效':''}</div></div>
      <div class="acts"><button class="btn sm ghost" onclick="editHistory('${g.id}',${origIdx})">编辑</button></div>
    </li>`;
  }).join("");
  return `<ul class="hist">${items||'<li><div class="meta">暂无历史</div></li>'}</ul>`;
}

    return `<div class="it"><div class="k">${meta.t}${note}</div>${input}</div>`;

/* ============ 字段定义 ============ */
const COND_FIELDS=[
  {k:"basePrice",t:"基准价",d:3},
  {k:"startPrice",t:"期初价格",d:3,ro:true},   // 固定值（启动日行情），不作为可填参数
  {k:"spacingPct",t:"间距百分比",d:4,p:true},
  {k:"upGrids",t:"上格数",d:0},
  {k:"downGrids",t:"下格数",d:0},
  {k:"qtyPerTrade",t:"每笔数量",d:0},
  {k:"feeRate",t:"手续费率",d:6},
  {k:"minFee",t:"最低手续费",d:2},
  {k:"initCapital",t:"初始资金",d:0},
  {k:"targetBaseCost",t:"建议底仓数量",d:0,auto:"base"},
  {k:"startDate",t:"网格启动日",date:true},
  {k:"modifyDate",t:"修改日期",date:true}
];

/* 条件单字段在不同语境下的展示名与备注（ctx: new/setup/edit/hist/lock）。为避免窄列换行，说明性文字尽量精简；
   底仓字段统一短名「底仓数量」，实际持仓 vs 半仓估算的差异由「已完成建仓」勾选行表达 */
function fieldMeta(f){
  let t=f.t, note="";
  if(f.k==="targetBaseCost") t="底仓数量";
  return {t, note};
}

  $("t_date").value=todayISO();

/* ============ 结果渲染（详情用） ============ */
function renderResults(){ /* 回测摘要已内联至详情页，无需独立渲染 */ }

/* 提示确认（"今日已处理"确定 / "备份提醒"已备份）：localStorage 记录，点了就不再提示
   ackId 命名：备份提醒 -> "bak:<gridId>"（按网格长期静音）；今日已处理 -> "done:<gridId>:<今日>"（按日重置） */
const KEY_ACK="gt_ack_v1";
function ackGet(id){
  try{ const o=JSON.parse(localStorage.getItem(KEY_ACK)||"{}"); return !!o[id]; }catch(e){ return false; }
}
function ackSet(id){
  try{ const o=JSON.parse(localStorage.getItem(KEY_ACK)||"{}"); o[id]=true; localStorage.setItem(KEY_ACK, JSON.stringify(o)); }catch(e){}
  try{ toast("已确认，不再提示"); }catch(e){}
  render();
}
function ackBand(id){ ackSet(id); }
/* 轻量消隐按钮（带勾选图标），用于「今日已处理·确定」「备份提醒·已备份」 */
function ackBtn(id, label){
  return `<button class="btn ack" onclick="ackBand('${id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M20 6L9 17l-5-5"/></svg>${label}</button>`;
}

function renderBandGrid(g, sm, posHold){
  const cur=sm.cur, c=g.cond.params, gl=gridLevels(c);
  const icon=`<svg viewBox="0 0 24 24" fill="none" stroke="#9A6B1F" stroke-width="2"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>`;
  if(!isConfigured(g)){
    const built=g.trades.filter(t=>t.type==="建仓").length;
    return `<div class="band"><div class="ttl"><span>今天要处理</span><span class="ttl-sub">${g.meta.name}</span></div>
      <div class="row">${icon}<div><span class="tag info">建仓阶段</span> 尚未设置网格条件单，暂无需处理触发。已录入 <b>${built}</b> 笔建仓交易，待建仓完成后点「补充条件单参数」即可开始网格运行。</div></div></div>`;
  }
  if(isStopped(g)){
    return `<div class="band"><div class="ttl"><span>今天要处理</span><span class="ttl-sub">${g.meta.name}</span></div>
      <div class="row">${icon}<div><span class="tag stopped">已停止</span> 网格已于 ${g.stop.date} 停止，收益、市值与天数已冻结，无需处理。</div></div></div>`;
  }
  if(isPaused(g)){
    return `<div class="band"><div class="ttl"><span>今天要处理</span><span class="ttl-sub">${g.meta.name}</span></div>
      <div class="row">${icon}<div><span class="tag warn">已暂停 · 调底仓</span> 网格自 ${g.paused.date||"—"} 起<b>暂停提交买卖委托</b>（收益统计不受影响）。请在底部按当前实际调整底仓后点「恢复委托」继续运行。
      <span style="display:inline-flex;margin-top:8px"><button class="btn sm resume" onclick="resumePause('${g.id}')">恢复委托</button></span></div></div>`;
  }
  // 下个买/卖点以「成交驱动型最新基准价」为参照（= 上一笔网格成交价；无则取初始基准价），与条件单下侧一致
  const {base,buyNext,sellNext}=nextTriggerLines(c, g.trades, cur);
  const trig=gridTriggerStatus(g,cur);   // 实时价（含当日 high/low 全部时点）对比下个买卖触发点
  const items=[];
  if(g.trades.length>=30 && !ackGet("bak:"+g.id)) items.push(`<span class="tag info">备份提醒</span> 该网格已积累 ${g.trades.length} 笔交易，建议导出 JSON 备份。<button class="btn sm" style="margin-left:10px" onclick="ackBand('bak:${g.id}')">已备份</button>`);
  if(cur<gl.lower) items.push(`<span class="tag urgent">跌破下限</span> 当前价 ¥${fmt(cur,3)} 跌破网格下限 ¥${fmt(gl.lower,3)}，建议修改条件单。`);
  if(cur>gl.upper) items.push(`<span class="tag urgent">突破上限</span> 当前价 ¥${fmt(cur,3)} 突破网格上限 ¥${fmt(gl.upper,3)}，建议上移基准或加格。`);
  if(g.trades.length===0) items.push(`<span class="tag info">待建仓</span> 尚未录入交易，请先「新建交易」或导入历史成交。`);
  // 持仓控制：超出上限/低于下限 → 应暂停买入/卖出委托（标记提醒）
  if(posHold!=null){
    const caps=calcPosCaps(c);
    const maxV=(c.posMaxQty!=null && c.posMaxQty>=0)? c.posMaxQty : caps.max;
    const minV=(c.posMinQty!=null && c.posMinQty>=0)? c.posMinQty : caps.min;
    if(maxV>0 && posHold>maxV) items.push(`<span class="tag urgent">持仓超上限</span> 当前持仓 <b>${fmt(posHold,0)}</b> 股 &gt; 控制上限 <b>${fmt(maxV,0)}</b> 股，条件单应<b>暂停买入委托</b>，建议尽快处理（可卖出部分或到「修改条件单」放宽上限）。`);
    else if(posHold>0 && minV>0 && posHold<minV) items.push(`<span class="tag urgent">持仓低于下限</span> 当前持仓 <b>${fmt(posHold,0)}</b> 股 &lt; 控制下限 <b>${fmt(minV,0)}</b> 股，条件单应<b>暂停卖出委托</b>，建议尽快处理。`);
  }
  const todays = g.trades.filter(t=>t.date===todayISO());
  const todaysGrid = todays.filter(t=>t.type==='买入'||t.type==='卖出');
  const dirsTxt = trig.sides.length? trig.sides.map(s=> s==='buy'?'买入':'卖出').join(' + ') : '';
  if(todaysGrid.length>0){
    const dirTxt = dirsTxt? `（今日触发网格·${dirsTxt}，按最新基准价 ¥${fmt(trig.base,3)} 计算）` : '';
    const ackDone="done:"+g.id+":"+todayISO();
    if(!ackGet(ackDone)) items.push(`<span class="tag ok">今日已处理</span> 今日已录入 <b>${todaysGrid.length}</b> 笔成交${dirTxt}，无需重复录入。${ackBtn(ackDone,"确定")}`);
  } else if(trig.triggered){
    const parts=[];
    if(trig.sides.includes('buy')) parts.push(`下个买点 ¥${fmt(trig.buyNext,3)}`);
    if(trig.sides.includes('sell')) parts.push(`下个卖点 ¥${fmt(trig.sellNext,3)}`);
    const multi = trig.sides.length>1 ? `（今日同时触及 买点 + 卖点，共 ${trig.sides.length} 个方向）` : '';
    items.push(`<span class="tag urgent">已触发网格·${dirsTxt}</span> 当前价 ¥${fmt(cur,3)} 已触及 ${parts.join(' / ')}（按最新基准价 ¥${fmt(trig.base,3)} 计算），<b>请及时在「新建交易」录入今日成交</b>。${multi}`);
  }
  if(items.length===0) items.push(`<span class="tag ok">运行平稳</span> 当前价 ¥${fmt(cur,3)} 处于区间内，今日未触发网格，下个买点 ¥${fmt(trig.buyNext,3)} / 卖点 ¥${fmt(trig.sellNext,3)}（按最新基准价 ¥${fmt(trig.base,3)} 计算）。`);
  return `<div class="band"><div class="ttl"><span>今天要处理</span><span class="ttl-sub">${g.meta.name}</span></div>${items.map(t=>`<div class="row">${icon}<div>${t}</div></div>`).join("")}</div>`;
}

/* ============ K 线蜡烛图 + 网格线 + 买卖点（内联 SVG，合并图表） ============ */
function renderKChart(kline, cond, trades){
  if(!kline||kline.length===0) return '<div class="empty">暂无行情，点击“获取实时行情”</div>';
  const hasOHLC = kline[0].open!=null && kline[0].open!==undefined;
  const gl = cond? gridLevels(cond) : null;
  const curPrice = cond? cond.currentPrice : null;
  // 下次触发：固定网格线（锚定初始基准价），取现价下方最近买入线 / 上方最近卖出线
  let buyNext=null, sellNext=null;
  if(cond){ const r=nextTriggerLines(cond, trades, curPrice); buyNext=r.buyNext; sellNext=r.sellNext; }
  const W = Math.max(340, kline.length*16+54), H=300, padL=10, padR=54, padT=16, padB=24;
  let all=[...kline.map(x=>x.high!=null?x.high:x.close), ...kline.map(x=>x.low!=null?x.low:x.close)];
  if(curPrice) all.push(curPrice);
  if(gl){ all.push(gl.base, gl.upper, gl.lower); gl.down.forEach(v=>all.push(v)); gl.up.forEach(v=>all.push(v)); }
  if(buyNext!=null) all.push(buyNext, sellNext);
  let lo=Math.min(...all), hi=Math.max(...all);
  const pad=(hi-lo)*0.1; lo-=pad; hi+=pad;
  const y=v=> padT + (hi-v)/(hi-lo)*(H-padT-padB);
  const xw=(W-padL-padR)/kline.length;
  const x=i=> padL + i*xw + xw/2;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg" style="display:block;width:100%;height:auto">`;
  for(let g=0;g<=4;g++){ const v=lo+(hi-lo)*g/4; const yy=y(v);
    s+=`<line x1="${padL}" y1="${yy}" x2="${W-padR}" y2="${yy}" stroke="#EDE9E0" stroke-width="1"/>`;
    s+=`<text x="${W-padR+5}" y="${yy+4}" font-size="11" fill="#79766E">${v.toFixed(3)}</text>`;
  }
  // 交易日高亮竖条（背景）：让买卖发生在哪一天一目了然，与蜡烛颜色区分
  if(trades&&trades.length){
    const idxOf=date=>{ let best=-1; for(let i=0;i<kline.length;i++){ if(kline[i].date<=date) best=i; } return best; };
    trades.forEach(t=>{
      const i=idxOf(t.date); if(i<0) return;
      const cx=x(i); const isSell=t.type==="卖出"; const col=isSell?'#B23A2E':'#2E7D5B';
      s+=`<rect x="${cx-xw/2}" y="${padT}" width="${Math.max(2,xw)}" height="${H-padT-padB}" fill="${col}" opacity="0.12"/>`;
    });
  }
  // 蜡烛
  if(hasOHLC){
    kline.forEach((b,i)=>{
      const cx=x(i); const up=b.close>=b.open; const col=up?'#B23A2E':'#2E7D5B';
      const yo=y(b.open), yc=y(b.close); const top=Math.min(yo,yc); const hgt=Math.max(1,Math.abs(yo-yc));
      const yh=y(b.high!=null?b.high:b.close), yl=y(b.low!=null?b.low:b.close);
      s+=`<line x1="${cx}" y1="${yh}" x2="${cx}" y2="${yl}" stroke="${col}" stroke-width="1"/>`;
      s+=`<rect x="${cx-4}" y="${top}" width="8" height="${hgt}" fill="${col}"/>`;
    });
  } else {
    let pts=kline.map((b,i)=>x(i)+","+y(b.close)).join(" ");
    s+=`<polyline points="${pts}" fill="none" stroke="#1B1A17" stroke-width="1.4"/>`;
  }
  // 下次触发价（成交驱动）：买绿 / 卖红，仅标注"下次买入/卖出触发价"，不再画网格结构线
  if(buyNext!=null){
    s+=`<line x1="${padL}" y1="${y(buyNext)}" x2="${W-padR}" y2="${y(buyNext)}" stroke="#2E7D5B" stroke-width="1.8" stroke-dasharray="9 3"/>`;
    s+=`<line x1="${padL}" y1="${y(sellNext)}" x2="${W-padR}" y2="${y(sellNext)}" stroke="#B23A2E" stroke-width="1.8" stroke-dasharray="9 3"/>`;
    const tagY=v=>{ let yy=y(v); return Math.max(padT+9, Math.min(H-padB-9, yy)); };
    const by2=tagY(buyNext), sy2=tagY(sellNext);
    s+=`<rect x="${W-padR+1}" y="${by2-9}" width="50" height="17" rx="3" fill="#FFFFFF" fill-opacity="0.96" stroke="#2E7D5B" stroke-width="0.9"/>`;
    s+=`<text x="${W-padR+26}" y="${by2+4}" font-size="11" font-weight="700" text-anchor="middle" fill="#2E7D5B">买 ${fmt(buyNext,3)}</text>`;
    s+=`<rect x="${W-padR+1}" y="${sy2-9}" width="50" height="17" rx="3" fill="#FFFFFF" fill-opacity="0.96" stroke="#B23A2E" stroke-width="0.9"/>`;
    s+=`<text x="${W-padR+26}" y="${sy2+4}" font-size="11" font-weight="700" text-anchor="middle" fill="#B23A2E">卖 ${fmt(sellNext,3)}</text>`;
  }
  // 买卖点标记：B/S 字母徽章移到蜡烛外侧（卖在最高价上方、买在最低价下方），细连接线指向精确触发价，不再遮挡 K 线
  if(trades&&trades.length){
    const idxOf=date=>{ let best=-1; for(let i=0;i<kline.length;i++){ if(kline[i].date<=date) best=i; } return best; };
    trades.forEach(t=>{
      const i=idxOf(t.date); if(i<0) return;
      const cx=x(i); const isSell=t.type==="卖出"; const col=isSell?'#B23A2E':'#2E7D5B';
      const k=kline[i];
      const edge = isSell ? (k&&k.high!=null?k.high:k.close) : (k&&k.low!=null?k.low:k.close);
      let cy = isSell ? y(edge)-13 : y(edge)+13;
      cy = Math.max(padT+11, Math.min(H-padB-11, cy));
      const py=y(t.trigger), r=8.5;
      // 连接线：从徽章指向实际触发价，标明精确价位
      s+=`<line x1="${cx}" y1="${cy}" x2="${cx}" y2="${py}" stroke="${col}" stroke-width="1.2" opacity="0.55"/>`;
      s+=`<circle cx="${cx}" cy="${cy}" r="${r+2.6}" fill="#FFFFFF" opacity="0.94"/>`;
      s+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${col}" stroke="#FFFFFF" stroke-width="2"/>`;
      s+=`<text x="${cx}" y="${cy+4.5}" font-size="12" font-weight="800" text-anchor="middle" fill="#FFFFFF">${isSell?'S':'B'}</text>`;
    });
  }
  const step=Math.ceil(kline.length/7);
  for(let i=0;i<kline.length;i+=step){ const d=kline[i].date.slice(5); s+=`<text x="${x(i)}" y="${H-7}" font-size="11" fill="#79766E" text-anchor="middle">${d}</text>`; }
  // 买卖点位 tooltip：桌面 hover / 手机点击显示当日买/卖价格，移开即消失（按日期聚合，同一天多笔合并显示）
  if(trades&&trades.length){
    const idxOf=date=>{ let best=-1; for(let i=0;i<kline.length;i++){ if(kline[i].date<=date) best=i; } return best; };
    const groups={}; trades.forEach(t=>{ if(!groups[t.date]) groups[t.date]=[]; groups[t.date].push(t); });
    const W2=W-padR;
    Object.keys(groups).forEach(date=>{
      const i=idxOf(date); if(i<0) return;
      const cx=x(i), list=groups[date], k=kline[i];
      const lines=[{txt:date,muted:true}];
      list.forEach(t=>{ lines.push({txt:(t.type==='卖出'?'卖出':'买入')+' ¥'+fmt(t.trigger,3)+(t.qty?(' · '+t.qty+'股'):''), col:(t.type==='卖出'?'#B23A2E':'#2E7D5B')}); });
      if(k&&k.close!=null) lines.push({txt:'收盘 ¥'+fmt(k.close,3), muted:true});
      const tw=160, lh=17, th=lines.length*lh+12;
      let bx=Math.min(Math.max(padL+2, cx-tw/2), W2-tw-2); const by=padT+6;
      let g=`<g class="tk-col"><rect class="tk-hit" x="${cx-xw/2}" y="${padT}" width="${Math.max(2,xw)}" height="${H-padT-padB}" tabindex="0" onclick="tkPick(this)"></rect>`;
      g+=`<g class="tk-tip"><rect x="${bx}" y="${by}" width="${tw}" height="${th}" rx="5" fill="#FFFFFF" fill-opacity="0.98" stroke="#1B1A17" stroke-opacity="0.32" stroke-width="1"/>`;
      lines.forEach((ln,li)=>{ const ty=by+16+li*lh; const fill=ln.col||(ln.muted?'#79766E':'#1B1A17'); const fw=ln.muted?'400':'700'; g+=`<text x="${bx+11}" y="${ty}" font-size="12" fill="${fill}" font-weight="${fw}">${ln.txt}</text>`; });
      g+=`</g></g>`;
      s+=g;
    });
  }
  s+=`</svg>`;
  let legend=`<div class="legend" style="margin-top:10px;flex-direction:row;flex-wrap:wrap;gap:14px;font-size:12px">`;
  legend+=`<span><span class="dot" style="background:#B23A2E"></span>卖出线/卖出点</span>`;
  legend+=`<span><span class="dot" style="background:#2E7D5B"></span>买入线/买入点</span>`;
  if(buyNext!=null){
    legend+=`<span style="font-weight:600"><span class="dot" style="background:#2E7D5B"></span>下次买入触发 ¥${buyNext.toFixed(3)}</span>`;
    legend+=`<span style="font-weight:600"><span class="dot" style="background:#B23A2E"></span>下次卖出触发 ¥${sellNext.toFixed(3)}</span>`;
  }
  legend+=`<span style="color:var(--muted)"><b style="color:#2E7D5B">B</b> 买入 / <b style="color:#B23A2E">S</b> 卖出（徽章位于买卖价位上）</span></div>`;
  return `<div class="kwrap">${s}${legend}</div>`;
}
// K线买卖点位：手机点击某列切换显示当日买/卖价格，点击图表外自动收起
var _tkDocBound=false;
function tkPick(el){
  const col=el.closest('.tk-col'); const was=col&&col.classList.contains('active');
  document.querySelectorAll('.tk-col.active').forEach(c=>c.classList.remove('active'));
  if(col&&!was) col.classList.add('active');
  if(!_tkDocBound){ _tkDocBound=true;
    document.addEventListener('click', function(e){ if(!e.target.closest || !e.target.closest('.tk-col')) document.querySelectorAll('.tk-col.active').forEach(c=>c.classList.remove('active')); });
  }
}

function openPfMember(id){ state._pfFrom=state.activePfId||null; openGrid(id); }
function back(){
  const backPf = (state.activePfId==null && state.activeId && state._pfFrom) ? state._pfFrom : null;
  state.creating=null; state.activeId=null; state.activePfId=null;
  state.grids.forEach(g=>{ g._editing=false; g._draft=null; g._setupMode=false; g._histEdit=null; g._hdraft=null; });
  if(backPf){ state.activePfId=backPf; state._pfFrom=null; }
  save(); render();
}

/* 组合详情页：整体回测摘要 + 成员清单（点击进入各成员交易） */
function fitFontSize(text, maxW, base){
  try{
    const c=fitFontSize._c || (fitFontSize._c=document.createElement('canvas').getContext('2d'));
    c.font=base+'px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
    const w=c.measureText(text||"").width;
    if(w<=maxW) return base;
    return Math.max(9, Math.round(base*maxW/w));
  }catch(e){ return base; }
}
function symNameHTML(name, base){
  const fs=fitFontSize(name, 240, base||15);
  return '<span class="sym-name" style="font-size:'+fs+'px">'+esc(name)+'</span>';
}
function pfAssetsChartHTML(pf){
  const bt=pfBacktest(pf);
  const freeCash=bt? (bt.freeCash||0) : 0;
  const members=pfMembers(pf).filter(m=>m.on!==false);
  const data=members.map(m=>{
    const sm=computeBacktest(m.g).summary;
    const mv=sm.gridPos*sm.cur;
    const cash=sm.cash||0;
    return {name:m.g.meta.name, mv, cash, total:mv+cash};
  });
  if(freeCash>0) data.push({name:"未分配流动现金", mv:0, cash:freeCash, total:freeCash, isCash:true});
  const grand=data.reduce((a,x)=>a+x.total,0);
  if(grand<=0) return `<div class="empty">成员均为建仓阶段或未建仓，暂无资产可显示（持仓市值 + 现金 = 总资产）。</div>`;
  const FULL_W=200;          // 整条轨道 = 组合总资产（100%），条长即占组合比例
  const MIN_W=3;             // 极小值保留可见细条，但不夸大（原 44px 下限会把 100 元画成 ~24%）
  const items=data.map(x=>{
    const share=grand>0? x.total/grand : 0;
    const w=Math.max(MIN_W, Math.round(share*FULL_W));
    const pctTxt=pct(share,1);
    if(x.isCash){
      return `<div class="ac-item">
      <div class="ac-top">
        <span class="ac-nm" style="font-size:12px;color:var(--muted)">${esc(x.name)}</span>
        <span class="ac-bar" style="width:${w}px"><i class="csh" style="width:100%"></i></span>
        <span class="ac-val">¥${fmt(x.total,0)} · ${pctTxt}</span>
      </div>
      <div class="ac-num">流动现金（计划投入中未分配至任何标的）<b>¥${fmt(x.cash,0)}</b> · 持仓占比 <b>0%</b> · 占组合 <b>${pctTxt}</b></div>
    </div>`;
    }
    const mvp=x.total>0? x.mv/x.total*100 : 0;
    const holdTxt=mvp>0? mvp.toFixed(1)+"%" : "0%";
    return `<div class="ac-item">
      <div class="ac-top">
        <span class="ac-nm" style="font-size:${fitFontSize(x.name,150,12)}px">${esc(x.name)}</span>
        <span class="ac-bar" style="width:${w}px"><i class="mv" style="width:${mvp}%"></i><i class="csh" style="width:${100-mvp}%"></i></span>
        <span class="ac-val">¥${fmt(x.total,0)} · ${pctTxt}</span>
      </div>
      <div class="ac-num">持仓市值 <b>¥${fmt(x.mv,0)}</b>（持仓占比 <b>${holdTxt}</b>）· 现有现金 <b>¥${fmt(x.cash,0)}</b> · 占组合 <b>${pctTxt}</b></div>
    </div>`;
  }).join("");
  return `<div class="card"><div class="card-body">
    <div class="ac-compact">
      <div class="ac-sum"><span class="ac-lbl">资产构成 · 各成员持仓市值 + 现金${freeCash>0? "（含未分配流动现金 ¥"+fmt(freeCash,0)+"）":""}</span><span class="ac-grand">¥${fmt(grand,0)}</span></div>
      <div class="ac-scroll"><div class="ac-list">${items}</div></div>
      <div class="ac-hint">← 左右拖动查看完整内容 →</div>
      <div class="ac-legend"><span><i class="ac-dot" style="background:var(--down)"></i>持仓市值</span><span><i class="ac-dot" style="background:var(--warn)"></i>现有现金</span><span style="color:var(--muted)">条长 = 占组合总资产比例</span></div>
    </div>
  </div></div>`;
}

/* 资产构成 · 移动端左右拖动查看（pointer 拖拽 + 滚动隐藏提示） */
function bindAcScroll(){
  document.querySelectorAll('.ac-scroll').forEach(el=>{
    if(el.dataset.dragbound) return;
    el.dataset.dragbound='1';
    let down=false, startX=0, startLeft=0, moved=0;
    el.addEventListener('pointerdown', e=>{
      if(e.pointerType!=='mouse') return;   // 触摸/笔交给浏览器原生横向滑动（更顺滑）
      if(el.scrollWidth<=el.clientWidth+1) return;
      down=true; moved=0; startX=e.clientX; startLeft=el.scrollLeft;
      try{ el.setPointerCapture(e.pointerId); }catch(_){}
      el.classList.add('grabbing');
    });
    el.addEventListener('pointermove', e=>{
      if(!down) return;
      const dx=e.clientX-startX;
      if(Math.abs(dx)>2) moved=Math.abs(dx);
      el.scrollLeft=startLeft-dx;
    });
    const end=()=>{ down=false; el.classList.remove('grabbing'); moved=0; };
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
    el.addEventListener('scroll', ()=>{ const c=el.closest('.ac-compact'); if(c && el.scrollLeft>4) c.classList.add('ac-scrolled'); }, {passive:true});
  });
}

function autoFillClose(g, date){
  const el=$("t_close"); if(!el) return;
  const kline = (g.market? g.market.kline : g.pricePath);
  // 1) 今日：用今日收盘（行情含）/ 实时现价
  if(date===todayISO()){
    const exact = kline && kline.find(x=>x.date===date);
    el.value = round(exact? exact.close : g.cond.params.currentPrice, 3);
    return;
  }
  // 2) 历史日：先看本地 K 线是否含该日
  const c = priceOnDate(kline, date);
  if(c!=null){ el.value = round(c,3); return; }
  // 3) 本地没有 → 先用现价占位，再异步向云端取该日精确收盘价（代理支持任意历史日）
  el.value = round(g.cond.params.currentPrice,3);
  fetchCloseOnDate(g, date).then(c2=>{
    if(c2!=null && $("t_date") && $("t_date").value===date && $("t_close")) $("t_close").value=round(c2,3);
  }).catch(()=>{});
}
/* 向云端代理按日期查询收盘价（绕开本机网络屏蔽，支持任意历史交易日） */
function fetchCloseOnDate(g, date){
  const base=proxyBase(); if(!base) return Promise.resolve(null);
  const code=(g.meta&&g.meta.code)||""; if(!code) return Promise.resolve(null);
  return fetch(`${base}?type=market&code=${encodeURIComponent(code)}&date=${encodeURIComponent(date)}`)
    .then(r=>{ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .then(d=>{ if(d&&d.close!=null) return d.close; throw new Error("无数据"); })
    .catch(()=>null);
}

/* 刷新行情后，把「当日收盘」仍停留在盘中现价（未收盘时录入）的交易，
   自动更新为最新可得的收盘价 / 实时价；历史交易日收盘已定，保持原值。
   规则：若 K 线含该交易日期 → 用当日实际收盘价；否则若恰为今日 → 用实时现价。
   返回更新的笔数。 */
function syncLiveClose(g){
  if(!g || !g.trades || !g.trades.length) return 0;
  const kline = (g.market? g.market.kline : g.pricePath) || [];
  const today = todayISO();
  let count=0;
  g.trades.forEach(t=>{
    if(!t || t.date==null) return;
    const exact = kline.find(x=>x.date===t.date);
    let nc=null;
    if(exact) nc = exact.close;                                 // 历史/已收盘日：实际收盘价
    else if(t.date===today) nc = g.cond.params.currentPrice;     // 今日盘中：实时现价
    if(nc!=null && Math.abs(nc-(t.close||0))>1e-9){ t.close=round(nc,3); count++; }
  });
  return count;
}

function updateEditCompare(g){
  const el=document.getElementById("editCompare"); if(!el) return;
  /* 用真实行情 K 线（含当日高低）判定盘中穿越；无行情才退回价格路径收盘 */
  const m=g.market;
  const src = (m && m.kline && m.kline.length>1)? m.kline
           : (g.pricePath && g.pricePath.length>1? g.pricePath : null);
  if(!src || src.length<2){ el.innerHTML=`<div><div class="h">提示</div><div class="big" style="font-size:14px">行情样本不足，无法模拟</div></div>`; return; }
  /* 左侧基准 = 详情页①实绩（口径完全一致：computeBacktest 汇总） */
  const bt=computeBacktest(g), sm=bt.summary;
  const aV=sm.Vcum||0, aP=sm.totalProfit||0, aR=sm.overallReturn||0;
  /* 右侧草案 = 同一段行情 + 草案参数 从头模拟；期末估值价统一用 ① 的当前估值价 frozenCur(g) */
  const path=src.map(x=>x.close);
  const hi=src.map(x=> (x.high!=null && x.high!==undefined)? x.high : x.close);
  const lo=src.map(x=> (x.low!=null && x.low!==undefined)? x.low : x.close);
  const valP=frozenCur(g);
  const sim=simulateGrid(path,g._draft,hi,lo,valP);
  const dP=sim.totalProfit, dV=sim.vGrid;
  const dInit=(g._draft.initCapital>0)? g._draft.initCapital : 0;
  const dR= dInit>0? dP/dInit : 0;
  const cell=(h,v,sc)=>`<div><div class="h">${h}</div><div class="big ${sc||''}">${v}</div></div>`;
  const note=`<div style="grid-column:1/-1" class="cd-dim">左=①实际（已录成交回测至今日）· 右=草案同段行情从头模拟（估值价与收益定义已与①对齐；真实成交价/底仓差异仍会使两者不同，草案适合看相对优劣）。</div>`;
  el.innerHTML = note +
    cell("①实际 · 网格收益", fmt(aV,2), signClass(aV)) +
    cell("草案 · 网格收益(同口径)", fmt(dV,2), signClass(dV)) +
    cell("变动", fmt(dV-aV,2), signClass(dV-aV)) +
    cell("①实际 · 总收益", fmt(aP,2), signClass(aP)) +
    cell("草案 · 总收益(同口径)", fmt(dP,2), signClass(dP)) +
    cell("变动", fmt(dP-aP,2), signClass(dP-aP)) +
    cell("①实际 · 总收益率", pct(aR,2), signClass(aR)) +
    cell("草案 · 总收益率(同口径)", pct(dR,2), signClass(dR)) +
    cell("变动", pct(dR-aR,2), signClass(dR-aR));
}

/* ============ 收益优先（在资金/风险约束内，用历史样本扫参找回测收益更大的组合） ============ */
function seriesHiLo(g){
  const m=g.market;
  const src=(m && m.kline && m.kline.length>1)? m.kline : (g.pricePath && g.pricePath.length>1? g.pricePath : null);
  if(!src || src.length<2) return null;
  return {
    path: src.map(x=>x.close),
    hi: src.map(x=> (x.high!=null && x.high!==undefined)? x.high : x.close),
    lo: src.map(x=> (x.low!=null && x.low!==undefined)? x.low : x.close)
  };
}
function scanBestProfit(d, path, hi, lo, valP){
  const out={ok:false, best:null, cur:null, cands:0, note:""};
  if(!d || !path || path.length<2) return out;
  const base=d.basePrice>0? d.basePrice : 0;
  const init=d.initCapital>0? d.initCapital : 0;
  if(!(base>0)) return out;
  const cur=simulateGrid(path,d,hi,lo,valP);
  out.cur=cur;
  /* 种子=当前参数（同口径 vGrid，保证结果不差于现状） */
  let bestScore=(cur && isFinite(cur.vGrid))? cur.vGrid : -Infinity;
  let best=d;
  const hiP=Math.max(...path), loP=Math.min(...path);
  const spSet=[]; const push=x=>{ const s=Math.round(x*1000)/1000; if(s>=0.005&&s<=0.08 && !spSet.includes(s)) spSet.push(s); };
  for(let pct=0.5;pct<=6.5;pct+=0.5) push(pct/100);
  if(d.spacingPct>0) push(d.spacingPct);
  const qtyBase = d.qtyPerTrade>0? Math.round(d.qtyPerTrade) : 0;
  const qtySug0 = (qtyBase>0 && d.upGrids>0 && d.downGrids>0)? calcQtySug(d).qty : 0;
  const lim=(init>0)? init*1.03 : Infinity;
  spSet.sort((a,b)=>a-b);
  for(const sp of spSet){
    const l1=Math.log(1+sp);
    const upTar=Math.max(hiP*1.03, base*(1+sp));
    const dnTar=Math.min(loP*0.97, base*(1-sp));
    if(!(upTar>base && dnTar<base)) continue;
    let rUp=Math.log(upTar/base)/l1, rDn=Math.log(base/dnTar)/l1;
    const big=Math.max(1, Math.min(18, Math.round(Math.max(rUp,rDn))));
    const small=Math.max(1, Math.min(18, Math.round(Math.min(rUp,rDn))));
    const capSmall=Math.max(1, big-2);
    const gUp = rUp>=rDn? big : Math.max(small, capSmall);
    const gDn = rDn>=rUp? big : Math.max(small, capSmall);
    const qCand=[qtyBase].filter(q=>q>0);
    if(qtySug0>0 && !qCand.includes(qtySug0)) qCand.push(qtySug0);
    for(const qty of qCand){
      const combo=Object.assign({}, d, {spacingPct:sp, upGrids:gUp, downGrids:gDn, qtyPerTrade:qty});
      if(lim!==Infinity && needCapital(combo).need>lim) continue;
      const s=simulateGrid(path,combo,hi,lo,valP);
      out.cands++;
      if(s.vGrid>bestScore){ bestScore=s.vGrid; best=combo; }
    }
  }
  if(best){
    out.ok=true; out.best=best; out.bestScore=bestScore;
  } else out.note="未找到满足资金上限的组合，可先调高初始资金或减少下格数";
  return out;
}
function runProfitBest(id){
  const el=document.getElementById("profBest"); if(!el) return;
  const g=getGrid(id); if(!g) return;
  const d=g._draft || g.cond.params;
  const sh=seriesHiLo(g);
  if(!sh){ el.innerHTML=`<div class="hint">行情样本不足，无法做收益扫描</div>`; return; }
  const r=scanBestProfit(d, sh.path, sh.hi, sh.lo, frozenCur(g));
  if(!r.ok){
    el.innerHTML=`<div class="hint">收益扫描：${r.note||"无法计算"}</div>`; return;
  }
  const b=r.best, cur=r.cur;
  const valP=frozenCur(g);
  const simBest=simulateGrid(sh.path,b,sh.hi,sh.lo,valP);
  const curV = (cur && isFinite(cur.vGrid))? cur.vGrid : 0;
  const diffR = r.bestScore - curV;
  const needN = needCapital(b).need;
  const db=diagCond(sh.path, b);
  const fTxtB = db.ok? ("预测穿轨 ≈"+(db.fPred>=10? Math.round(db.fPred): db.fPred.toFixed(1))+" 次/年") : "预测穿轨 —";
  const initN = d.initCapital>0? d.initCapital : 0;
  el.innerHTML = `<div class="optbox" style="margin-top:12px;padding:12px 15px">
    <div style="font-weight:600;font-size:13px;margin-bottom:8px">收益优先结果（历史样本内，风险受控，口径与①对齐）</div>
    <div style="font-size:13px;line-height:1.9">
      参数：间距 <b>${pct(b.spacingPct,1)}</b> · 上/下 <b>${b.upGrids}/${b.downGrids}</b> 格 · 每笔 <b>${fmt(b.qtyPerTrade,0)}</b> 股<br>
      回测网格收益：<b>${fmt(curV,0)}</b> → <b class="${signClass(diffR)}">${fmt(r.bestScore,0)}</b>（Δ <b class="${signClass(diffR)}">${fmt(diffR,0)}</b>）· 总收益率 ${pct(simBest.overall,2)}
    </div>
    <div class="cd-dim" style="margin-top:6px">${fTxtB} · 满仓需资金 ≈ ¥${fmt(needN,0)}（初始投入 ¥${fmt(initN,0)}${needN>initN&&initN>0? "，略超，可上调每笔外的余量或确认接受":""}）· 历史最优≠未来最优，趋势市中谨慎。</div>
    <div style="margin-top:8px"><button class="btn sm ghost" onclick="applySugToCond('${g.id}',{spacingPct:${b.spacingPct},upGrids:${b.upGrids},downGrids:${b.downGrids},qtyPerTrade:${b.qtyPerTrade}})">一键填入表单</button><span style="margin-left:8px;font-size:11px;color:var(--muted)">填入后请核对「持仓控制」上限并应用</span></div>
  </div>`;
}

/* ============ 删除网格 ============ */
function delGrid(id){
  const g=getGrid(id); if(!g) return;
  const inPfs=pfList().filter(p=>(p.members||[]).some(m=>m.gridId===id));
  const pfNote = inPfs.length? `<br><span style="color:#8A6A2F">该标的已在 ${inPfs.length} 个资产组合中——删除后会自动从这些组合中移除（组合本身保留）。</span>` : "";
  confirmModal("删除网格","将删除「"+esc(g.meta.name)+"（"+esc(g.meta.code)+"）」及其全部交易、条件单历史与行情。此操作不可逆！"+pfNote,()=>{
    if(g._testGrid){ try{ if(id===TEST_GRID_ID){ localStorage.setItem(KEY_TESTDISMISS,"1"); localStorage.removeItem(KEY_TESTGRID); } else if(id===TEST_GRID2_ID){ localStorage.setItem(KEY_TESTDISMISS2,"1"); localStorage.removeItem(KEY_TESTGRID2); } else { localStorage.setItem(KEY_TESTDISMISS3,"1"); localStorage.removeItem(KEY_TESTGRID3); }
      // 把已删除的测试网格 id 纳入 state.dismissedTests（随 save 上云，使删除可跨设备生效）
      state.dismissedTests = state.dismissedTests||[]; if(!state.dismissedTests.includes(id)) state.dismissedTests.push(id);
    }catch(e){} } // 删除任一测试网格后不再自动添加（按 id 区分）
    state.grids=state.grids.filter(x=>x.id!==id);
    /* 从所有已保存组合与草稿中摘除该成员（组合本身保留） */
    state.portfolios.forEach(p=>{ p.members=(p.members||[]).filter(m=>m.gridId!==id); });
    if(state.pfDraft) state.pfDraft.members=(state.pfDraft.members||[]).filter(m=>m.gridId!==id);
    if(state.pfPick && state.pfPick.gridId===id) state.pfPick=null;
    if(state.activeId===id) state.activeId=state.grids.length?state.grids[0].id:null;
    save(); render(); toast("已删除网格"+(inPfs.length? "，并已从所属组合移除":""));
  });
}

/* ============ 腾讯自选股：行情获取 ============ */
function normalizeCode(raw){
  if(!raw) return raw;
  let c=String(raw).trim().toLowerCase();
  if(c.endsWith(".sh")) return "sh"+c.slice(0,-3);
  if(c.endsWith(".sz")) return "sz"+c.slice(0,-3);
  if(c.endsWith(".bj")) return "bj"+c.slice(0,-3);
  if(/^(sh|sz|bj)/.test(c)) return c;                 // 已带前缀，原样返回
  if(/^\d{4,6}$/.test(c)){                            // 纯数字：按首位推断交易所
    const f=c[0];
    if(f==="6"||f==="5"||f==="9") return "sh"+c;      // 沪市主板/科创板/ETF/B股
    if(f==="8"||f==="4") return "bj"+c;               // 北交所
    if(f==="0"||f==="3"||f==="2"||f==="1") return "sz"+c; // 深市主板/创业板/基金
    return "sh"+c;
  }
  return c;
}
/* ============ 东方财富：行情获取（CORS，不同域名；主源，腾讯作保底） ============ */
function fetchWithTimeout(url, ms){
  const ctrl=new AbortController(); const t=setTimeout(()=>ctrl.abort(), ms);
  return fetch(url,{signal:ctrl.signal, mode:"cors"}).then(r=>{clearTimeout(t); return r;}, e=>{clearTimeout(t); throw e;});
}
function emSecid(code){
  code=normalizeCode(code);
  const m=code.slice(0,2), num=code.slice(2);
  const market=(m==="sh")?"1":((m==="bj")?"0":"0");   // 沪市1，深市/北交所0
  return market+"."+num;
}
function fetchEMPrice(code){
  const secid=emSecid(code);
  return fetchWithTimeout(`https://push2.eastmoney.com/api/qt/stock/get?secid=${secid}&fields=f43,f44,f45,f57,f58,f60`, 8000)
    .then(r=>r.json()).then(d=>{
      if(!d||d.rc!==0||!d.data||d.data.f43==null) throw new Error("无数据");
      const p=d.data; const px=p.f43/1000;
      return {name:p.f58, price:px, prevClose:p.f60/1000,
        high:(p.f44!=null?p.f44/1000:px),
        low:(p.f45!=null?p.f45/1000:px), time:""};
    }).catch(e=>{ if(e&&e.message==="无数据") throw e; throw new Error("网络错误"); });
}
function fetchEMKline(code,start,end){
  const secid=emSecid(code);
  const beg=String(start).replace(/-/g,""), end2=String(end).replace(/-/g,"");

    .then(r=>r.json()).then(d=>{
      if(!d||!d.data||!d.data.klines||!d.data.klines.length) throw new Error("无数据");
      return d.data.klines.map(x=>{ const a=x.split(","); return {date:a[0], open:parseFloat(a[1]), close:parseFloat(a[2]), high:parseFloat(a[3]), low:parseFloat(a[4])}; });
    }).catch(e=>{ if(e&&e.message==="无数据") throw e; throw new Error("网络错误"); });
}
function fetchMarketEM(code){
  const start=daysAgoISO(400), end=todayISO();
  return Promise.all([fetchEMPrice(code), fetchEMKline(code,start,end)]).then(([price, klineLong])=>{
    const n=klineLong.length;
    const w52=klineLong.slice(Math.max(0,n-252));
    const d60=klineLong.slice(Math.max(0,n-60));
    const high52=Math.max(...w52.map(x=>x.high)), low52=Math.min(...w52.map(x=>x.low));
    const high60=Math.max(...d60.map(x=>x.high)), low60=Math.min(...d60.map(x=>x.low));
    const rets=[]; for(let i=1;i<d60.length;i++) rets.push((d60[i].close-d60[i-1].close)/d60[i-1].close);
    const rm=rets.reduce((a,b)=>a+b,0)/rets.length;
    const rstd=Math.sqrt(rets.reduce((a,b)=>a+(b-rm)*(b-rm),0)/rets.length);
    const annVol=rstd*Math.sqrt(252);
    const startWin=daysAgoISO(63);
    let chart=klineLong.filter(x=>x.date>=startWin);
    if(chart.length<2) chart=klineLong.slice(Math.max(0,n-44));
    return {name:price.name, price:price.price, high52,low52,high60,low60,dailyVol:rstd,annVol, kline:chart, source:"eastmoney", fetchedAt:todayISO()};
  });
}
/* 当日分时（1分钟）K线：用于成交驱动网格自动录入，按时间顺序扫描穿越。字段顺序 [time,open,close,high,low,...]
   失败自动重试一次（东方财富分时 API 在弱网下偶发超时/空响应，重试可显著提升移动端取到完整当日分时的概率） */
function fetchIntradayEM(code){
  const secid=emSecid(code);
  const end=todayISO().replace(/-/g,""); const beg=end;
  const url=`https://push2his.eastmoney.com/api/qt/stock/kline/get?secid=${secid}&klt=1&fqt=0&beg=${beg}&end=${end}&fields1=f1,f2,f3&fields2=f51,f52,f53,f54,f55,f56,f57,f58`;
  const parse=r=>r.json().then(d=>{
    if(!d||!d.data||!d.data.klines||!d.data.klines.length) return [];
    return d.data.klines.map(x=>{ const a=x.split(","); return {t:a[0], open:+a[1], close:+a[2], high:+a[3], low:+a[4]}; });
  });
  return fetchWithTimeout(url,9000).then(parse).catch(()=> fetchWithTimeout(url,9000).then(parse).catch(()=>[]));
}
function fetchTencentPrice(code){
  code=normalizeCode(code);
  return new Promise((res,rej)=>{
    const s=document.createElement("script"); const t=setTimeout(()=>{cleanup();rej(new Error("超时"));},6000);
    const cleanup=()=>{clearTimeout(t); if(s.parentNode) s.parentNode.removeChild(s);};
    s.onerror=()=>{cleanup();rej(new Error("网络错误"));};
    s.onload=()=>{ const raw=window["v_"+code]; cleanup(); if(!raw) return rej(new Error("无数据"));
      const p=raw.split("~"); res({name:p[1],price:parseFloat(p[3]),prevClose:parseFloat(p[4]),high:parseFloat(p[33]),low:parseFloat(p[34]),time:p[31]}); };
    s.src="https://qt.gtimg.cn/q="+code; document.head.appendChild(s);
  });
}
function fetchTencentKline(code,start,end){
  code=normalizeCode(code);
  return new Promise((res,rej)=>{
    const cb="tklinecb_"+Date.now(); const s=document.createElement("script");
    const t=setTimeout(()=>{cleanup();rej(new Error("超时"));},8000);
    const cleanup=()=>{clearTimeout(t); if(s.parentNode) s.parentNode.removeChild(s); delete window[cb];};
    s.onerror=()=>{cleanup();rej(new Error("网络错误"));};
    window[cb]=function(d){ cleanup(); try{
      const node=d.data[code]||{}; const qfq=node.qfqday||node.day||[];
      const out=qfq.map(x=>({date:x[0], open:parseFloat(x[1]), close:parseFloat(x[2]), high:parseFloat(x[3]), low:parseFloat(x[4])}));
      res(out);
    }catch(e){ rej(e); } };
    s.src=`https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?param=${code},day,${start},${end},300,qfq&_var=${cb}`;
    document.head.appendChild(s);
  });
}
function fetchIntradayTX(code){
  code=normalizeCode(code);
  return new Promise((res,rej)=>{
    const cb="mincb_"+Date.now();
    const s=document.createElement("script");
    const t=setTimeout(()=>{cleanup();rej(new Error("超时"));},8000);
    const cleanup=()=>{clearTimeout(t); if(s.parentNode) s.parentNode.removeChild(s); try{delete window[cb];}catch(e){}};
    s.onerror=()=>{cleanup();rej(new Error("网络错误"));};
    window[cb]=function(d){ cleanup(); try{
      const node=d&&d.data&&(d.data[code]||{});
      const arr=(node.data&&node.data.data)||[];
      if(!arr.length) return rej(new Error("无分时"));
      const out=arr.map(x=>{ const a=String(x).split(" "); return {t:a[0], close:parseFloat(a[1])}; });
      res(out);
    }catch(e){ rej(e); } };
    s.src=`https://web.ifzq.gtimg.cn/appstock/app/minute/query?_var=${cb}&code=${code}`;
    document.head.appendChild(s);
  });
}
/* 当日分时取数：东方财富直连（CORS，仅本机/同源可用）优先；失败或返回空 → 腾讯 JSONP 兜底（github.io 等跨域页面必走此路，否则拿不到分时、自动录入会被静默跳过） */

function fetchMarketTX(code){
  const start=daysAgoISO(400), end=todayISO();
  return Promise.all([fetchTencentPrice(code), fetchTencentKline(code,start,end)]).then(([price, klineLong])=>{
    const n=klineLong.length;
    const w52=klineLong.slice(Math.max(0,n-252));
    const d60=klineLong.slice(Math.max(0,n-60));
    const high52=Math.max(...w52.map(x=>x.high)), low52=Math.min(...w52.map(x=>x.low));
    const high60=Math.max(...d60.map(x=>x.high)), low60=Math.min(...d60.map(x=>x.low));
    const rets=[]; for(let i=1;i<d60.length;i++) rets.push((d60[i].close-d60[i-1].close)/d60[i-1].close);
    const rm=rets.reduce((a,b)=>a+b,0)/rets.length;
    const rstd=Math.sqrt(rets.reduce((a,b)=>a+(b-rm)*(b-rm),0)/rets.length);
    const annVol=rstd*Math.sqrt(252);
    const startWin=daysAgoISO(63); // 今天及之前约 2 个月的行情窗口

/* 行情获取：云端代理优先（绕开本机网络屏蔽）；代理失败时给出明确提示，而非静默回退到被屏蔽的腾讯源 */
function fetchMarket(code){
  if(cloudCfg()){
    return fetchMarketProxy(code)
      .then(m=>{
        // 代理当日数据新鲜（最后一根=今天）→ 直接用；否则回退东方财富/腾讯直连取当日行情，
        // 保证自动录入基于最新实盘（代理偶发滞后一天时仍能正确触发）
        if(m && m.kline && m.kline.length && m.kline[m.kline.length-1].date===todayISO()) return m;
        return fetchMarketEM(code).catch(()=> m || Promise.reject(new Error("行情获取失败")));
      })
      .catch(e=> fetchMarketEM(code).catch(()=> Promise.reject(new Error("行情获取失败："+(e&&e.message||e)))));
  }
  return fetchMarketEM(code).catch(err=> fetchMarketTX(code));
}
function refreshMarket(id, silent){
  const g=getGrid(id); if(!g) return;
  if(g._fetching){ if(!silent) toast("行情获取进行中…"); return; }
  g._fetching=true;
  if(!silent) toast("正在获取行情…");
  const btn=document.getElementById("mktBtn");
  if(btn){ btn.disabled=true; }
  return fetchMarket(g.meta.code).then(m=>{
    g._fetching=false;
    g.market=m;
    g.pricePath=m.kline.map(x=>({date:x.date, close:x.close}));
    g.cond.params.currentPrice=m.price;
    const n=syncLiveClose(g);
    saveLocal();
    $("view").innerHTML=renderDetail(g); bindDetail(g);
    if(!silent) toast("行情已更新："+g.meta.name+" ¥"+fmt(m.price,3)+(n>0?` · 已同步 ${n} 笔当日收盘`:""));
  }).catch(err=>{
    g._fetching=false; g._autoFetched=true;
    if(!silent){ $("view").innerHTML=renderDetail(g); bindDetail(g); toast("行情获取失败（"+(err&&err.message||err)+"），沿用已有数据。"); }
  });
}

/* ============ 条件单触发自动录入（监测当日实盘：盘中触及即录入，成交驱动型移动基准价，可一日多次） ============ */
const AUTO_MONITOR_MS = 60000;   // 每 60 秒巡检一次（仅页面打开时运行）
/* 成交驱动（deal-driven）自动录入：
   - 基准价 = 近一次成交价（非今日的最后一笔；无则初始基准价 basePrice）
   - 按当日分时（1分钟）路径 + 现价，逐根扫描：价格较基准再跌一个间距→买入、再涨一个间距→卖出
   - 每记录一笔，基准价顺移至该成交价（成交驱动），故下一根只可能触发「更远一格」的线
   - 单根最多一笔（1分钟内双向穿越只处理其一），杜绝极小间距/高波动下的无限刷单
   - 用 (日期,方向,价位) 去重合并：刷新/重跑不重复；保留历史成交，仅增量新增（幂等） */
function autoGridMonitor(){
  if(state._autoMonitor===false) return;          // 默认开启；可在「今天要处理」中关闭
  const today=todayISO();
  const targets = state.grids.filter(g=> isConfigured(g) && !isStopped(g) && !isPaused(g) && !g._noAuto);
  if(!targets.length) return;
  Promise.all(targets.map(g=>{
    const code=g.meta.code;
    return Promise.all([ fetchMarket(code), fetchIntraday(code) ]).then(([m, bars])=>{
      if(!m || !(m.price>0)) return null;
      g.market=m;
      g.pricePath=m.kline.map(x=>({date:x.date, close:x.close}));
      const cur=m.price;
      g.cond.params.currentPrice = cur;             // 静默更新现价（仅触发成交时才落盘）
      const sp=g.cond.params.spacingPct;
      const base0=g.cond.params.basePrice;
      if(!(sp>0) || !(base0>0)) return null;
      const qty = Math.max(100, Math.round((g.cond.params.qtyPerTrade||0)/100)*100);  // 整手（100股倍数）
      // 当日分时路径；取不到分时则本 tick 跳过（避免用日K高低误录，下一 tick 有分时再判定）
      if(!(bars && bars.length)) return null;
      // 路径：东方财富分时带 high/low；腾讯分时仅给每分钟收盘，这里用「前收~本收」重建当分钟高低，避免漏掉穿越
      let prevDayClose=cur;
      if(m.kline && m.kline.length){ const past=m.kline.filter(x=>x.date<today); if(past.length) prevDayClose=past[past.length-1].close; }
      const path = bars.map(b=>({high:(b.high!=null?b.high:b.close), low:(b.low!=null?b.low:b.close), close:b.close}));
      for(let i=0;i<path.length;i++){
        const prev = i>0 ? path[i-1].close : prevDayClose;
        path[i].high = Math.max(path[i].high, path[i].close, prev);
        path[i].low  = Math.min(path[i].low,  path[i].close, prev);
      }
      path.push({high:cur, low:cur, close:cur});     // 现价作为末点，参与判定
      // 成交驱动基准：近一次（非今日）成交价；无则初始基准价
      const prevDeals = g.trades.filter(t=>(t.type==="买入"||t.type==="卖出") && t.date<today)
        .sort((a,b)=> a.date<b.date?1:(a.date>b.date?-1:0));
      let base = prevDeals.length? prevDeals[0].trigger : base0;
      const r3=v=>Math.round(v*1000)/1000;
      const EPS=1e-9;
      const seq=[];
      for(const bar of path){
        let guard=0;
        while(guard++ < 400){   // 单根内可能跨越多格（分钟级跳空），逐格步进，直至该根不再穿越
          const buyLine=base*(1-sp), sellLine=base*(1+sp);
          if(bar.high>=sellLine-EPS && bar.low<=buyLine+EPS){
            // 双向穿越（罕见）：按收盘方向先处理其一，本根不再处理第二次（防刷单）
            if(bar.close>=base-EPS){ seq.push({type:"卖出", trigger:r3(sellLine)}); base=r3(sellLine); }
            else { seq.push({type:"买入", trigger:r3(buyLine)}); base=r3(buyLine); }
          } else if(bar.high>=sellLine-EPS){ seq.push({type:"卖出", trigger:r3(sellLine)}); base=r3(sellLine); }
          else if(bar.low<=buyLine+EPS){ seq.push({type:"买入", trigger:r3(buyLine)}); base=r3(buyLine); }
          else break;
        }
      }
      // 幂等合并：跳过今日已录入的同价同方向成交，仅增量新增（不删除历史成交）
      if(g._testGrid){
        const autoCnt = g.trades.filter(t=>t.date===today && (t.type==="买入"||t.type==="卖出")).length;
        if(bars.length < autoCnt) return null;   // 退化保护：当日分时被截断/异常（根数少于已录数）→ 保留现状，避免把完整序列降成残缺
        g.trades = g.trades.filter(t=> !(t._auto && t.date===today));  // 测试网格：今日自动成交按当前当日分时干净重算
      }
      const exist=new Set(g.trades.filter(t=>t.date===today && (t.type==="买入"||t.type==="卖出"))
        .map(t=> t.type+"@"+r3(t.trigger)));
      const added=[];
      for(const d of seq){
        const key=d.type+"@"+r3(d.trigger);
        if(exist.has(key)) continue;
        exist.add(key);
        g.trades.push({date:today, type:d.type, trigger:d.trigger, qty, close:round(cur,3), _auto:true});
        added.push(d.type);
      }
      if(added.length){ g._sample=false; return {g, added}; }
      return null;
    }).catch(()=>null);
  })).then(results=>{
    const logged = results.filter(Boolean);
    if(!logged.length) return;
    save(); render();
    logged.forEach(({g,added})=> toast(`已自动录入「${g.meta.name}」今日${added.length}笔成交（成交驱动网格）`));
  });
}
function toggleAutoMonitor(){
  state._autoMonitor = (state._autoMonitor===false)? true : false;
  save(); render();
  toast("条件单自动录入：" + (state._autoMonitor===false? "已关闭" : "已开启"));
}
function runAutoMonitorNow(){
  if(state._autoMonitor===false){ toast("自动录入已关闭，先点「开启」"); return; }
  toast("正在巡检当日分时…");
  autoGridMonitor();
}

/* ============ 初始化 ============ */
render();
// 首次打开（本地无云端配置）时，自动写入内置默认云端配置并启用，无需手动填地址/Key
try{ if(!localStorage.getItem(KEY_CLOUD)){ setCloudCfg(DEFAULT_CLOUD); } }catch(e){}
// 打开时先从云端拉取最新数据（若已启用云端同步）；仅拉取、不回推，避免用空白/默认本地状态覆盖云端
if(cloudCfg()){
  cloudPull().finally(()=>{
    // 拉取后：把本机已 dismiss 的测试网格 id 合并进 state.dismissedTests（兼容旧版仅存本地的标记），
    // 若确有新增则静默回推云端，使"删除测试网格"在手机/电脑多端一致生效
    try{
      let changed=false;
      [[KEY_TESTDISMISS,TEST_GRID_ID],[KEY_TESTDISMISS2,TEST_GRID2_ID],[KEY_TESTDISMISS3,TEST_GRID3_ID]].forEach(([k,id])=>{
        if(localStorage.getItem(k)){ state.dismissedTests=state.dismissedTests||[]; if(!state.dismissedTests.includes(id)){ state.dismissedTests.push(id); changed=true; } }
      });
      if(changed && !state._pristine) cloudPush(false);
    }catch(e){}
    try{ ensureTestGrid(); }catch(e){}
    maybeSnapshot();
  });
} else {
  ensureTestGrid();
}
// 每次打开工作台，自动先刷新一波行情（仅取各标的现价，轻量；离线或失败时沿用上次价格）
if(state.grids.length>0){
  setTimeout(()=>{ try{ refreshAllMarket(true); }catch(e){ console.warn("自动刷新行情失败：", e); } }, 700);
}
// 条件单触发自动录入：打开即启动定时巡检（默认开启；可在「今天要处理」中关闭）
try{ autoGridMonitor(); }catch(e){ console.warn("自动录入巡检初始化失败：", e); }
try{ setInterval(autoGridMonitor, AUTO_MONITOR_MS); }catch(e){ console.warn("自动录入定时器启动失败：", e); }
</script>
