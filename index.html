<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>网格交易回测工作台</title>
<style>
:root{
  --paper:#F6F5F1; --surface:#FFFFFF; --ink:#1B1A17; --muted:#79766E;
  --line:#E4E1D9; --up:#B23A2E; --down:#2E7D5B; --warn:#9A6B1F; --band:#FBF4EA;
  --bandline:#D9B777; --lock:#6B6F76;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
.wrap{max-width:1040px;margin:0 auto;padding:26px 22px 90px;}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:1.5px solid var(--ink);padding-bottom:14px;}
.brand{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);}
h1{font-size:25px;font-weight:600;margin:5px 0 2px;letter-spacing:.01em;}
.sub{font-size:13px;color:var(--muted);}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{appearance:none;border:1px solid var(--ink);background:transparent;color:var(--ink);
  padding:0 14px;min-height:44px;border-radius:2px;font-size:13px;cursor:pointer;letter-spacing:.04em;
  display:inline-flex;align-items:center;gap:7px;transition:.15s;}
.btn:hover{background:var(--ink);color:#fff}
.btn svg{width:15px;height:15px;display:block;flex:0 0 auto}
.btn.ghost{border-color:var(--line);color:var(--muted)}
.btn.ghost:hover{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn.sm{min-height:38px;padding:0 11px;font-size:12px}
.btn.primary{background:var(--ink);color:#fff}
.btn.primary:hover{opacity:.88}
.btn.danger{border-color:var(--up);color:var(--up)}
.btn.danger:hover{background:var(--up);color:#fff}
/* 轻量「确定 / 已备份」消隐按钮：贴近文字的内联小字（带勾），不占独立一行、不突兀 */
.btn.ack{display:inline-flex;align-items:center;vertical-align:middle;gap:3px;background:rgba(46,122,70,.09);border:1px solid rgba(46,122,70,.20);color:#3C7A46;border-radius:11px;min-height:0;padding:1px 9px;font-size:11px;letter-spacing:.02em;line-height:1.5;box-shadow:none;margin-left:6px;white-space:nowrap;cursor:pointer}
.btn.ack:hover{background:rgba(46,122,70,.15);color:#2E6038}
.btn.ack svg{width:12px;height:12px;flex:0 0 auto}
.btn.lock{border-color:var(--lock);color:var(--lock)}
.btn.lock:hover{background:var(--lock);color:#fff}

.section{margin-top:40px;}
.lab{font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--muted);
  border-bottom:1px solid var(--line);padding-bottom:9px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.lab .t{color:var(--ink);letter-spacing:.02em;font-size:15px;text-transform:none;font-weight:600}

.band{background:var(--band);border:1px solid var(--line);padding:16px 18px;margin-bottom:6px;display:flex;flex-direction:column;gap:11px;border-radius:3px}
.band .ttl{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--warn);font-weight:600}
.band .ttl-ctrls{display:flex;align-items:center;gap:8px}
.band-toggle{font-size:11px;letter-spacing:.02em;text-transform:none;font-weight:500;padding:3px 9px;border-radius:2px;border:1px solid var(--bandline);background:#fff;color:var(--warn);cursor:pointer}
.band-toggle:hover{background:var(--band)}
.band .ttl-ctrls .band-toggle{margin-left:0}
.am-pill{font-size:11px;letter-spacing:.02em;text-transform:none;font-weight:600;padding:2px 9px;border-radius:10px;white-space:nowrap}
.am-pill.on{background:#E7F2E7;color:#3C7A3C;border:1px solid #C9E2C9}
.am-pill.off{background:#F7ECEA;color:#B23A2E;border:1px solid #ECCFC9}
.band .ttl-sub{font-size:12px;letter-spacing:.02em;text-transform:none;color:var(--muted);font-weight:500}
.band .row{display:grid;grid-template-columns:18px minmax(0,1fr);gap:11px;align-items:start;font-size:14px;line-height:1.55}
/* 详情页浮空标的标识条：滚动时常驻视口顶部，标明当前标的（及所属资产组合） */
.detail-sticky{position:sticky;top:0;z-index:30;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:11px 18px;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(0,0,0,.06);margin-bottom:6px}
.detail-sticky .ds-left{display:flex;align-items:center;gap:10px;min-width:0}
.detail-sticky .ds-code{font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--muted);background:var(--line);padding:2px 8px;border-radius:3px;white-space:nowrap}
.detail-sticky .ds-name{font-size:18px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.detail-sticky .ds-pf{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-left:auto}
.detail-sticky .ds-pf-lbl{font-size:11px;color:var(--muted);letter-spacing:.02em;white-space:nowrap}
.detail-sticky .ds-pf-tag{font-size:12.5px;font-weight:600;color:#9A6B1F;background:#F3ECDD;border:1px solid #E2D4B8;border-radius:2px;padding:3px 9px;cursor:pointer;white-space:nowrap}
.detail-sticky .ds-pf-tag:hover{background:#EBE0C8}
.band .row svg{width:16px;height:16px;margin-top:2px}
.band .row > div{color:var(--ink);min-width:0}
.band .row > div:only-child{grid-column:1 / -1}
.tag{display:inline-block;padding:1px 7px;border-radius:2px;font-size:11px;letter-spacing:.02em;white-space:nowrap}
.tag.urgent{background:#FBEDEA;color:var(--up);border:1px solid #EAC9C2}
.tag.info{background:transparent;border:1px solid var(--ink);color:var(--ink)}
.tag.ok{background:#E8F1EC;color:var(--down);border:1px solid #C4E0D0}
/* 今日自动录入：状态栏只显示「已录入X笔」，鼠标移入/点按展开浮窗看具体明细 */
.auto-rec-pop{position:relative;cursor:pointer;outline:none}
.auto-rec-tip{display:none;position:absolute;left:0;top:calc(100% + 8px);z-index:60;background:#2B2B2B;color:#F4F4F4;padding:10px 12px;border-radius:10px;font-size:12.5px;line-height:1.5;box-shadow:0 8px 24px rgba(0,0,0,.22);min-width:180px;max-width:86vw;text-align:left;white-space:normal}
.auto-rec-tip::before{content:"";position:absolute;left:18px;top:-6px;border:6px solid transparent;border-bottom-color:#2B2B2B;border-top:0}
.auto-rec-pop:hover .auto-rec-tip, .auto-rec-pop:focus .auto-rec-tip, .auto-rec-pop.open .auto-rec-tip{display:block}
.auto-rec-tip .auto-rec-h{font-size:11px;color:#B9B9B9;margin-bottom:6px;letter-spacing:.04em}
.auto-rec-line{padding:3px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.auto-rec-line:last-child{border-bottom:0}
.auto-rec-line .nm{color:#9FD3B6;font-weight:600}
.auto-rec-line .tp-buy{color:#FF8A80}
.auto-rec-line .tp-sell{color:#80CBC4}
.tag.auto{background:#E7F0E9;color:#2E7D5B;border:1px solid #BFE0C8}
.mini-auto{display:inline-block;margin-left:4px;padding:0 5px;border-radius:2px;font-size:10.5px;background:#E7F0E9;color:#2E7D5B;border:1px solid #BFE0C8;vertical-align:middle}
tbody tr.hl-auto{background:#F2F8F3}
tbody tr.hl-auto td:first-child{box-shadow:inset 3px 0 0 #2E7D5B}
.tag.lock{background:transparent;border:1px solid var(--lock);color:var(--lock)}
.tag.stopped{background:#EFE7D8;color:#8A6A2F;border:1px solid #D9B777}
.mlabel{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;letter-spacing:.03em;color:var(--muted);white-space:nowrap;font-weight:500;vertical-align:middle}
.mlabel::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--lock);flex:0 0 auto;opacity:.5}
.mlabel.ok{color:var(--down)} .mlabel.ok::before{background:var(--down);opacity:1}
.mlabel.new{color:var(--warn)} .mlabel.new::before{background:var(--warn);opacity:1}
.mlabel.info{color:var(--muted)} .mlabel.info::before{background:var(--muted);opacity:.6}
.mlabel.lk{color:var(--lock)} .mlabel.lk::before{background:var(--lock);opacity:.85}
.btn.stop{color:#8A6A2F;border-color:#D9B777}
.btn.stop:hover{background:#F3ECDC}
.btn.resume{color:#2F7A4F;border-color:#9CC7AE}
.btn.resume:hover{background:#EAF4EE}

/* 交易明细分页控件：居中、等高、移动端友好 */
.pg{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:14px}
.pg-nav{display:inline-flex;align-items:center;gap:10px}
.pg-lab{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.pg-sel{font-size:12px;padding:6px 10px;border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--ink);min-height:34px;line-height:1;-webkit-appearance:none;appearance:none;cursor:pointer}
.pg-info{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.tf-inline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tf-item{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.tf-item>label{white-space:nowrap}
.tf-sel{font-size:12px;padding:6px 10px;border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--ink);min-height:34px;line-height:1;-webkit-appearance:none;appearance:none;cursor:pointer}
.tf-date{font-size:12px;padding:6px 8px;border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--ink);min-height:34px;line-height:1;cursor:pointer}
.tf-custom{gap:10px}
@media(max-width:760px){
  .card-h{padding:9px 12px;gap:6px 10px;align-items:flex-start}
  .card-title{flex:1 1 100%}
  .tf-inline{width:100%;display:grid;grid-template-columns:1fr 1fr auto;gap:7px 8px;align-items:center}
  .tf-item{width:100%}
  .tf-item>label{font-size:11px}
  .tf-sel{width:100%;min-height:36px;padding:7px 6px;font-size:13px}
  .tf-item.tf-custom{grid-column:1/4;display:flex;gap:8px}
  .tf-date{flex:1 1 0;min-width:0;min-height:36px;padding:6px 5px;font-size:13px}
  .tf-inline .btn.sm{grid-column:3;grid-row:1;justify-self:end;min-height:34px;padding:0 14px}
}
.pg .btn.sm{min-height:34px;padding:0 12px;flex-direction:row;font-size:12px}
@media(max-width:760px){ .pg{gap:10px 12px} .pg-lab,.pg-info{font-size:11px} .pg-sel{padding:7px 9px;min-height:38px} .pg .btn.sm{min-height:38px} }

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:3px;overflow:hidden}
.kpi{background:var(--surface);padding:14px 16px}
.kpi .v{font-size:22px;font-variant-numeric:tabular-nums;font-weight:600;letter-spacing:.01em}
.kpi .l{font-size:11.5px;color:var(--muted);margin-top:5px;letter-spacing:.03em}
.kpi .s{font-size:11px;color:var(--muted);margin-top:2px}
.up{color:var(--up)} .down{color:var(--down)}

/* 实时总资产条 */
.totals{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:3px;overflow:hidden;margin-top:14px}
.totals>div{background:var(--surface);padding:13px 15px}
.totals .k{font-size:11px;color:var(--muted)}
.totals .v{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:3px}
.totals .s{font-size:10.5px;color:var(--muted);margin-top:2px}
.hist li .acts{display:flex;gap:6px;align-items:center}
.hist li.edit{display:block}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:22px}
@media(max-width:760px){.grid2{grid-template-columns:1fr}}

/* 总览表 */
.ov{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:3px;overflow:hidden;margin-top:14px}
.ovrow{background:var(--surface);padding:13px 16px;display:grid;grid-template-columns:24px 1.5fr 1.9fr 1fr 1fr auto;gap:12px 14px;align-items:center}
.ovrow .assets{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.ovrow:hover{background:#FBFAF7}
.ovrow .sym{font-weight:600;font-size:14px}
.ovrow .sel{display:flex;align-items:center;justify-content:center}
.ovrow .sel input{width:16px;height:16px;accent-color:#9A6B1F;cursor:pointer;margin:0}
.ovrow .sym small{display:block;font-weight:400;color:var(--muted);font-size:11px;letter-spacing:.02em;margin-top:2px}
.ovrow .cond{font-size:12px;color:var(--muted);line-height:1.65}
.ovrow .cond b{color:var(--ink);font-weight:600}
.ovrow .profit{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.ovrow .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
/* 长标的名：不换行、不覆盖、超出收缩字体 */
.sym{display:flex;flex-direction:column;gap:3px;min-width:0}
.sym-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tip-anchor{color:var(--muted);border-bottom:1px dotted var(--muted);cursor:help;font-size:11px;margin-left:4px}
/* 资产构成图表（贴合工作台配色） */
.ac-compact{display:flex;flex-direction:column;gap:12px;margin:2px 0 4px;position:relative}
.ac-sum{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.ac-lbl{font-size:12px;color:var(--muted);letter-spacing:.02em}
.ac-grand{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}
.ac-list{display:flex;flex-direction:column;gap:9px}
.ac-item{display:flex;flex-direction:column;gap:5px;min-width:0}
.ac-top{display:flex;align-items:center;gap:10px;min-width:0}
.ac-nm{flex:1 1 auto;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.ac-bar{display:flex;height:10px;border-radius:2px;overflow:hidden;background:var(--line);flex:0 0 auto}
.ac-bar .mv{background:var(--down)}
.ac-bar .csh{background:var(--warn)}
.ac-val{margin-left:8px;width:136px;text-align:right;font-size:11px;font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap;flex:0 0 auto}
.ac-num{font-size:10.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;flex:0 0 auto}
.ac-num b{color:var(--ink);font-weight:500}
.ac-legend{display:flex;align-items:center;gap:16px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.ac-dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:middle}
/* 资产构成 · 移动端可左右拖动查看（防窄屏裁切右侧¥值与占比） */
.ac-scroll{position:relative;overflow:hidden}
.ac-scroll .ac-list{width:100%}
.ac-hint{display:none}
@media (max-width:760px){
  /* 资产构成 · 横向滑动 */
  .ac-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;overflow-y:hidden;cursor:grab}
  .ac-scroll .ac-list{width:max-content;min-width:100%}
  .ac-scroll.grabbing{cursor:grabbing}
  .ac-scroll.grabbing .ac-num,.ac-scroll.grabbing .ac-top{-webkit-user-select:none;user-select:none}
  .ac-hint{display:block;position:absolute;top:2px;right:6px;z-index:3;font-size:10.5px;color:var(--muted);background:rgba(255,255,255,.85);border:1px solid var(--line);border-radius:9px;padding:1px 8px;pointer-events:none;transition:opacity .3s;white-space:nowrap}
  .ac-compact.ac-scrolled .ac-hint{opacity:0}
  /* 组合详情 · 移动端全局收窄字号（KPI / 总览行 / 资产构成 / 成员行） */
  .kpi .v{font-size:18px}
  .kpi .l{font-size:11px}
  .kpi .s{font-size:10.5px}
  .kpi{padding:10px 12px}
  .lab .t{font-size:13px}
  .totals .v{font-size:16px}
  .ovrow .assets,.ovrow .profit{font-size:14px}
  .ovrow .sym{font-size:13px}
  .ovrow .cond{font-size:11.5px}
  .ovrow{padding:10px 12px;gap:8px 10px}
  /* 资产构成正文进一步收窄 */
  .ac-grand{font-size:14px}
  .ac-val{font-size:10.5px;width:120px}
  .ac-num{font-size:10px}
  .ac-nm{font-size:11.5px}
  .ac-lbl{font-size:11px}
  .ac-bar{height:8px}
  .ac-item{gap:4px}
  .ac-top{gap:8px}
  .card-body{padding:12px}
}
/* 单标的详情页 · 持仓占比可视化 */
.hold-ratio{margin-top:14px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.hold-ratio .hr-ttl{font-size:13px;font-weight:600;color:var(--ink);margin-bottom:9px}
.hold-ratio .hr-sub{font-weight:400;color:var(--muted);font-size:11px;margin-left:7px}
.hold-ratio .hr-bar{display:flex;height:20px;border-radius:4px;overflow:hidden;background:var(--line)}
.hold-ratio .hr-mv{background:var(--down);height:100%}
.hold-ratio .hr-csh{background:var(--warn);height:100%}
.hold-ratio .hr-legend{display:flex;gap:18px;margin-top:9px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.hold-ratio .hr-legend b{color:var(--ink);font-variant-numeric:tabular-nums}
.hold-ratio .hr-dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:middle}
.hold-ratio .hr-pct{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
/* 持仓占比卡内 · 穿轨风险可视化 */
.hold-ratio .rr{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.hold-ratio .rr-ttl{font-size:13px;font-weight:600;color:var(--ink);margin-bottom:8px}
.hold-ratio .rr-sub{font-weight:400;color:var(--muted);font-size:11px;margin-left:7px}
.hold-ratio .rr-track{position:relative;height:30px;border-radius:7px;background:var(--line);margin:6px 0 2px;overflow:hidden}
.hold-ratio .rr-track.rr-breach{background:#F6D8D2}
.hold-ratio .rr-track.rr-near{background:#F9EAD0}
.hold-ratio .rr-track.rr-ok{background:#E2F1E8}
.hold-ratio .rr-out{position:absolute;top:0;bottom:0;background:rgba(192,57,43,.22);z-index:0}
.hold-ratio .rr-cell{position:absolute;top:0;bottom:0;background:rgba(26,86,196,.15);z-index:0;border-left:1px dashed rgba(26,86,196,.5);border-right:1px dashed rgba(26,86,196,.5)}
.hold-ratio .rr-celltxt{margin-top:7px;font-size:12px;color:var(--ink)}
.hold-ratio .rr-celltxt b{color:#1A56C4;font-weight:600;font-variant-numeric:tabular-nums}
.hold-ratio .rr-tick{position:absolute;top:7px;bottom:7px;width:1px;background:rgba(0,0,0,.16);z-index:1}
.hold-ratio .rr-rail{position:absolute;top:0;bottom:0;width:2px;background:#C0392B;z-index:2}
.hold-ratio .rr-base{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);z-index:2}
.hold-ratio .rr-now{position:absolute;top:-3px;bottom:-3px;width:3px;background:#1A56C4;transform:translateX(-50%);z-index:4;box-shadow:0 0 0 2px #fff;border-radius:2px}
.hold-ratio .rr-now::after{content:"";position:absolute;top:-9px;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:#1A56C4}
.hold-ratio .rr-axis{display:flex;justify-content:space-between;align-items:flex-end;font-size:10.5px;color:var(--muted);margin-top:4px}
.hold-ratio .rr-axis .rr-cur{font-weight:600;color:var(--ink)}
.hold-ratio .rr-axis b{color:#B03021;font-weight:600}
.hold-ratio .rr-legend{display:flex;gap:14px;font-size:10.5px;color:var(--muted);margin-top:7px}

.hr-legend{display:flex;align-items:center;gap:14px;font-size:10.5px;color:var(--muted);flex-wrap:wrap;margin-top:8px}
.hr-dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:middle}
/* 条件单诊断 · 每回合手续费占比 */
.cd-fee{background:var(--band);border:1px solid var(--bandline);border-radius:3px;padding:10px 12px;margin:10px 0}

/* 已被纳入资产组合的网格行（在总览默认隐藏，需点"显示"才出现）：淡淡的色块标识 + 锁定勾选 */
.ovrow.hidden{background:#FAF9F6}

form .row{display:flex;gap:12px;flex-wrap:wrap}

/* 打开工作台时确保测试网格存在（本地，云无关）：若已删除则不再添加；否则从本地存档恢复或新建。
   支持多个本地测试网格（每个独立 dismiss key，互不干扰）。 */
function ensureTestGrid(){
  try{
    const ensureOne=(id, buildFn, keyLocal, keyDismiss)=>{
      // 该测试网格曾被用户删除 → 不再自动添加（本地标记 或 云端同步的 dismissedTests 任一命中即视为已删除）
      if(localStorage.getItem(keyDismiss) || (state.dismissedTests||[]).includes(id)) return;
      /* 底仓(targetBaseCost 按"股"计)市值不得超过初始资金：否则为"元/股"单位错配等脏数据，需修正。
         注：targetBaseCost 全系统统一定义为"股"（calcPosCaps/recalcDerived/calcQtySug 均按股处理）。 */
      const baseCorrupt=(p)=> p && p.targetBaseCost>0 && p.basePrice>0 && p.initCapital>0
                             && p.targetBaseCost*p.basePrice > p.initCapital;
      const ex=state.grids.find(g=>g.id===id);
      if(ex){                                                // 已在 state（含本地存档）：校验并就地修正
        if(baseCorrupt(ex.cond && ex.cond.params)){
          const nf=buildFn();
          ex.cond.params.targetBaseCost=nf.cond.params.targetBaseCost;
          recalcDerived(ex.cond.params, (ex.market? ex.market.kline : ex.pricePath));  // 重算持仓上下限
          try{ localStorage.setItem(keyLocal, JSON.stringify(ex)); }catch(e){}
          try{ save(); }catch(e){}                           // 持久化修正到主存档(KEY_STATE)
        }
        return;
      }
      let tg=null;
      try{ const r=localStorage.getItem(keyLocal); if(r) tg=JSON.parse(r); }catch(e){}
      if(tg && tg.id===id && baseCorrupt(tg.cond && tg.cond.params)) tg=null;  // 本地存档脏数据 → 重建
      if(!tg || tg.id!==id) tg=buildFn();
      try{ localStorage.setItem(keyLocal, JSON.stringify(tg)); }catch(e){}
      state.grids.push(tg);
      render();
    };
    ensureOne(TEST_GRID_ID, buildTestGrid, KEY_TESTGRID, KEY_TESTDISMISS);
    ensureOne(TEST_GRID2_ID, buildTestGrid2, KEY_TESTGRID2, KEY_TESTDISMISS2);
    ensureOne(TEST_GRID3_ID, buildTestGrid3, KEY_TESTGRID3, KEY_TESTDISMISS3);
    try{ autoGridMonitor(); }catch(e){ console.warn("测试网格自动录入初始化失败：",e); }
  }catch(e){ console.warn("ensureTestGrid 失败：",e); }
}

function load(){
  try{
    const r = localStorage.getItem(KEY_STATE); if(!r){ const s=defaultState(); s._pristine=true; return s; }
    const d = JSON.parse(r);
    if(d && d.grids && Array.isArray(d.grids)){
      d._pristine=false;
      if(!Array.isArray(d.portfolios)) d.portfolios=[];   // 旧数据无资产组合字段时补空数组
      d.pfDraft=null; d.pfPick=null;                      // 编辑草稿/快速纳入为临时态，重载即丢弃
      return d;
    }
    if(d && d.params){ // 旧版单网格迁移
      const g = makeGrid({
        meta: d.meta||{code:"sh510300",name:"沪深300ETF"},
        cond: d.params, trades: d.trades||[], pricePath: d.pricePath||[],
        market: d.market||null, _sample: d._sample
      });
      g.cond.history[0].note = "初始设置（迁移自旧版）";
      return { grids:[g], activeId:null, view:"overview" };
    }
    const s=defaultState(); s._pristine=true; return s;
  }catch(e){ const s=defaultState(); s._pristine=true; return s; }
}
function save(){
  state._pristine=false;   // 用户主动保存即视为真实数据，允许同步
  try{ state._savedAt = new Date().toISOString(); localStorage.setItem(KEY_STATE, JSON.stringify(state)); }
  catch(e){ alert("保存失败："+e.message); return; }
  cloudPush(true);    // 异步同步到云端，成功/失败均提示
  persistTestGrid();  // 测试网格（含自动录入成交）持久化到本机，避免跨刷新重复录入
  maybeSnapshot();    // 满足间隔则自动生成当日云端快照（30天滚动）
}

/* ============ 云端同步（Supabase 免费版：无需绑卡，长期免费） ============ */
/* 配置存本地：{ url, anon, enabled, lastSync }；未配置时本工具完全等同纯本地版 */
function cloudCfg(){
  try{ const r=localStorage.getItem(KEY_CLOUD); if(!r) return null; const c=JSON.parse(r);
    if(c && c.enabled && c.url && c.anon) return c; return null;
  }catch(e){ return null; }
}
function setCloudCfg(c){ try{ localStorage.setItem(KEY_CLOUD, JSON.stringify(c)); }catch(e){} }
function cloudHeaders(){
  const c=cloudCfg();
  return { "apikey": c.anon, "Authorization":"Bearer "+c.anon, "Content-Type":"application/json", "Prefer":"return=representation" };
}
/* 带重试的 fetch：Supabase 免费项目长期不访问会暂停，恢复时首次请求常返回 401 / 网络错误，
   延迟后重试一次即可成功（项目已唤醒）。tries 默认 2，仅对 401 与网络错误(ret status 0)重试。 */
function cfetch(url, opts, tries){
  tries = (tries==null)?2:tries;
  return fetch(url, opts).then(r=>{
    if(!r.ok){
      if(tries>1 && (r.status===401 || r.status===0)){ return new Promise(res=>setTimeout(res, 3000)).then(()=>cfetch(url, opts, tries-1)); }
      throw new Error("HTTP "+r.status);
    }
    return r;
  }).catch(err=>{
    if(tries>1){ return new Promise(res=>setTimeout(res, 3000)).then(()=>cfetch(url, opts, tries-1)); }
    throw err;
  });
}
/* 上传整份状态到 Supabase 表 gridtrader（id 固定 'app'，按 updated_at 最后写入胜出） */
function cloudPush(showToast){
  const c=cloudCfg(); if(!c) return Promise.resolve(false);
  if(state._pristine){ console.warn("跳过云端上传：当前为默认演示数据，避免覆盖云端真实数据"); return Promise.resolve(false); }
  // 空状态（无网格且无组合）绝不上传，避免一次误删/异常把云端全部历史抹掉
  if(isEmptyState(state)){
    console.warn("跳过云端上传：本地无网格且无组合，避免用空数据覆盖云端历史");
    if(showToast) toast("本地为空，已阻止覆盖云端（数据已被保护）");
    return Promise.resolve(false);
  }
  const now = state._savedAt || new Date().toISOString();
  // 本地测试网格（_noCloudSync）仅存本机，过滤掉再上云，绝不污染云端真实数据
  const pushState = (state.grids && state.grids.some(g=>g._noCloudSync))
    ? Object.assign({}, state, { grids: state.grids.filter(g=>!g._noCloudSync) })
    : state;
  const body=JSON.stringify([{ id:"app", data:pushState, updated_at:now }]);
  return cfetch(`${c.url}/rest/v1/gridtrader?on_conflict=id`, {
    method:"POST", headers:Object.assign(cloudHeaders(),{ "Prefer":"resolution=merge-duplicates" }), body
  }, 2).then(r=>{ if(!r.ok) throw new Error("HTTP "+r.status);
    if(showToast) toast("已同步到云端 · "+new Date().toLocaleTimeString());
    return true; })
   .catch(err=>{ if(showToast) toast("云端同步失败："+err.message); return false; });
}
function saveLocal(){
  try{ state._savedAt = new Date().toISOString(); localStorage.setItem(KEY_STATE, JSON.stringify(state)); }catch(e){}
}
/* 从云端拉取最新状态（云端更新时间更新则覆盖本地，最后写入胜出）。force=true 时忽略时间比较、强制以云端覆盖本地（手动"拉取"用） */
function cloudPull(force){
  const c=cloudCfg(); if(!c) return Promise.resolve(false);
  return cfetch(`${c.url}/rest/v1/gridtrader?id=eq.app&select=id,data,updated_at`, { headers:cloudHeaders() }, 2)
    .then(r=>{ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .then(rows=>{
      const row=(rows&&rows[0])?rows[0]:null;
      if(!row||!row.data) return false;
      if(!Array.isArray(row.data.grids)) return false;          // 结构异常（非本工具数据），拒绝采用
      const cloudP = isPristine(row.data);
      const localP = !!state._pristine;
      const cloudEmpty = isEmptyState(row.data);
      const localEmpty = isEmptyState(state);
      /* 保护 A：云端为空、本地有内容 → 绝不拉取覆盖本地（这就是上次全量丢失的路径，必须堵死） */
      if(cloudEmpty && !localEmpty) return false;
      /* 保护 B：本地为空、云端有内容 → 忽略时间戳，强制拉取，实现"误清空后自动自愈" */
      const selfHeal = localEmpty && !cloudEmpty && !localP;
      if(!selfHeal){
        const cloudNewer = force || tsMs(row.updated_at) > tsMs(state._savedAt);
        // 保护 C：本地是真实数据、云端却是默认演示数据 → 不覆盖本地
        if(cloudP && !localP) return false;
        if(!cloudNewer) return false;
      }
      // 覆盖前：把当前本地状态留一份备份，可一键回滚
      try{ localStorage.setItem(KEY_STATE_BAK, JSON.stringify(Object.assign({}, state, {_bakAt:new Date().toISOString()}))); }catch(e){}
      state=row.data; state._pristine=false;
      saveLocal(); render();
      toast((selfHeal? "检测到本机为空，已自动从云端恢复 · " : "已从云端同步 · ")+(state.grids?state.grids.length:0)+" 个网格 / "+(state.portfolios?state.portfolios.length:0)+" 个组合"); return true;
    }).catch(err=>{ console.warn("云端拉取失败：",err); return false; });
}
function cloudPullManual(){
  if(!cloudCfg()){ toast("未启用云端同步"); return; }
  toast("正在从云端拉取…");
  return cloudPull(true).then(ok=>{ if(!ok) toast("云端无可用数据（本地已是最新或未启用同步）"); });
}
/* 手动"上传到云端"：把当前本机完整状态强制写入云端（用于修复多设备不同步 / 恢复最新数据） */
function cloudPushManual(){
  if(!cloudCfg()){ toast("未启用云端同步"); return; }
  if(state._pristine){ toast("当前为示例数据，无需上传"); return; }
  toast("正在上传到云端…");
  cloudPush(true).then(ok=>{
    if(ok){
      const cc=cloudCfg(); if(cc){ cc.lastSync=new Date().toISOString().slice(0,19).replace("T"," "); setCloudCfg(cc); }
      render();
      toast("已上传到云端 · "+(state.grids?state.grids.length:0)+" 个网格 / "+(state.portfolios?state.portfolios.length:0)+" 个组合");
    } else {
      toast("上传失败，请检查网络与云端配置（地址/Key/数据表）");
    }
  });
}
/* ===== 云端快照：每 3 天自动保存一份当日数据，滚动保留最近 30 天，可恢复特定日期 ===== */
function daysBetween(a,b){ const da=new Date(a+"T00:00:00"), db=new Date(b+"T00:00:00"); return Math.round((db-da)/86400000); }
function maybeSnapshot(force){
  const c=cloudCfg(); if(!c) return;
  if(state._pristine) return;                       // 示例数据不快照
  const today=todayISO();
  const last=state._lastSnapDate;
  if(!force && last && daysBetween(last, today) < 3) return;   // 不足 3 天不重复生成
  pushSnapshot(today).then(ok=>{ if(ok){ state._lastSnapDate=today; saveLocal(); purgeSnapshots(); } });
}
/* 写入/覆盖当日快照（snap_date 唯一，每天一份最终态） */
function pushSnapshot(dateStr){
  const c=cloudCfg(); if(!c) return Promise.resolve(false);
  if(state._pristine) return Promise.resolve(false);
  const body=JSON.stringify([{ snap_date:dateStr, data:state }]);
  return fetch(`${c.url}/rest/v1/gridtrader_snapshots?on_conflict=snap_date`, {
    method:"POST", headers:Object.assign(cloudHeaders(),{ "Prefer":"resolution=merge-duplicates" }), body
  }).then(r=>{ if(!r.ok) throw new Error("HTTP "+r.status); return true; })
   .catch(err=>{ console.warn("云端快照失败：",err); return false; });
}
/* 删除 30 天前的旧快照（滚动保留） */
function purgeSnapshots(){
  const c=cloudCfg(); if(!c) return Promise.resolve(false);
  const cutoff=new Date(Date.now()-30*86400000).toISOString();

  }).then(r=>{ if(!r.ok) throw new Error("HTTP "+r.status); return true; })
   .catch(err=>{ console.warn("快照清理失败：",err); return false; });

let state = load();
/* 打开工作台时默认呈现「各标的收益总览」，而非某个条件单详情；用户点击「打开」再进入具体标的 */

/* ============ 回测引擎（复刻 Excel，已用 Node 逐行验证） ============ */
function computeBacktest(g){
  const p = g.cond.params;
  const trades = g.trades.slice().sort((a,b)=> a.date<b.date?-1:(a.date>b.date?1:0));
  const configured = isConfigured(g);
  // 投入资金基准：已配置网格=初始资金；建仓阶段（跳过条件单）= 实际累计净投入（尚未确认闲置现金）
  // 累计手续费（全部交易）：建仓阶段须计入投入资金基准与利润，避免手续费被遗漏
  const feeAmt = trades.reduce((a,t)=> a + Math.max(t.trigger*t.qty*p.feeRate, p.minFee), 0);
  const netInvestedPre = trades.reduce((a,t)=> a + ((t.type==="建仓"||t.type==="买入") ? t.trigger*t.qty : -t.trigger*t.qty), 0);
  const started = trades.length>0;   // 是否发生过任何成交（= 是否真的开始投入）
  // 投入资金基准：已配置=初始资金；建仓阶段=实际净投入(含费)。手续费是真实支出，须计入。
  // 一笔交易都未发生（含 组合里刚"新增标的"的未建仓网格）：initCapital/plan 只是计划资金，不是已到账现金
  // → 投入基准记 0、实时总资产记 0，避免把"计划投入 6 万"误显示成"已有 6 万资产"。
  const committed = configured ? (started ? p.initCapital : 0) : (netInvestedPre + feeAmt);
  let J=committed, I=0, K=0, buyAmt=0, sellAmt=0;   // 现金 / 持仓股数 / 移动平均成本合计(含费) / 累计买入(含费) / 累计卖出(净费)
  const rows=[];
  for(const t of trades){
    const type=t.type, C=t.trigger, D=t.qty, L=t.close;
    const E=D*C, F=E*p.feeRate, G=Math.max(F,p.minFee);
    let I2, K2, J2;
    if(type==="建仓"||type==="买入"){
      I2=I+D; K2=K + (E+G); J2=J - (E+G);            // 建仓/买入：加股、加成本(含费)、减现金(含费)
      buyAmt += E+G;
    } else { // 卖出：移动平均法，按当前持仓均价(含费)减成本
      const avg = I>0 ? K/I : C;
      I2=I-D; K2=K - avg*D; J2=J + (E-G);
      sellAmt += E-G;
    }
    const M=L*I2, N=J2+M, T=(I2!==0?K2/I2:0);
    // 已实现(落袋)网格收益 V：
    //  已配置 → V = J2 + K2 − committed，与 totalProfit-持仓浮动 恒等式一致（含现金与持仓成本）；
    //  建仓阶段 → 尚无网格成交，累计网格收益恒为 0（逐行均为 0，不随建仓笔数变化）。
    // 注：committed 为全量净投入，建仓阶段若用 K2−committed 会在中间行出现负值（误将后续建仓成本计入），故直接置 0。
    const V = configured ? (J2 + K2 - committed) : 0;
    const holdInvested = I2!==0 ? (buyAmt - sellAmt)/I2 : 0;   // 持仓成本(逐行,含费) = 累计成交(含费买入−净费卖出) ÷ 累计持仓
    rows.push({date:t.date,type,C,D,E,F,G,L,I:I2,J:J2,K:K2,M,N,T,V,cumBuy:buyAmt,cumSell:sellAmt,holdInvested});
    I=I2;J=J2;K=K2;
  }
  const cur = frozenCur(g);   // 停止网格时冻结为停止日收盘价（或当日现价）
  const last=rows[rows.length-1];
  const totalAssets = last ? (configured ? (last.J + cur*last.I) : (cur*last.I)) : 0;   // 无任何成交 → 0（未开始投入，无现金入账也无持仓）
  const totalProfit = totalAssets - committed;            // 【唯一真实利润口径：市值法 总资产−投入资金基准】
  const Vcum = last ? last.V : 0;                            // 已实现/落袋利润
  const unrealized = totalProfit - Vcum;                     // 持仓浮动盈亏 = 总收益 − 已落袋（恒等于 cur*I − K）
  const holdCost = last ? last.K : 0;                        // 持仓成本合计（移动平均法）
  const holdCostPer = (last && last.I!==0) ? last.K/last.I : 0;   // 网格均价（移动平均每股成本）
  const netInvested = buyAmt - sellAmt;                      // 累计净投入(含费) = 累计买入(含费) − 累计卖出(净费)
  const holdCostInvested = (last && last.I!==0) ? netInvested/last.I : 0;   // 持仓成本(含费) = 累计成交(含费) ÷ 累计持仓
  const gridReturn = committed>0 ? totalProfit/committed : 0;
  const overallReturn = gridReturn;
  // 网格启动日 = 第一笔建仓当天（建仓阶段/补单后，以真实建仓日为准；无建仓记录则回退到条件单 p.startDate）
  const firstBuild = trades.find(t=>t.type==="建仓") || trades[0] || null;
  const startDay = firstBuild ? firstBuild.date : p.startDate;
  const startPriceForChg = firstBuild ? firstBuild.trigger : p.startPrice;
  const endD=new Date(last?last.date:startDay), startD=new Date(startDay);
  const days=Math.max(1,(endD-startD)/86400000);
  const annual=Math.pow(1+overallReturn,365/days)-1;
  const startPrice=startPriceForChg, chg=(cur-startPrice)/startPrice;
  const annualChg=Math.pow(1+chg,365/days)-1;
  const passive=chg*committed;                           // 买入持有收益（基准）
  const excess=gridReturn-chg;                               // 网格超额收益（收益率口径）
  return {rows,summary:{
    Vcum, gridPos:last?last.I:0, gridAvg:holdCostPer,
    unreal:unrealized, realProfit:totalProfit, peakCap:holdCost, holdCost, holdCostPer, holdCostInvested, cumBuyAmt:buyAmt, cumSellAmt:sellAmt,
    gridReturn, totalAssets, overallReturn, annual, chg, annualChg, passive, excess, cur, days, committedCapital:committed,
    totalProfit, realized:Vcum, unrealized, cash:last?last.J:0
  }};
}

function gridLevels(p){
  const base=p.basePrice, sp=p.spacingPct;
  const down=[],up=[];
  for(let i=1;i<=p.downGrids;i++) down.push(base*Math.pow(1-sp,i));
  for(let i=1;i<=p.upGrids;i++) up.push(base*Math.pow(1+sp,i));
  return {down,up,upper:base*Math.pow(1+sp,p.upGrids),lower:base*Math.pow(1-sp,p.downGrids),base};
}

/* 穿轨风险可视化：现价 vs 网格上下轨（基准=初始基准价）。
   越界即穿轨：上穿=踏空（上方网格失效）、下穿=满仓被套（下方网格失效）。建仓阶段/未建条件单不判定。 */
function renderRailRisk(g, sm){
  if(!g || !isConfigured(g)) return "";
  const c=g.cond.params;
  if(!(c.basePrice>0) || !(c.spacingPct>0) || !((c.upGrids||0)>0 && (c.downGrids||0)>0)) return "";
  const gl=gridLevels(c), upper=gl.upper, lower=gl.lower, base=gl.base;
  const cur=(sm && sm.cur) || c.currentPrice || 0;
  if(!(cur>0)) return "";
  const sp=c.spacingPct;
  let status, tone, desc;
  if(cur>=upper){
    status="向上穿轨（破上轨）"; tone="down";
    desc=`现价 ¥${fmt(cur,3)} 已突破上轨 ¥${fmt(upper,3)}，上方网格全部越过、不再触发卖出；已落袋收益冻结，继续上涨踏空，回落至区间内方能重新被网格接住。`;
  } else if(cur<=lower){
    status="向下穿轨（破下轨）"; tone="down";
    desc=`现价 ¥${fmt(cur,3)} 已跌破下轨 ¥${fmt(lower,3)}，下方网格全部越过、不再触发买入；现金已耗尽或持仓已满，继续下跌被套，反弹至区间内方能重新被网格接住。`;
  } else {
    const nearUp=cur>=upper*(1-sp), nearDn=cur<=lower*(1+sp);
    if(nearUp){ status="接近上轨"; tone="warn"; desc=`现价距上轨 ¥${fmt(upper,3)} 不足一格，临近向上穿轨（持仓可能即将清空、踏空风险上升）。`; }
    else if(nearDn){ status="接近下轨"; tone="warn"; desc=`现价距下轨 ¥${fmt(lower,3)} 不足一格，临近向下穿轨（现金可能即将耗尽、被套风险上升）。`; }
    else { status="区间内（网格有效）"; tone="ok"; desc=`现价位于上下轨之间，网格双向触发均有效。`; }
  }
  const span=upper-lower, slack=span*0.06;
  let dLo=lower-slack, dHi=upper+slack;
  if(cur<dLo) dLo=cur-slack;
  if(cur>dHi) dHi=cur+slack;
  const dSpan=dHi-dLo;
  const pctOf=(p)=> Math.max(0, Math.min(100,(p-dLo)/dSpan*100));
  const breached=(cur>=upper || cur<=lower);
  /* 穿轨外区域阴影 */
  let outHtml="";
  if(breached){
    if(cur<=lower){ const L=pctOf(dLo), W=pctOf(lower)-L; outHtml=`<i class="rr-out" style="left:${L}%;width:${W}%"></i>`; }
    else { const L=pctOf(upper), W=pctOf(dHi)-L; outHtml=`<i class="rr-out" style="left:${L}%;width:${W}%"></i>`; }
  }
  /* 逐档网格刻度线：基准档(深色) / 上下轨边界(红) / 中间各档(浅灰)；同时记录每档价位用于定位"当前档位格子" */
  const ticks=[], lines=[];
  for(let k=-c.downGrids;k<=c.upGrids;k++){
    const price=base*Math.pow(1+sp,k), p=pctOf(price);
    lines.push({k,price});
    if(k===-c.downGrids || k===c.upGrids) ticks.push(`<i class="rr-rail" style="left:${p}%"></i>`);
    else if(k===0) ticks.push(`<i class="rr-base" style="left:${p}%"></i>`);
    else ticks.push(`<i class="rr-tick" style="left:${p}%"></i>`);
  }
  /* 当前档位格子：定位现价落在哪两档之间（几何网格），高亮该格并标注 */
  let cellHtml="", cellLabel, cellLow, cellHigh;
  if(cur<=lower){ cellLabel="已破下轨 · 处于网格之外"; cellLow=lower; cellHigh=lower; }
  else if(cur>=upper){ cellLabel="已破上轨 · 处于网格之外"; cellLow=upper; cellHigh=upper; }
  else {
    let j=0; for(let i=0;i<lines.length-1;i++){ if(cur>=lines[i].price && cur<lines[i+1].price){ j=i; break; } }
    cellLow=lines[j].price; cellHigh=lines[j+1].price;
    const kj=lines[j].k;
    if(Math.abs(cur-base) < base*sp*0.5) cellLabel="基准档";
    else if(kj>=0) cellLabel=`基准上方第 ${kj+1} 格`;
    else cellLabel=`基准下方第 ${-kj} 格`;
    const L=pctOf(cellLow), W=pctOf(cellHigh)-L;
    cellHtml=`<i class="rr-cell" style="left:${L}%;width:${W}%"></i>`;
  }
  const curPct=pctOf(cur);
  const trackCls = breached? "rr-breach" : (tone==="warn"? "rr-near":"rr-ok");
  const badgeCls = tone==="down"? "b-down" : (tone==="warn"? "b-warn":"b-ok");
  /* 穿轨深度（越过多少格） */
  let depthTxt="";
  if(cur<=lower){ const eg=(lower-cur)/(lower*sp); depthTxt=` · 已跌破下轨外 <b>${eg.toFixed(1)}</b> 格`; }
  else if(cur>=upper){ const eg=(cur-upper)/(upper*sp); depthTxt=` · 已突破上轨外 <b>${eg.toFixed(1)}</b> 格`; }
  return `
  <div class="rr">
    <div class="rr-ttl">穿轨风险<span class="rr-sub">现价 vs 网格上下轨（基准 ¥${fmt(base,3)} · 每格 ${(sp*100).toFixed(2)}%）</span></div>
    <div class="rr-track ${trackCls}">
      ${outHtml}
      ${cellHtml}
      ${ticks.join("")}
      <i class="rr-now" style="left:${curPct}%"></i>
    </div>
    <div class="rr-axis">
      <span>下轨 ¥${fmt(lower,3)}</span>
      <span class="rr-cur">现价 ¥${fmt(cur,3)}${depthTxt}</span>
      <span>上轨 ¥${fmt(upper,3)}</span>
    </div>
    <div class="rr-celltxt">当前档位：<b>${cellLabel}</b>${ (cur>lower && cur<upper)? `（¥${fmt(cellLow,3)} ~ ¥${fmt(cellHigh,3)}）` : "" }</div>
    <div class="rr-legend">
      <span><i class="rr-dot" style="background:var(--ink)"></i>基准档</span>
      <span><i class="rr-dot" style="background:#C0392B"></i>上下轨边界</span>
      <span><i class="rr-dot" style="background:#1A56C4"></i>现价</span>
    </div>
    <div class="rr-badge ${badgeCls}">${status}</div>
    <div class="rr-desc">${desc}</div>
  </div>`;
}

/* 计算当前价所处的网格档位（与 renderRailRisk 同源，供角标/合并图复用）。
   返回 null 表示未建条件单 / 缺基准价 / 缺现价，不适用。 */
function computeGridCell(c, cur){
  if(!(c.basePrice>0) || !(c.spacingPct>0) || !((c.upGrids||0)>0 && (c.downGrids||0)>0) || !(cur>0)) return null;
  const gl=gridLevels(c), upper=gl.upper, lower=gl.lower, base=gl.base, sp=c.spacingPct;
  let tone, status;
  if(cur>=upper){ status="向上穿轨（破上轨）"; tone="down"; }
  else if(cur<=lower){ status="向下穿轨（破下轨）"; tone="down"; }
  else {
    const nearUp=cur>=upper*(1-sp), nearDn=cur<=lower*(1+sp);
    if(nearUp){ status="接近上轨"; tone="warn"; }
    else if(nearDn){ status="接近下轨"; tone="warn"; }
    else { status="区间内（网格有效）"; tone="ok"; }
  }
  const lines=[];
  for(let k=-c.downGrids;k<=c.upGrids;k++) lines.push({k,price:base*Math.pow(1+sp,k)});
  let label, kj=null, cellLow, cellHigh;
  if(cur<=lower){ label="已破下轨 · 网格之外"; cellLow=lower; cellHigh=lower; }
  else if(cur>=upper){ label="已破上轨 · 网格之外"; cellLow=upper; cellHigh=upper; }
  else {
    let j=0; for(let i=0;i<lines.length-1;i++){ if(cur>=lines[i].price && cur<lines[i+1].price){ j=i; break; } }
    cellLow=lines[j].price; cellHigh=lines[j+1].price; kj=lines[j].k;
    if(Math.abs(cur-base) < base*sp*0.5) label="基准档";
    else if(kj>=0) label="基准上方第 "+(kj+1)+" 格";
    else label="基准下方第 "+(-kj)+" 格";
  }
  let depth=0;
  if(cur<=lower) depth=(lower-cur)/(lower*sp);
  else if(cur>=upper) depth=(cur-upper)/(upper*sp);
  return {label,kj,tone,status,upper,lower,base,sp,cellLow,cellHigh,depth,lines};
}

/* 总览/网格清单/今日处理 用的「当前第几格」角标（无需点进详情） */
function currentCellChip(g, sm){
  const c=g.cond.params;
  const cell=computeGridCell(c, sm.cur);
  if(!cell) return "";
  const map={down:"cell-down",warn:"cell-warn",ok:"cell-ok"};
  let txt=cell.label;
  if(cell.tone==="down") txt += `（外 ${cell.depth.toFixed(1)} 格）`;
  return `<span class="cellchip ${map[cell.tone]}" title="当前价 ¥${fmt(sm.cur,3)} 所处网格档位">${txt}</span>`;
}

/* 合并图：持仓占比 + 穿轨风险 共用一条价格/网格轴。
   原理：沿网格轴，价格越往下格→越多买入触发→持仓股数越多→持仓占比越高；
   故「当前档位」与「当前持仓占比」是同一价格轴的两个读数，合二为一。 */
function renderHoldRailMerged(g, sm){
  if(!g || !isConfigured(g)) return "";
  const c=g.cond.params;
  const cell=computeGridCell(c, sm.cur);
  if(!cell) return "";
  const gl=gridLevels(c), upper=gl.upper, lower=gl.lower, base=gl.base, sp=c.spacingPct;
  const cur=sm.cur;
  const span=upper-lower, slack=span*0.06;
  let dLo=lower-slack, dHi=upper+slack;
  if(cur<dLo) dLo=cur-slack;
  if(cur>dHi) dHi=cur+slack;
  const dSpan=dHi-dLo;
  const pctOf=(p)=>Math.max(0,Math.min(100,(p-dLo)/dSpan*100));
  const breached=(cur>=upper||cur<=lower);
  const lines=cell.lines;
  /* —— 真正合一的单图：同一价格轴（X）同时承载「穿轨网格线」与「持仓占比剖面」 ——
     · 竖向网格线 = 档位结构（基准/上下轨/中间档），即穿轨位置；
     · 红色面积曲线 = 持仓占比（Y 轴 0%~100%），价格越往下格→买入越多→占比越高；
     · 蓝色竖线 = 现价；蓝点 = 现价处对应的持仓占比（带数字标注）。 */
  const ticks=[];
  for(let i=0;i<lines.length;i++){
    const k=lines[i].k, p=pctOf(lines[i].price).toFixed(2);
    if(k===-c.downGrids||k===c.upGrids) ticks.push(`<line x1="${p}" y1="0" x2="${p}" y2="100" stroke="#C0392B" stroke-width="1.8" vector-effect="non-scaling-stroke"/>`);
    else if(k===0) ticks.push(`<line x1="${p}" y1="0" x2="${p}" y2="100" stroke="#8A6A2F" stroke-width="2" vector-effect="non-scaling-stroke"/>`);
    else ticks.push(`<line x1="${p}" y1="0" x2="${p}" y2="100" stroke="#D8D2C6" stroke-width="0.8" vector-effect="non-scaling-stroke"/>`);
  }
  let cellHtml="", cellLow=cell.cellLow, cellHigh=cell.cellHigh, curLbl=cell.label;
  if(!breached && cell.kj!==null){
    const L=pctOf(cellLow).toFixed(2), W=(pctOf(cellHigh)-pctOf(cellLow)).toFixed(2);
    cellHtml=`<rect x="${L}" y="0" width="${W}" height="100" fill="rgba(26,86,196,.09)" stroke="#1A56C4" stroke-width="0.6" stroke-dasharray="2 2" vector-effect="non-scaling-stroke"/>`;
  }
  const curPct=pctOf(cur);
  const badgeCls=cell.tone==="down"?"b-down":(cell.tone==="warn"?"b-warn":"b-ok");
  let depthTxt="";
  if(cur<=lower) depthTxt=` · 已跌破下轨外 <b>${cell.depth.toFixed(1)}</b> 格`;
  else if(cur>=upper) depthTxt=` · 已突破上轨外 <b>${cell.depth.toFixed(1)}</b> 格`;
  const outHtml=breached
    ? (cur<=lower ? `<rect x="${pctOf(dLo).toFixed(2)}" y="0" width="${(pctOf(lower)-pctOf(dLo)).toFixed(2)}" height="100" fill="rgba(192,57,43,.13)"/>`
                  : `<rect x="${pctOf(upper).toFixed(2)}" y="0" width="${(pctOf(dHi)-pctOf(upper)).toFixed(2)}" height="100" fill="rgba(192,57,43,.13)"/>`)
    : "";
  /* 持仓占比剖面：以当前持仓为锚，沿网格轴按「每下一格多买一笔 / 每上一格多卖一笔」推算各价位持仓占比 */
  const hrMv=sm.gridPos*sm.cur, hrTotal=sm.totalAssets||0, hrCash=hrTotal-hrMv;
  const hrReady=sm.gridPos>0 && sm.cur>0 && hrTotal>0;
  const hrMvPct=hrReady?hrMv/hrTotal*100:0;
  let kCur=0;
  for(let i=0;i<lines.length-1;i++){ if(cur>=lines[i].price && cur<lines[i+1].price){ kCur=lines[i].k; break; } }
  const q=c.qtyPerTrade||0;
  const profAt=(k)=>{
    let holding=sm.gridPos, cash=hrCash, pk=cur;
    const steps=k-kCur;
    if(steps!==0){
      const dir=steps<0?-1:1;
      for(let i=0;i<Math.abs(steps);i++){
        const nk=kCur+dir*(i+1);
        const pn=base*Math.pow(1+sp,nk);
        if(dir<0){ holding+=q; cash-=q*pn; } else { holding=Math.max(0,holding-q); cash+=q*pn; }
      }
    }
    pk=base*Math.pow(1+sp,k);
    if(cash<0) cash=0;
    const ta=holding*pk+cash;
    return ta>0?Math.max(0,Math.min(100,holding*pk/ta*100)):0;
  };
  const profPts=lines.map(l=>({x:pctOf(l.price), y:profAt(l.k)}));
  const lp=profPts.map(p=>`${p.x.toFixed(2)},${(100-p.y).toFixed(2)}`).join(" ");
  const x0=profPts[0].x.toFixed(2), x1=profPts[profPts.length-1].x.toFixed(2);
  const dotY=(100-hrMvPct).toFixed(2);
  // 占比数字标签自适应：点靠近顶部/左右边缘时翻向内侧，避免被 .hr-plot 的 overflow:hidden 裁掉
  const lblTx = curPct<14 ? "0%" : (curPct>86 ? "-100%" : "-50%");
  const lblTy = hrMvPct>80 ? "32%" : "-135%";
  const lblStyle=`left:${curPct.toFixed(2)}%;top:${dotY}%;transform:translate(${lblTx},${lblTy})`;
  const svg=`<svg class="hr-combo-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
    ${outHtml}
    <polygon points="${x0},100 ${lp} ${x1},100" fill="rgba(178,58,46,.15)"/>
    ${cellHtml}
    ${ticks.join("")}
    <polyline points="${lp}" fill="none" stroke="#B23A2E" stroke-width="1.8" vector-effect="non-scaling-stroke"/>
    <line x1="${curPct.toFixed(2)}" y1="0" x2="${curPct.toFixed(2)}" y2="100" stroke="#1A56C4" stroke-width="1.6" stroke-dasharray="3 2" vector-effect="non-scaling-stroke"/>
    <circle cx="${curPct.toFixed(2)}" cy="${dotY}" r="2.4" fill="#1A56C4" stroke="#fff" stroke-width="0.9" vector-effect="non-scaling-stroke"/>
  </svg>`;
  return `
  <div class="hr-combo">
    <div class="hr-mtitle">持仓-网格耦合<span class="hr-msub">同一价格轴：网格线=穿轨位置，红线=持仓占比，蓝点=当前</span></div>
    <div class="hr-combo-grid">
      <div class="hr-yaxis"><span>100%</span><span>50%</span><span>0%</span></div>
      <div class="hr-plot">
        ${svg}
        <div class="hr-ylab">持仓占比</div>
        ${hrReady?`<div class="hr-cur-pct" style="${lblStyle}">持仓 ${hrMvPct.toFixed(1)}%</div>`:""}
      </div>
    </div>
    <div class="hr-xaxis">
      <span>下轨 ¥${fmt(lower,3)}</span>
      <span class="hr-curx">现价 ¥${fmt(cur,3)}${depthTxt}</span>
      <span>上轨 ¥${fmt(upper,3)}</span>
    </div>
    <div class="hr-foot">
      <span>当前档位：<b>${curLbl}</b>${ (cur>lower&&cur<upper)?`（¥${fmt(cellLow,3)}~¥${fmt(cellHigh,3)}）`:"" }</span>
      ${hrReady?`<span class="hr-pill">持仓占比 <b>${hrMvPct.toFixed(1)}%</b> · 市值 ¥${fmt(hrMv,0)} / 现金 ¥${fmt(hrCash,0)}</span>`:""}
      <span class="rr-badge ${badgeCls}">${cell.status}</span>
    </div>
    <div class="hr-legend"><span><i class="hr-dot" style="background:#C0392B"></i>上下轨</span><span><i class="hr-dot" style="background:#8A6A2F"></i>基准价</span><span><i class="hr-dot" style="background:#B23A2E"></i>持仓占比曲线</span><span><i class="hr-dot" style="background:#1A56C4"></i>现价 / 当前占比</span></div>
  </div>`;
}

/* 成交驱动型：最新基准价 = 上一次网格触发（买入/卖出）的成交价格；无则取条件单初始基准价 */
/* 近一次成交价（成交驱动基准价）：取最近一笔买入/卖出成交价；同日多笔按录入顺序取最后一笔；无成交则用初始基准价 */
function lastDealPrice(trades, basePrice){
  let best=null, bi=-1;
  (trades||[]).forEach((t,i)=>{
    if(t.type!=="买入"&&t.type!=="卖出") return;
    if(best===null || t.date>best.date || (t.date===best.date && i>bi)){ best=t; bi=i; }
  });
  return best ? best.trigger : basePrice;
}
function latestBasePrice(g){ return lastDealPrice(g.trades, g.cond.params.basePrice); }

/* 成交驱动（deal-driven）网格：基准价 = 近一次成交价（无成交则用初始基准价）。
   下次买入 = 基准价×(1−间距)，下次卖出 = 基准价×(1+间距)；
   自动录入引擎(autoGridMonitor)按当日分时路径扫描、每穿越一格记录一笔、记录后基准价顺移至该成交价，
   故现价恒落在「下次买入线 < 现价 ≤ 下次卖出线」附近（基准价即最近穿越点）。 */
function nextTriggerLines(c, trades, cur){
  const base = lastDealPrice(trades, c.basePrice);
  const sp=c.spacingPct;
  return { base, buyNext: base*(1-sp), sellNext: base*(1+sp) };
}

/* ============ 停止网格（冻结收益/市值/天数） ============ */
function isStopped(g){ return !!(g.stop && g.stop.date); }
/* ============ 暂停网格（临时不提交买卖委托，用于调整底仓；不冻结收益，可随时恢复） ============ */
function isPaused(g){ return !!(g && g.paused && g.paused.on); }
function pauseGrid(id){
  const g=getGrid(id); if(!g) return;
  g.paused={ on:true, date:todayISO(), at:new Date().toISOString() };
  save(); render(); toast("网格已暂停：不再提交买卖委托，可调整底仓；完成后点「恢复委托」");
}
function resumePause(id){
  const g=getGrid(id); if(!g) return;
  g.paused=null;
  save(); render(); toast("网格已恢复：继续按条件单提交买卖委托");
}
/* 条件单是否已配置：建仓阶段（暂时跳过）的网格 cond.configured===false；旧数据/正常网格无该字段时默认视为已配置（true），保证向后兼容 */
function isConfigured(g){ return !!(g.cond && g.cond.configured!==false); }
/* 停止日当天的收盘价（从行情 K 线或历史价格路径取该日收盘；找不到返回 null） */
function stopClose(g, date){
  const series = (g.market && g.market.kline && g.market.kline.length) ? g.market.kline
               : (g.pricePath && g.pricePath.length ? g.pricePath : null);
  if(!series) return null;
  for(let i=series.length-1;i>=0;i--){ if(series[i].date<=date) return series[i].close; }
  return null;
}
/* 截断序列到指定日期（含），日期为 YYYY-MM-DD 可直接字典序比较 */
function truncateSeries(series, date){
  if(!series) return null;
  const t = series.filter(x=> x.date && x.date<=date);
  return t.length ? t : null;
}
/* 停止状态下用于估值的“当前价”：停止日≥今天→用实时现价（收盘后自动变收盘价）；过去日期→取该日收盘价（冻结） */
function frozenCur(g){
  if(!isStopped(g)) return g.cond.params.currentPrice;
  if(g.stop.date >= todayISO()) return g.cond.params.currentPrice;     // 停止日为今天：先用现价，收盘后刷新即变收盘价
  const sc = stopClose(g, g.stop.date);
  return sc!=null ? sc : g.cond.params.currentPrice;
}

/* 条件单下侧：按成交驱动（近一次成交价为基准）展示下一次买卖触发价 */
function renderNextTrigger(g){
  const p=g.cond.params;
  const cur=p.currentPrice||0;
  const {base,buyNext,sellNext}=nextTriggerLines(g.cond.params, g.trades, cur);
  const gridT=g.trades.filter(t=>t.type==="买入"||t.type==="卖出").sort((a,b)=>a.date<b.date?1:-1);
  const last=gridT[0];
  const src = last ? (`近一次成交：${last.date} ${last.type} @¥${fmt(last.trigger,3)}（成交驱动基准价）`) : "尚无网格成交，以初始基准价 ¥"+fmt(g.cond.params.basePrice,3)+" 为参照";
  const bTxt = "¥"+fmt(buyNext,3);
  const sTxt = "¥"+fmt(sellNext,3);
  return `<div class="pline" style="margin-top:14px;background:#F7F5EF">
    <div class="it"><div class="k">网格基准价（成交驱动）</div><div class="val">¥${fmt(base,3)}</div></div>
    <div class="it"><div class="k">标的现价（实时）</div><div class="val ${signClass((p.currentPrice||0)-base)}">¥${fmt(p.currentPrice,3)}</div></div>
    <div class="it"><div class="k">下次买入触发价 ↓</div><div class="val down">${bTxt}</div></div>
    <div class="it"><div class="k">下次卖出触发价 ↑</div><div class="val up">${sTxt}</div></div>
  </div>
  <div class="hint">${src}。价格较基准再跌一个间距至 ${bTxt} 触发<b style="color:var(--down)">买入（网格）</b>，再涨一个间距至 ${sTxt} 触发<b style="color:var(--up)">卖出（网格）</b>，间距 ${pct(p.spacingPct,2)}。基准价=近一次成交价，故现价一般位于买入线与卖出线之间。</div>`;
}

/* 今日（最近交易日）是否触发网格买卖：以最新基准价为参照，检测最近一根K是否穿越任一网格触发线 */
function todayTriggered(g){
  const p=g.cond.params;
  const base=latestBasePrice(g);
  const kline = (g.market? g.market.kline : g.pricePath);
  if(!kline||kline.length<2) return false;
  const last=kline[kline.length-1], prev=kline[kline.length-2];
  const prevClose=prev.close, lastClose=last.close;
  const low = last.low!=null? last.low : last.close;
  const high = last.high!=null? last.high : last.close;
  const levels=[];
  for(let i=1;i<=p.downGrids;i++) levels.push({v:base*Math.pow(1-p.spacingPct,i), buy:true});
  for(let i=1;i<=p.upGrids;i++) levels.push({v:base*Math.pow(1+p.spacingPct,i), buy:false});
  for(const lv of levels){
    if((prevClose-lv.v)*(lastClose-lv.v) < 0) return true;   // 收盘价穿越
    if(prevClose>lv.v && low<=lv.v) return true;              // 盘中下探买线
    if(prevClose<lv.v && high>=lv.v) return true;             // 盘上触及卖线
  }
  return false;
}

/* 网格触发状态（成交驱动）：基准价=近一次成交价；返回 {triggered, sides, side, buyNext, sellNext, base} */
function gridTriggerStatus(g, cur){
  const c=g.cond.params;
  const {base,buyNext,sellNext}=nextTriggerLines(c, g.trades, cur);
  const EPS=1e-9;
  const sides=[];
  if(cur <= buyNext+EPS) sides.push('buy');
  if(cur >= sellNext-EPS) sides.push('sell');
  return {triggered:sides.length>0, sides, side:sides[0]||null, buyNext, sellNext, base};
}

/* 历史成交：新→旧（同日期按录入逆序），稳定排序 */
function sortedNewest(g){
  return g.trades.map((t,i)=>({t,i}))
    .sort((a,b)=> a.t.date<b.t.date?1 : (a.t.date>b.t.date?-1 : (b.i-a.i)))
    .map(x=>x.t);
}
function addMonthsISO(ref, n){
  const d=parseDate(ref); const day=d.getDate(); d.setDate(1); d.setMonth(d.getMonth()+n);
  const dim=new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
  d.setDate(Math.min(day, dim));
  const z=x=>String(x).padStart(2,"0");
  return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate());
}
function tradeViewList(g){
  const tf = g._tf || {type:'all', range:'all'};
  let list = g.trades.map((t,i)=>({t,i}));
  if(tf.type && tf.type!=='all') list = list.filter(x=> x.t.type===tf.type);
  if(tf.range && tf.range!=='all'){
    const to = tf.range==='custom' ? (tf.to || todayISO()) : todayISO();
    let from;
    if(tf.range==='custom'){ from = tf.from || ''; }
    else { const off = tf.range==='1m'? -1 : tf.range==='3m'? -3 : -6; from = addMonthsISO(todayISO(), off); }
    list = list.filter(x=> (!from || x.t.date>=from) && x.t.date<=to);
  }
  list.sort((a,b)=> a.t.date<b.t.date?1 : (a.t.date>b.t.date?-1 : (b.i-a.i)));
  return list.map(x=>x.t);
}

/* 取某日期（含之前最近）的收盘价 */
function priceOnDate(kline, date){
  if(!kline||!kline.length||!date) return null;
  let best=null;
  for(const b of kline){ if(b.date<=date){ if(!best||b.date>best.date) best=b; } }
  if(best) return best.close;
  return kline[0].close;
}

/* 自动派生：期初价格（启动日行情）、建议底仓数量（半仓÷启动价，向上取整百） */
function recalcDerived(d, kline){
  if(!d) return;
  /* 期初价格 = 启动日行情，固定值：仅当缺失时自动补一次（不作为可填参数） */
  if(d.startDate && kline && kline.length && !(d.startPrice>0)){
    const sp=priceOnDate(kline, d.startDate);
    if(sp){ d.startPrice=round(sp,3); }
  }
  if(d.startPrice>0 && d.initCapital>0){
    const sug=Math.ceil((d.initCapital/2/d.startPrice)/100)*100;
    if(!d.targetBaseCost || d._autoBase){ d.targetBaseCost=sug; d._autoBase=true; }
  }
  /* 持仓控制上下限随格数与底仓自动（可手动覆盖：posMinQty/posMaxQty 字段，覆盖后置 _autoPosMin/_autoPosMax=false） */
  if(d.qtyPerTrade>0 && ((d.upGrids||0)>0 || (d.downGrids||0)>0)){
    const caps=calcPosCaps(d);
    if(caps.valid){
      if(d.posMaxQty==null || d._autoPosMax!==false){ d.posMaxQty=caps.max; d._autoPosMax=true; }
      if(d.posMinQty==null || d._autoPosMin!==false){ d.posMinQty=caps.min; d._autoPosMin=true; }
    }
  }
}


/* 改“每笔数量”时，按计划投入(初始资金)反算可承载的上下格并回填 */
function autoGridsFromQty(d){
  const C=d.initCapital>0? d.initCapital:0;
  const base=d.basePrice>0? d.basePrice:0;
  const sp=d.spacingPct>0? d.spacingPct:0;
  const q=Math.round(d.qtyPerTrade||0);
  if(!(C>0 && base>0 && sp>0 && q>0)) return false;
  let bq=d.targetBaseCost>0? Math.round(d.targetBaseCost) : Math.ceil(C/2/base/100)*100;
  let need=base*bq, dn=0;
  if(need<=C){
    while(dn<40){
      const nxt=need + base*Math.pow(1-sp,dn+1)*q;
      if(nxt<=C){ dn++; need=nxt; } else break;
    }
  }
  if(dn<1 && base*bq<C) dn=1;
  d.upGrids=dn; d.downGrids=dn; d._autoGrids=true;
  return true;
}
function syncGridInputs(d){
  ["upGrids","downGrids"].forEach(k=>{
    const el=document.querySelector(`input[data-k="${k}"]`);
    if(el && document.activeElement!==el) el.value=(d[k]!=null? d[k] : "");
  });
}
function onQtyChanged(d){ if(d && autoGridsFromQty(d)) syncGridInputs(d); }

/* 条件单字段输入：百分比以 % 显示；只读字段以文本呈现 */
function fieldInputHTML(f, v, oninput){
  if(f.date) return `<input type="date" data-k="${f.k}" value="${v||''}" oninput="${oninput}">`;
  if(f.ro) return `<input type="text" readonly value="${v!=null? v : "—"}" style="font-weight:600">`;
  let disp=(v==null? "": v); if(f.p) disp=round((v||0)*100,4);
  return `<input type="number" data-k="${f.k}" step="${f.p?0.01:(f.d>0?0.001:'1')}" value="${disp}" oninput="${oninput}">`;
}

/* 将自动派生字段的当前值同步回输入框（不抢焦点） */
function syncAutoFields(d){
  COND_FIELDS.filter(f=>f.auto).forEach(f=>{
    const el=document.querySelector(`input[data-k="${f.k}"]`);
    if(el && document.activeElement!==el) el.value = f.p? round((d[f.k]||0)*100,4) : (d[f.k]!=null? d[f.k] : "");
  });
}

/* 网格策略模拟（草案即时对比用，成交驱动型）——与实际运行一致：
   最新基准价(锚)随每一笔成交移动：跌破 锚×(1−间距) 买入、涨破 锚×(1+间距) 卖出（先进先出配对），
   一格成交后锚移到该格价，再触发只取相邻下一格；全网格上下轨 = 初始基准价×(1±间距)^格数，越界即穿轨不再提交。
   path 为收盘价序列；可选 hi/lo 为逐日最高/最低（与收盘对齐），用于识别盘中穿越（日波幅小于间距时尤其重要）。
   valPrice 为期末统一估值价（与详情页①实绩同用“最新收盘/现价”估值）；返回与 computeBacktest 对齐的
   totalProfit(市值法总收益)/unrealized(持仓浮动)/vGrid(落袋网格收益=totalProfit−unrealized)。 */
function simulateGrid(path, prm, hi, lo, valPrice, seedQty){
  const base0=prm.basePrice, sp=prm.spacingPct, qty=prm.qtyPerTrade;
  const upN=prm.upGrids||0, downN=prm.downGrids||0, feeRate=prm.feeRate, minFee=prm.minFee, init=prm.initCapital;
  if(!(base0>0) || !(qty>0)) return {realized:0, overall:0, gridRet:0, peak:0, totalAssets:init||0, totalProfit:0, unrealized:0, vGrid:0, buys:0, sells:0, holdRet:0, finalP:(path&&path.length)?path[path.length-1]:0};
  const upper= base0*Math.pow(1+sp, upN);      // 静态上轨（突破后暂停卖出）
  const lower = base0*Math.pow(1-sp, downN);   // 静态下轨（跌破后暂停买入）
  let anchor=base0, cash=init, pos=0, cost=0, realized=0, peak=0, buys=0, sells=0;   // cost=移动平均成本合计(含费,与①口径一致)
  /* 期初预建底仓（seedQty>0 时）：仅用于"待建仓标的"的收益预测——按现价基准一次性虚拟建底仓，
     之后网格仍只买卖配对浮仓（底仓不参与卖出配对），使预测收益不为 0、也更接近"按推荐方案部署"的实况 */
  if(seedQty>0){
    const sFee=Math.max(seedQty*base0*feeRate, minFee);
    if(cash > seedQty*base0 + sFee){ cash -= seedQty*base0 + sFee; pos = seedQty; cost += seedQty*base0 + sFee; }
  }
  const buyQ=[];
  for(let k=1;k<path.length;k++){
    const prev=path[k-1], b=path[k];
    const bHi = hi? hi[k] : b;                 // 当日最高
    const bLo = lo? lo[k] : b;                 // 当日最低
    /* —— 下行到当日低点：逐格买入，锚随成交下移（不越过下轨） —— */
    let px=prev, guard=0;
    while(px>anchor*(1-sp) && bLo<=anchor*(1-sp) && anchor*(1-sp)>=lower-1e-9 && guard++<300){
      const lv=anchor*(1-sp);
      const fee=Math.max(qty*lv*feeRate, minFee);
      if(cash < qty*lv+fee) break;             // 现金不足停止加仓
      cash-=qty*lv+fee; pos+=qty; cost+=qty*lv+fee; buyQ.push(lv); realized-=fee; buys++;
      anchor=lv; px=lv;
    }
    /* —— 从最新价反弹到当日高点：逐格卖出（需有配对库存），锚随成交上移（不越过上轨） —— */
    px = anchor;                                // 以最新锚为上行起点（已买入则更低，可吃日内反弹）
    guard=0;
    while(px<anchor*(1+sp) && bHi>=anchor*(1+sp) && anchor*(1+sp)<=upper+1e-9 && buyQ.length>0 && guard++<300){
      const lv=anchor*(1+sp);
      const bp=buyQ.shift();
      const fee=Math.max(qty*lv*feeRate, minFee);
      const avg = pos>0? cost/pos : lv;
      cash+=qty*lv-fee; pos-=qty; cost-=avg*qty; realized+=(lv-bp)*qty-fee; sells++;
      anchor=lv; px=lv;
    }
    const occ=init-cash; if(occ>peak) peak=occ;
  }
  const finalP=path[path.length-1];
  const val = (valPrice && valPrice>0)? valPrice : finalP;   // 统一估值价（对齐①的当前收盘/现价）
  const totalAssets=cash+pos*val;
  const totalProfit=totalAssets-init;                        // 市值法总收益（= ① totalProfit 同定义）
  const unrealized= pos>0? pos*val-cost : 0;                 // 持仓浮动（移动平均成本口径，同①）
  const vGrid=totalProfit-unrealized;                        // 落袋网格收益（= ① Vcum 同定义）
  const overall= init>0? totalProfit/init : 0;
  const gridRet=peak>0?realized/peak:0;
  return {realized, overall, gridRet, peak, totalAssets, totalProfit, unrealized, vGrid, buys, sells, holdRet:0, finalP};
}

/* 诊断 + 推荐（基于已载入行情路径） */
function analyze(g){
  const path=g.pricePath.map(x=>x.close);
  const n=path.length;
  if(n<2) return {empty:true, mean:0,sd:0,annVol:0,minP:0,maxP:0,range:0,dailyVol:0,cur:null,rec:null,sim:null,pathLen:n};
  const mean=path.reduce((a,b)=>a+b,0)/n;
  const sd=Math.sqrt(path.reduce((a,b)=>a+(b-mean)*(b-mean),0)/n);
  const rets=[]; for(let i=1;i<n;i++) rets.push((path[i]-path[i-1])/path[i-1]);
  const rm=rets.reduce((a,b)=>a+b,0)/rets.length;
  const rstd=Math.sqrt(rets.reduce((a,b)=>a+(b-rm)*(b-rm),0)/rets.length);
  const annVol=rstd*Math.sqrt(252);
  const minP=Math.min(...path), maxP=Math.max(...path);
  const range=(maxP-minP)/mean;
  const cur=simulateGrid(path,g.cond.params);
  const recSpacing=snapSpacingPct(rstd*1.6);
  const recUp=Math.max(1,Math.round(Math.log(maxP/g.cond.params.basePrice)/Math.log(1+recSpacing)));
  const recDown=Math.max(1,Math.round(Math.log(g.cond.params.basePrice/minP)/Math.log(1+recSpacing)));
  const rec={basePrice:g.cond.params.currentPrice, spacingPct:recSpacing, upGrids:recUp, downGrids:recDown,
             qtyPerTrade:g.cond.params.qtyPerTrade, feeRate:g.cond.params.feeRate, minFee:g.cond.params.minFee, initCapital:g.cond.params.initCapital};
  const sim=simulateGrid(path,rec);
  return {mean,sd,annVol,minP,maxP,range,dailyVol:rstd,cur,rec,sim,pathLen:n};
}

/* 波动率：从历史收盘价序列自行计算日波动率（日收益标准差）与年化波动率（×√252） */
function volFromCloses(closes){
  const n=closes.length;
  if(n<2) return {dailyVol:null, annVol:null};
  const rets=[]; for(let i=1;i<n;i++) rets.push((closes[i]-closes[i-1])/closes[i-1]);
  const rm=rets.reduce((a,b)=>a+b,0)/rets.length;
  const rstd=Math.sqrt(rets.reduce((a,b)=>a+(b-rm)*(b-rm),0)/rets.length);
  return {dailyVol:rstd, annVol:rstd*Math.sqrt(252)};
}

/* 构建波动率所需的收盘序列：在 K 线/行情序列末尾纳入「最新现价」作为最新观测，
   使日/年化波动率随最新标的价格动态更新（每次刷新行情后重算） */
function buildVolCloses(series, lastPrice){
  if(!series || series.length<2) return null;
  let closes = series.map(x=> (x && x.close!=null) ? x.close : x);
  const cur = (lastPrice!=null && isFinite(lastPrice)) ? lastPrice : null;
  if(cur && cur>0 && closes[closes.length-1]!==cur) closes = closes.concat([cur]);
  return closes;
}

/* 价格区间的「最低点」自动补全：腾讯拉取会带 low，但内置演示行情可能缺失，则从 K 线（优先腾讯日K，否则内置行情）按 252/60 根自行取最低 */
function deriveLows(g){
  const m=g.market;
  let low52 = m? m.low52 : null;
  let low60 = m? m.low60 : null;
  const src = (m && m.kline && m.kline.length) ? m.kline : g.pricePath;
  if(src && src.length){
    const n=src.length;
    if(low52==null) low52 = Math.min(...src.slice(Math.max(0,n-252)).map(x=> x.low!=null? x.low : x.close));
    if(low60==null) low60 = Math.min(...src.slice(Math.max(0,n-60)).map(x=> x.low!=null? x.low : x.close));
  }
  return {low52, low60};
}

/* 新建网格：根据行情统计给出初步推荐。
   稳健性：少样本回落保守 1.2%/日；日波动夹在 0.4%~2.5%（多数 A 股/ETF 合理区间）。
   间距 = 日波动 × 1.2（A 股 ETF 实测常用 1.0~1.5，过大则触发偏稀 → 触发频率与穿轨率都不友好）；
   额外按"穿轨率"兜底：若 1.2×σ 仍使间距 > 3×σ（即日波动的 3 倍），按 3×σ 上限就近半档取整，
   避免对低波品种给出 5% 这种"几乎不会触发"的间距。手续费在此口径下影响可忽略（>0.5% 即可覆盖）。 */
function recommend(market, price){
  let dv = 0.012;
  if(market && market.kline && market.kline.length>=40){
    const vc = buildVolCloses(market.kline, price);
    if(vc && vc.length>=40){ const v=volFromCloses(vc).dailyVol; if(v>0) dv=v; }
  } else if(market && market.dailyVol){
    dv = market.dailyVol;
  }
  dv = Math.max(0.004, Math.min(0.025, dv||0.012));    // 日波动 0.4%~2.5%
  let sp = snapSpacingPct(dv*1.2);                    // 主线：σ × 1.2
  if(sp>0.04) sp=0.04;                                // 硬封顶 4%
  /* 穿轨率兜底：若间距超过日波动 3 倍（≈ 触发频率过低），按 3×σ 向下就近半档 */
  const capByPass = Math.round((dv*3)*200)/200;
  if(capByPass>0 && sp>capByPass) sp = Math.max(0.005, Math.min(capByPass, 0.04));
  const base = price || (market&&market.kline&&market.kline.length? market.kline[market.kline.length-1].close : 4);
  const upT = Math.max((market&&market.high60)||price*1.05, (market&&market.high52)||price*1.05, base*1.05);
  const loT = Math.min((market&&market.low60)||price*0.95, (market&&market.low52)||price*0.95, base*0.95);
  let up = Math.max(1, Math.round(Math.log(upT/base)/Math.log(1+sp)));
  let down = Math.max(1, Math.round(Math.log(base/loT)/Math.log(1+sp)));
  up=Math.min(up,15); down=Math.min(down,15);
  return {basePrice:round(base,3), spacingPct:sp, upGrids:up, downGrids:down,
          qtyPerTrade:800, feeRate:0.0001, minFee:5, initCapital:60000, targetBaseCost:0,
          startDate:todayISO(), currentPrice:round(base,3)};
}

/* ============ 穿轨率诊断（波动率 × 区间覆盖率 × 波动体制） ============ */
/* 间距建议就近取 X.0 / X.5%（如 1.5%、2.0%），区间 0.5%~10% */
function snapSpacingPct(x){
  if(!(x>0)) return 0.005;
  return Math.max(0.005, Math.min(0.10, Math.round(x*200)/200));
}

/* 用于诊断的收盘价序列：与「行情诊断」波动率同口径（历史收盘 + 最新现价）；停止网格冻结在停止日 */
function closesForDiag(g){
  const m=g.market;
  const raw=(m&&m.kline&&m.kline.length>1)? m.kline : (g.pricePath&&g.pricePath.length>1? g.pricePath : null);
  if(!raw) return null;
  if(isStopped(g)){
    const t=truncateSeries(raw, g.stop.date);
    return (t&&t.length>1)? t.map(x=>x.close) : null;
  }
  return buildVolCloses(raw, g.cond.params.currentPrice);
}
function closesForNew(cr){
  return buildVolCloses((cr.market&&cr.market.kline&&cr.market.kline.length>1)? cr.market.kline : null, cr.price);
}

/* 穿轨率诊断核心计算 */
function diagCond(closes, prm){
  if(!closes || closes.length<12) return {ok:false, reason:"行情样本不足（需≥12 根日K），无法诊断"};
  if(!prm || !(prm.basePrice>0) || !(prm.spacingPct>0) || !((prm.upGrids||0)>0 && (prm.downGrids||0)>0))
    return {ok:false, reason:"需先填好基准价、间距与上/下格数后再诊断"};
  const n=closes.length;
  const rets=[]; for(let i=1;i<n;i++) rets.push(Math.log(closes[i]/closes[i-1]));
  const rm=rets.reduce((a,b)=>a+b,0)/rets.length;
  let sq=0; for(const r of rets) sq+=(r-rm)*(r-rm);
  const dailyVol=Math.sqrt(sq/rets.length);
  const annVol=dailyVol*Math.sqrt(252);
  const ks=Math.min(20, rets.length);
  const srets=rets.slice(rets.length-ks);
  const srm=srets.reduce((a,b)=>a+b,0)/srets.length;
  let ssq=0; for(const r of srets) ssq+=(r-srm)*(r-srm);
  const shortVol=Math.sqrt(ssq/srets.length);
  const rho=shortVol>0 && dailyVol>0 ? shortVol/dailyVol : null;   // 近20日波动 ÷ 全长波动
  const gl=gridLevels(prm), U=gl.upper, L=gl.lower;
  const aLog=Math.log(U/L)/2;                                       // 轨道半宽（对数单位）
  const E_T=(aLog*aLog)/(dailyVol*dailyVol);                        // 期望穿轨（交易日）
  const fPred=252/E_T;                                              // 预测穿轨频率（次/年）
  const hi=Math.max(...closes), lo=Math.min(...closes);
  const c=(hi-lo)>0? (U-L)/(hi-lo) : null;                          // 长期区间覆盖率
  const w20=closes.slice(Math.max(0,n-20));
  const hiS=Math.max(...w20), loS=Math.min(...w20);
  const dS=(hiS-loS)>0? (U-L)/(hiS-loS) : null;                     // 短期区间覆盖率
  let outD=0, ep=0, inside=true;                                    // 实证穿轨
  for(let i=0;i<n;i++){
    const o=closes[i]>U || closes[i]<L;
    if(o){ outD++; if(inside) ep++; }
    inside=!o;
  }
  const fT=outD/n, fE=ep*252/n;
  const w60=closes.slice(Math.max(0,n-60));
  const tU=w60.filter(x=>x>=U*(1-prm.spacingPct)).length;           // 近60日触上轨区
  const tL=w60.filter(x=>x<=L*(1+prm.spacingPct)).length;           // 近60日触下轨区
  const drift=(closes[n-1]-closes[0])/closes[0];
  const breakoutHigh = fE>12 || fT>0.15 || E_T<21;
  const idleLow = n>=60 && tU===0 && tL===0 && !breakoutHigh;
  let main="运行适中", tone="ok";
  if(breakoutHigh){ main="区间偏窄 · 穿轨过频"; tone="warn"; }
  else if(idleLow){ main="区间偏宽 · 外层格闲置"; tone="info"; }
  const notes=[];
  if(rho!=null && rho>1.3) notes.push("近20日波动为全长的 "+rho.toFixed(1)+"×，短期穿轨风险上升");
  else if(rho!=null && rho<0.7) notes.push("近20日波动收缩至 "+rho.toFixed(1)+"×，网格活跃度或下降");
  if(dS!=null && dS>1.3 && notes.length<2) notes.push("区间宽于近20日振幅约 "+dS.toFixed(1)+"×，外层格触发偏少");
  if(drift>0.25) notes.push("窗口内单边上行约 "+Math.round(drift*100)+"%，趋势市防单向突破");
  else if(drift<-0.25) notes.push("窗口内单边下行约 "+Math.round(-drift*100)+"%，防单向跌破");
  if(notes.length>2) notes.length=2;
  /* 建议：间距按有效波动率（扩张期取近20日），就近 X.0/X.5% */
  const effVol=(rho!=null && rho>1.3) ? shortVol : dailyVol;
  const spSug=snapSpacingPct(effVol*1.6);
  let upTar, dnTar, railNote;
  if(idleLow){
    upTar=Math.max(hiS*1.02, prm.basePrice*(1+prm.spacingPct));
    dnTar=Math.min(loS*0.98, prm.basePrice*(1-prm.spacingPct));
    railNote="按近20日振幅收窄轨道";
  } else {
    upTar=Math.max(hi*1.03, prm.basePrice*(1+prm.spacingPct));
    dnTar=Math.min(lo*0.97, prm.basePrice*(1-prm.spacingPct));
    railNote=breakoutHigh? "按建议间距向长期高低点加宽轨道" : "按建议间距贴长期高低点";
  }
  /* 格数按两侧实际需求分别计算；允许上下相差 1~2 格（不强制对称）。
     若相差过大，只把较小一侧补齐到「较大侧 − 2」，优先保证较远一侧轨道被覆盖，避免资金过度倾斜 */
  const rUp=Math.log(upTar/prm.basePrice)/Math.log(1+spSug);
  const rDown=Math.log(prm.basePrice/dnTar)/Math.log(1+spSug);
  const big=Math.max(1, Math.min(18, Math.round(Math.max(rUp, rDown))));
  const small=Math.max(1, Math.min(18, Math.round(Math.min(rUp, rDown))));
  const capSmall=Math.max(1, big-2);
  let gUp, gDown;
  if(rUp>=rDown){ gUp=big; gDown=Math.max(small, capSmall); }
  else { gDown=big; gUp=Math.max(small, capSmall); }
  return {ok:true, dailyVol,annVol,E_T,fPred,c,dS,rho,fE,fT,tU,tL,U,L,main,tone,notes,breakoutHigh,idleLow,
          spSug,gUp,gDown,railNote};
}

/* 估算按某条件单参数“满仓运行”所需投入：底仓成本（基准价×建议底仓数）+ 下行全部买入层成交额（未计手续费）。
   用于以「初始资金」为基点，判断建议的间距/格数调整后资金是否够用 */
function needCapital(prm){
  const base = (prm && prm.basePrice>0)? prm.basePrice : 0;
  const sp = (prm && prm.spacingPct>0)? prm.spacingPct : 0;
  const dn = Math.max(0, Math.floor(prm && prm.downGrids>0? prm.downGrids : 0));
  const q = Math.max(0, prm && prm.qtyPerTrade>0? prm.qtyPerTrade : 0);
  const init = (prm && prm.initCapital>0)? prm.initCapital : 0;
  const bq = (prm && prm.targetBaseCost>0)? prm.targetBaseCost
           : (base>0 && init>0)? Math.ceil(init/2/base/100)*100 : 0;
  let downSum = 0;
  if(base>0 && q>0 && sp>0){
    for(let i=1;i<=dn;i++) downSum += base*Math.pow(1-sp,i)*q;
  }
  const baseCost = base*bq;
  return {need: baseCost+downSum, baseCost, downSum, bq};
}

/* ============ 持仓控制（随格数与上下轨自动推算，超限暂停买卖并提醒） ============ */
/* 上限 posMaxQty = 底仓 + 下格数×每笔数量 —— 价格跌破下轨（全部下格买入成交后）的满仓持仓，超出则暂停买入委托；
   下限 posMinQty = max(0, 底仓 − 上格数×每笔数量) —— 价格突破上轨（浮动部分卖尽后）的剩余持仓，低于则暂停卖出委托。
   底仓优先取「建议底仓数量」，缺省按 初始资金÷2÷基准价 补算（向上取整到百）。 */
function calcPosCaps(p){
  const out={valid:false, base:0, min:0, max:0};
  if(!p) return out;
  const q=p.qtyPerTrade>0? Math.round(p.qtyPerTrade) : 0;
  const up=p.upGrids>0? Math.round(p.upGrids) : 0;
  const dn=p.downGrids>0? Math.round(p.downGrids) : 0;
  if(!(q>0) || !((up||dn)>0)) return out;
  let bq=p.targetBaseCost>0? Math.round(p.targetBaseCost) : 0;
  if(!(bq>0) && p.initCapital>0 && p.basePrice>0) bq=Math.ceil(p.initCapital/2/p.basePrice/100)*100;
  out.base=bq; out.max=Math.round(bq+dn*q); out.min=Math.max(0, Math.round(bq-up*q)); out.valid=true;
  return out;
}

/* 每笔数量建议（可推算）：网格下行总加仓预算用“半仓现金”，按下行各层实际触发价（几何间距、越买越低）分摊，并受“底仓÷上格数”约束（保证单边上涨时上格有货可卖）。
   修正说明：直接用 半仓÷格数÷现价 会因下层价格更低而偏保守；以 Σ(基准价×(1−间距)^i, i=1..下格数) 分摊更接近可承受上限。 */
function calcQtySug(p){
  const out={valid:false, qty:0, cashLim:null, baseLim:null};
  if(!p) return out;
  const C=p.initCapital>0? p.initCapital : 0;
  const base=p.basePrice>0? p.basePrice : 0;
  const sp=p.spacingPct>0? p.spacingPct : 0;
  const dn=Math.floor(p.downGrids||0), up=Math.floor(p.upGrids||0);
  if(!(C>0 && base>0)) return out;
  let bq=p.targetBaseCost>0? Math.round(p.targetBaseCost) : 0;
  if(!(bq>0)) bq=Math.ceil(C/2/base/100)*100;
  if(!(bq>0)) return out;
  if(sp>0 && dn>0){
    let sum=0; for(let i=1;i<=dn;i++) sum+=base*Math.pow(1-sp,i);
    out.cashLim=Math.floor((C/2)*0.98/sum);        // 半仓现金（留 2% 手续费余量）÷ 下行层价和
  }
  if(up>0) out.baseLim=Math.floor(bq/up);          // 底仓 ÷ 上格数：卖出供给约束
  if(out.cashLim==null && out.baseLim==null) return out;
  const raw=Math.min(out.cashLim!=null? out.cashLim : Infinity, out.baseLim!=null? out.baseLim : Infinity);
  out.qty=Math.max(0, Math.floor(raw/100)*100);
  out.valid=out.qty>0;
  return out;
}

/* ============ 底仓 = 实际建仓持仓（"是否完成建仓"开关） ============ */
/* 实际完成建仓的持仓量：交易明细中 类型=建仓 的累计数量；无建仓标记时回退到当前总持仓 */
function actualBaseOf(g){
  if(!g || !g.trades) return 0;
  let s=0; g.trades.forEach(t=>{ if(t.type==="建仓") s+=(t.qty||0); });
  if(s>0) return Math.round(s);
  try{
    const bt=computeBacktest(g); const last=bt.rows[bt.rows.length-1];
    if(last && last.I) return Math.round(last.I);
  }catch(e){}
  return 0;
}
/* 初次设置/修改条件单时的勾选：已完成建仓 → 底仓数量取实际持仓；未勾选 → 按 半仓÷启动价 估算 */
function toggleBaseActual(id, checked){
  const g=getGrid(id); if(!g||!g._draft) return;
  g._draft._builtActual = !!checked;
  if(checked){
    const n=actualBaseOf(g);
    if(!(n>0)){
      g._draft._builtActual=false;
      toast("未检测到建仓成交，无法按实际持仓计算，已按半仓估算");
    } else {
      g._draft.targetBaseCost=n; g._draft._autoBase=false;
    }
  } else {
    g._draft._autoBase=true;
  }
  recalcDerived(g._draft, (g.market? g.market.kline : g.pricePath));
  syncAutoFields(g._draft);
  syncPosInputs(g._draft);
  updateEditCompare(g);
  refreshEditDiag(g);
}

/* 将建议参数一键写入当前草稿（owner：网格 id；“new”=新建向导草稿） */
function applySugToCond(owner, patch){
  let d=null, kline=null, isNew=(owner==="new");
  if(isNew){
    const cr=state.creating; if(!cr||!cr.draftCond){ toast("暂无草稿"); return; }
    d=cr.draftCond; kline=cr.market? cr.market.kline : null;
  } else {
    const g=getGrid(owner); if(!g||!g._draft){ toast("暂无草稿"); return; }
    d=g._draft; kline=(g.market? g.market.kline : (g.pricePath&&g.pricePath.length? g.pricePath : null));
  }
  for(const k in patch){ if(patch[k]!=null) d[k]=patch[k]; }
  recalcDerived(d, kline);
  for(const k in patch){
    const el=document.querySelector('input[data-k="'+k+'"]');
    if(!el) continue;
    const f=COND_FIELDS.find(x=>x.k===k);
    el.value = (f&&f.p)? round((d[k]||0)*100,4) : (d[k]!=null? d[k] : "");
  }
  syncAutoFields(d); syncPosInputs(d);
  if(isNew){ refreshNewDiag(); }
  else { const g=getGrid(owner); updateEditCompare(g); refreshEditDiag(g); }
  toast("已填入，可继续微调后应用");
}

/* “收益优先方案”右栏内容（自动扫描，owner 为空时只展示不提供填入） */

    <div data-tip="落袋网格收益 vGrid：当前 → 收益最优（同一段行情、同一估值价、同①口径）。">网格收益：<b>${fmt(curV,0)}</b> → <b class="${signClass(diff)}">${fmt(sc.bestScore,0)}</b>（Δ <b class="${signClass(diff)}">${fmt(diff,0)}</b>）</div>
    <div class="cd-dim" style="margin-top:2px">总收益率 ${pct(simB.overall,2)}${fTxt? " · "+fTxt : ""} · 满仓需资金 ¥${fmt(need,0)}${initN>0? "（初始 ¥"+fmt(initN,0)+"）":""}${need>initN&&initN>0? "，略超":""} · 历史最优≠未来最优</div>

function feeRatioOf(prm){
  const P=prm.basePrice>0?prm.basePrice:0, sp=prm.spacingPct>0?prm.spacingPct:0, q=Math.max(0,Math.round(prm.qtyPerTrade||0));
  const feeRate=prm.feeRate>0?prm.feeRate:0.0001, minFee=prm.minFee>0?prm.minFee:5;
  if(!(P>0&&sp>0&&q>0)) return null;
  const step=P*sp;
  const gross=q*step;
  const feeBuy=Math.max(P*q*feeRate,minFee), feeSell=Math.max((P+step)*q*feeRate,minFee);
  const fee=feeBuy+feeSell;
  const ratio=gross>0?fee/gross:0;
  const net=gross-fee;
  const minDom=(P*q*feeRate<=minFee*1.001)||((P+step)*q*feeRate<=minFee*1.001);
  return {P,sp,q,gross,feeBuy,feeSell,fee,ratio,net,minDom};
}

function condDiagHTML(prm, closes, owner, src){

  const tipQty="每笔数量可按你的思路推算：先由 半仓现金÷启动价 得到建议底仓，剩余半仓即下行加仓预算，把格数定好后每格股数即可反推。修正两点：① 下层触发价更低，应按下行各层实际价之和（Σ 基准价×(1−间距)^i）分摊半仓现金，直接 半仓÷格数÷现价 会偏保守；② 每笔还须 ≤ 底仓÷上格数，否则单边上涨时上格无货可卖。最终取两约束较小者并按 100 取整。";
  if(qs.valid){

    adv.push({tip:tipQty, patch:{qtyPerTrade:qs.qty}, html:`每笔数量：建议 <b>${fmt(qs.qty,0)}</b>（现 ${qtyTxt}）`+(qtySame? "，一致可维持" : (curQty>qs.qty? "，超出半仓预算宜下调" : "，资金富余可上调（非必须）"))});
  }
  const d2=diagCond(closes, sim);
  /* 资金占用：以「初始资金」为基点，仅在按建议参数确实超投或富余过多(且外层闲置)时才提示调整资金 */
  const tipMoney = "所需投入按网格满仓情形估算：底仓成本（基准价 × 建议底仓数）+ 下行全部买入层成交额（每笔数量×各层触发价之和，未计手续费）。间距/格数/每笔数量若有建议，按整套建议值计入。以“初始资金”为基准对比——只有按建议参数运行时确实超出初始投入（需加钱），或富余过多且外层长期闲置（可减钱）时，才会出现本条建议。";
  const initCap = (prm.initCapital>0)? prm.initCapital : 0;
  if(initCap>0){
    const needSug = needCapital(sim).need;
    if(needSug > initCap*1.01){
      const diffTxt = red("超出 ¥"+fmt(needSug-initCap,0));
      const overT=Math.ceil(needSug/1000)*1000;
      adv.push({tip:tipMoney, patch:{initCapital:overT}, html:`资金：按建议参数满仓需投入 ≈ <b>¥${fmt(needSug,0)}</b>（初始投入 ¥${fmt(initCap,0)}，${diffTxt}）——建议将资金投入修改为 <b>¥${fmt(overT,0)}</b>`});
    } else if(idle && needSug < initCap*0.6){
      const lowT=Math.max(1000, Math.ceil(needSug/1000)*1000);
      adv.push({tip:tipMoney, patch:{initCapital:lowT}, html:`资金：按建议参数满仓仅需投入 ≈ <b>¥${fmt(needSug,0)}</b>（约为初始投入的 ${Math.max(0,Math.round(needSug/initCap*100))}%），且外层已闲置——可考虑将资金投入调低至 ≈ <b>¥${fmt(lowT,0)}</b>（也可维持现投入）`});
    }
  }
  if(d2.ok && d2.fPred && d.fPred>d2.fPred+0.5)
    adv.push({tip:"按建议间距与格数重算后的预测穿轨频率，用于对比调整前后效果。",
              html:`调整后预测穿轨 ≈${fTxt(d2.fPred)}（现 ≈${fTxt(d.fPred)}）`});
  const dim = d.notes.length? `<div class="cd-dim">· ${d.notes.join("<br>· ")}</div>` : "";
  const tipVerdict = "裁定规则：① 实测 &gt;12 次/年、区间外 &gt;15% 交易日、或预测 E[T]&lt;21 日 → 区间偏窄·穿轨过频；② 否则若近60日上下轨均未被触及 → 外层格闲置；③ 其余 → 运行适中。";
  const pc=profitColInner(prm,src,owner); const rightCol=pc.html;   // 收益优先方案（自动扫描，右栏）
  const frCur=feeRatioOf(prm), frSug=feeRatioOf(sim), frProf=pc.b?feeRatioOf(pc.b):null;
  const feeBlock=`<div class="cd-fee">
    <div class="cd-fee-h">每回合手续费占比（一买一卖）<span class="cd-fee-sub">毛落袋=价格差×股数 · 占比=手续费÷毛落袋</span></div>
    <div class="cd-fee-grid">
      <div class="cd-fee-row head"><span>方案</span><span>毛落袋</span><span>手续费</span><span>占比</span><span>净落袋</span></div>
      ${feeRowHTML("当前", frCur, null)}
      ${feeRowHTML("风控建议", frSug, frCur)}
      ${frProf?feeRowHTML("收益优先", frProf, frCur):""}
    </div>
    ${feeVerdictHTML(frCur, frSug, frProf)}
  </div>`;
  const rowsHtml = adv.map((x,i)=>`<div data-tip="${x.tip}">${i+1}. ${x.html}${owner && x.patch? ` <button class="btn ghost mini" onclick="applySugToCond('${owner}',${objLit(x.patch)})">填入</button>` : ""}</div>`).join("");
  return `<div class="cd">
    <div class="cd-top"><span data-tip="该面板用于评估网格区间被价格突破的难易程度：结合波动率（σ）、区间覆盖率（长/短期高低点）与实测数据，判断条件单是否需要调整格数或间距。">条件单诊断</span><span class="cd-tone ${d.tone}" data-tip="${tipVerdict}">${d.main}</span></div>
    <div class="cd-grid">${cells}</div>
    ${feeBlock}
    <div class="cd-sug">
      <div class="cd-sug-h">条件单修改建议<span class="cd-sug-sub">左=风控/资金优先 · 右=收益优先（自动）</span></div>
      <div class="cd-sug-grid">
        <div class="cd-sug-col">
          <div class="cd-sug-h2">风控优先建议</div>
          <div class="cd-adv">${rowsHtml}</div>
          ${dim}

        <div class="cd-sug-col">
          <div class="cd-sug-h2">收益优先方案</div>
          ${rightCol}

  </div>`;
}
